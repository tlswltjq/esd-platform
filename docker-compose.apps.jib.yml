# Jib 이미지를 사용하는 선택적 오버라이드. 이미지 생성은 별도의 Gradle 작업이다.
# ./gradlew jibDockerBuild
# docker compose -f docker-compose.apps.yml -f docker-compose.apps.jib.yml up -d --no-build
# Jib은 Docker HEALTHCHECK를 생성하지 않으므로 기존 검사와 시간을 Compose에서 유지한다.
x-jib-health: &jib-health
  interval: 15s
  timeout: 3s
  start_period: 40s
  retries: 5

services:
  auth:
    build: !reset null
    image: ${STOVE_JIB_REGISTRY:-stove}/auth:${STOVE_IMAGE_TAG:-latest}
    healthcheck:
      <<: *jib-health
      test: [CMD-SHELL, "wget -qO- http://localhost:8091/actuator/health | grep -q UP || exit 1"]
  gateway:
    build: !reset null
    image: ${STOVE_JIB_REGISTRY:-stove}/gateway:${STOVE_IMAGE_TAG:-latest}
    healthcheck:
      <<: *jib-health
      test: [CMD-SHELL, "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
  studio:
