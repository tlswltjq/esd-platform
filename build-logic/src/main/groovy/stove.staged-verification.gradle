// 공유 픽스처(testFixtures)와 과거 DB 이행 검사(migrationTest)를 나눈 모듈용.
// 비용을 확인한 두 모듈(Order·Payment)부터 공유 픽스처와 과거 DB 이행 검사의 경계를 분리한다.
plugins {
    id 'stove.java-base'
    id 'java-test-fixtures'
}

def infraTestThrottle = gradle.sharedServices.registrations.named('infraTestThrottle').get().service

dependencies {
    testFixturesImplementation project(':common:messaging-kafka')
    testFixturesCompileOnly 'jakarta.persistence:jakarta.persistence-api'
}

// 실행 앱은 plain jar를 만들지 않으므로 픽스처도 main의 클래스 출력을 직접 쓴다.
sourceSets.testFixtures.compileClasspath += sourceSets.main.output
sourceSets.testFixtures.runtimeClasspath += sourceSets.main.output
sourceSets.test.compileClasspath += sourceSets.main.output
sourceSets.test.runtimeClasspath += sourceSets.main.output
dependencies {
    integrationTestImplementation testFixtures(project(project.path))
}

tasks.named('integrationTest') {
    useJUnitPlatform { excludeTags 'migration' }
}

tasks.register('migrationTest', Test) {
    group = 'verification'
    description = '과거 DB 버전의 데이터 보존·이관을 실제 인프라로 검증한다'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    usesService(infraTestThrottle)
    systemProperty 'spring.datasource.hikari.maximum-pool-size', '5'
    useJUnitPlatform {
        includeTags 'migration'
        excludeTags 'known-defect'
    }
    shouldRunAfter tasks.named('test'), tasks.named('integrationTest')
}
tasks.named('check') { dependsOn tasks.named('migrationTest') }
