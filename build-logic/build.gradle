plugins {
    id 'groovy-gradle-plugin'
}

// convention plugin 이 적용하는 플러그인의 구현. 버전은 gradle/libs.versions.toml 이 정한다.
dependencies {
    implementation libs.spring.boot.gradle.plugin
    implementation libs.dependency.management.gradle.plugin
    implementation libs.jib.gradle.plugin
    implementation libs.pitest.gradle.plugin
}
