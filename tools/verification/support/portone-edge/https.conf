log_format portone_webhook '$time_iso8601 $status $request_time';

server {
    listen 443 ssl default_server;
    server_name __PUBLIC_IP__;
    server_tokens off;
    access_log off;
    client_max_body_size 64k;
    client_body_timeout 10s;

    ssl_certificate /etc/letsencrypt/live/portone-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portone-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /api/v1/payments/webhooks/portone {
        if ($request_method != POST) { return 405; }
        access_log /dev/stdout portone_webhook;
        proxy_pass http://127.0.0.1:18883;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 25s;
        proxy_send_timeout 10s;
    }

    location / {
        return 404;
    }
}
