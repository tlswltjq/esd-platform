server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: catalog

  # 진행 중인 요청을 기다리는 상한. compose 의 stop_grace_period(40s)보다 짧아야 한다 —
  # 뒤집히면 SIGKILL 이 먼저 도착해 graceful 이 잘린다(D-035). 부등호는 테스트가 지킨다.
  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/stove_catalog?serverTimezone=UTC&characterEncoding=UTF-8&rewriteBatchedStatements=true
    username: ${DB_USER:stove}
    password: ${DB_PASSWORD:stove1234}
    hikari:
      maximum-pool-size: 20
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: validate          # 스키마 변경은 Flyway 로만
    open-in-view: false           # 커넥션 점유 시간 최소화
    properties:
      hibernate:
        jdbc.batch_size: 50
        order_inserts: true
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      # 헤더의 traceparent 를 이어받아 리스너 처리를 발행 측과 같은 트레이스에 붙인다.
      # 끄면 카프카를 건널 때마다 트레이스가 새로 시작돼 흐름이 조각난다.
      observation-enabled: true           # 처리 성공 레코드 단위 커밋

stove:
  catalog:
    reindex:
      page-size: 500          # 한 트랜잭션에서 발행할 상품 수
      page-interval: 200ms    # 페이지 사이 대기 — 릴레이를 재색인이 독점하지 않게 한다
  outbox:
    relay-enabled: true
    batch-size: 200
    poll-interval-ms: 200   # 한산할 때 종단 지연의 바닥 — 근거와 적응형 폴링 검토는 OutboxRelay 주석
    max-retry: 10

management:
  endpoints.web.exposure.include: health,info,prometheus,metrics
  endpoint.health.probes.enabled: true
  metrics.tags.application: catalog
  # 전량 샘플링 — 데모에서는 트레이스가 드문드문 있으면 확인 자체가 안 된다. 운영이라면 낮춰 잡는다.
  tracing.sampling.probability: ${TRACING_SAMPLE_RATE:1.0}
  otlp.tracing.endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    com.stove: DEBUG
