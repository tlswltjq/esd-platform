server:
  port: 8085
  shutdown: graceful

spring:
  application:
    name: studio

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/stove_studio?serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USER:stove}
    password: ${DB_PASSWORD:stove1234}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record

stove:
  # 빌드 바이너리 저장소. mock = 경로만 발급, s3 = MinIO/S3 presigned PUT
  storage:
    provider: ${STORAGE_PROVIDER:mock}
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${STORAGE_ACCESS_KEY:stove}
    secret-key: ${STORAGE_SECRET_KEY:stove1234}
    bucket: ${STORAGE_BUCKET:stove-builds}
    presign-ttl: 15m

  outbox:
    relay-enabled: true
    batch-size: 200
    poll-interval-ms: 1000
    max-retry: 10

management:
  endpoints.web.exposure.include: health,info,prometheus,metrics
  endpoint.health.probes.enabled: true
  metrics.tags.application: studio

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"
  level:
    com.stove: DEBUG
