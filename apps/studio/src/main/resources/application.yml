server:
  port: 8085
  shutdown: graceful
spring:
  application:
    name: studio
  servlet:
    multipart:
      max-file-size: ${STUDIO_MAX_FILE_SIZE:1GB}
      max-request-size: ${STUDIO_MAX_REQUEST_SIZE:1025MB}
      file-size-threshold: 0
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8091}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8091/oauth2/jwks}
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/stove_studio?serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USER:stove}
    password: ${DB_PASSWORD:stove1234}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      observation-enabled: true
stove:
  asset:
    public-base-url: ${STUDIO_ASSET_PUBLIC_BASE_URL:http://localhost:8080}
    max-thumbnail-bytes: ${MAX_THUMBNAIL_BYTES:5242880}
  storage:
    provider: s3
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    presign-endpoint: ${STORAGE_PRESIGN_ENDPOINT:${STORAGE_ENDPOINT:http://localhost:9000}}
    access-key: ${STORAGE_ACCESS_KEY:stove}
    secret-key: ${STORAGE_SECRET_KEY:stove1234}
    bucket: ${STORAGE_BUCKET:stove-builds}
    encryption-enabled: ${STORAGE_ENCRYPTION_ENABLED:true}
  upload:
    max-artifact-bytes: ${MAX_ARTIFACT_BYTES:1073741824}
  outbox:
    relay-enabled: true
    batch-size: 200
    poll-interval-ms: 200
    max-retry: 10
management:
  endpoints.web.exposure.include: health,info,prometheus,metrics
  endpoint.health.probes.enabled: true
  metrics.tags.application: studio
  tracing.sampling.probability: ${TRACING_SAMPLE_RATE:1.0}
  otlp.tracing.endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
