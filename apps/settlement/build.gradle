dependencies {
    integrationTestRuntimeOnly 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation libs.springdoc.webmvc.ui

    implementation project(':common:web')
    implementation project(':common:security')
    implementation project(':common:messaging')
    // 메시징은 Kafka 단일 구현이다(결정 227). 리스너가 @KafkaListener·ConsumerRecord 로 직접 받는다.
    implementation project(':common:messaging-kafka')

    testImplementation 'org.springframework.kafka:spring-kafka-test'
}

// Test-only process fixture; excluded from the production bootJar.
tasks.register('writeVerificationClasspath') {
    dependsOn tasks.named('integrationTestClasses')
    doLast {
        layout.buildDirectory.file('verification-classpath.txt').get().asFile.text = sourceSets.integrationTest.runtimeClasspath.asPath
    }
}
