server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: order

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/stove_order?serverTimezone=UTC&characterEncoding=UTF-8&rewriteBatchedStatements=true
    username: ${DB_USER:stove}
    password: ${DB_PASSWORD:stove1234}
    hikari:
      maximum-pool-size: 20
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.batch_size: 50
        order_inserts: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      # 헤더의 traceparent 를 이어받아 리스너 처리를 발행 측과 같은 트레이스에 붙인다.
      # 끄면 카프카를 건널 때마다 트레이스가 새로 시작돼 흐름이 조각난다.
      observation-enabled: true

stove:
  order:
    # 결제를 시작하지 않은 주문을 이만큼 지나면 만료시킨다.
    # **payment 의 window(30분)보다 길어야 한다** — 짧으면 아직 결제할 수 있는 주문을 order 가
    # 먼저 닫아, 사용자는 결제창을 열 수 있는데 주문이 없는 상태를 본다. 두 배로 잡아
    # 두 서비스의 시계가 조금 어긋나도 순서가 뒤집히지 않게 한다.
    expire-after: ${ORDER_EXPIRE_AFTER:1h}
    # 한 회차에 만료시킬 최대 건수. 밀린 것을 한 번에 없애는 것이 목적이 아니라 늘지 않게 하는 것이
    # 목적이다 — 실측으로 밀린 것이 98,750건이었고 한 트랜잭션에 넣으면 락과 언두가 그만큼 커진다.
    expire-batch-size: ${ORDER_EXPIRE_BATCH:500}
    # 주기 × 배치 = 처리량이다. 500 × 60분 = 시간당 3만 건으로 실측 유입(하루 1~3건)의 몇 자릿수 위다.
    expire-sweep-interval-ms: ${ORDER_EXPIRE_SWEEP_MS:60000}
  catalog:
    base-url: ${CATALOG_BASE_URL:http://localhost:8081}
    connect-timeout: 1s
    read-timeout: 2s
  outbox:
    relay-enabled: true
    batch-size: 200
    poll-interval-ms: 200   # 한산할 때 종단 지연의 바닥 — 근거와 적응형 폴링 검토는 OutboxRelay 주석
    max-retry: 10

management:
  endpoints.web.exposure.include: health,info,prometheus,metrics
  endpoint.health.probes.enabled: true
  metrics.tags.application: order
  # 전량 샘플링 — 데모에서는 트레이스가 드문드문 있으면 확인 자체가 안 된다. 운영이라면 낮춰 잡는다.
  tracing.sampling.probability: ${TRACING_SAMPLE_RATE:1.0}
  otlp.tracing.endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    com.stove: DEBUG
