server:
  port: 8088
  shutdown: graceful

spring:
  application:
    name: download

  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/stove_download}
      auto-index-creation: true

  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    consumer:
      group-id: download
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record

stove:
  cdn:
    base-url: https://cdn.stove.local
    signing-key: ${CDN_SIGNING_KEY:local-dev-signing-key}
    ttl: 10m

management:
  endpoints.web.exposure.include: health,info,prometheus,metrics
  endpoint.health.probes.enabled: true
  metrics.tags.application: download

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"
  level:
    com.stove: DEBUG
