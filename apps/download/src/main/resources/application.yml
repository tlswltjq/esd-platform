server:
  port: 8088
  shutdown: graceful

spring:
  application:
    name: download

  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/stove_download}
      auto-index-creation: true

  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      # 헤더의 traceparent 를 이어받아 리스너 처리를 발행 측과 같은 트레이스에 붙인다.
      # 끄면 카프카를 건널 때마다 트레이스가 새로 시작돼 흐름이 조각난다.
      observation-enabled: true

stove:
  # 다운로드 URL 발급 전략. cdn = 자체 HMAC 토큰, s3 = 스토리지 presigned GET
  download:
    url-strategy: ${DOWNLOAD_URL_STRATEGY:cdn}

  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${STORAGE_ACCESS_KEY:stove}
    secret-key: ${STORAGE_SECRET_KEY:stove1234}
    presign-ttl: 10m

  cdn:
    base-url: https://cdn.stove.local
    signing-key: ${CDN_SIGNING_KEY:local-dev-signing-key}
    ttl: 10m

management:
  endpoints.web.exposure.include: health,info,prometheus,metrics
  endpoint.health.probes.enabled: true
  metrics.tags.application: download
  # 전량 샘플링 — 데모에서는 트레이스가 드문드문 있으면 확인 자체가 안 된다. 운영이라면 낮춰 잡는다.
  tracing.sampling.probability: ${TRACING_SAMPLE_RATE:1.0}
  otlp.tracing.endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    com.stove: DEBUG
