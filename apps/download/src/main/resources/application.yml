server:
  port: 8088
  shutdown: graceful

spring:
  application:
    name: download
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8091}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8091/oauth2/jwks}

  # 진행 중인 요청을 기다리는 상한. compose 의 stop_grace_period(40s)보다 짧아야 한다 —
  # 뒤집히면 SIGKILL 이 먼저 도착해 graceful 이 잘린다(D-035). 부등호는 테스트가 지킨다.
  lifecycle:
    timeout-per-shutdown-phase: 30s

stove:
  messaging:
    ops:
      enabled: false
  download:
    license-base-url: ${LICENSE_BASE_URL:}
    catalog-base-url: ${CATALOG_BASE_URL:}
    catalog-service-key: ${CATALOG_DOWNLOAD_SERVICE_KEY:}
    connect-timeout: 2s
    read-timeout: 5s
  download-storage:
    endpoint: ${STORAGE_ENDPOINT:}
    presign-endpoint: ${STORAGE_PRESIGN_ENDPOINT:}
    region: ${STORAGE_REGION:us-east-1}
    bucket: ${STORAGE_BUCKET:}
    access-key: ${DOWNLOAD_STORAGE_ACCESS_KEY:}
    secret-key: ${DOWNLOAD_STORAGE_SECRET_KEY:}
    presign-ttl: ${DOWNLOAD_BUILD_URL_TTL:PT5M}
    call-timeout: 5s

management:
  endpoints.web.exposure.include: health,info,prometheus,metrics
  endpoint.health.probes.enabled: true
  metrics.tags.application: download
  # 전량 샘플링 — 데모에서는 트레이스가 드문드문 있으면 확인 자체가 안 된다. 운영이라면 낮춰 잡는다.
  tracing.sampling.probability: ${TRACING_SAMPLE_RATE:1.0}
  otlp.tracing.endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    com.stove: DEBUG
