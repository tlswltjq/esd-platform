server:
  port: 8088
  shutdown: graceful

spring:
  application:
    name: download

  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/stove_download}
      auto-index-creation: true

  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record

stove:
  # 다운로드 URL 발급 전략. cdn = 자체 HMAC 토큰, s3 = 스토리지 presigned GET
  download:
    url-strategy: ${DOWNLOAD_URL_STRATEGY:cdn}

  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${STORAGE_ACCESS_KEY:stove}
    secret-key: ${STORAGE_SECRET_KEY:stove1234}
    presign-ttl: 10m

  cdn:
    base-url: https://cdn.stove.local
    signing-key: ${CDN_SIGNING_KEY:local-dev-signing-key}
    ttl: 10m

management:
  endpoints.web.exposure.include: health,info,prometheus,metrics
  endpoint.health.probes.enabled: true
  metrics.tags.application: download

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"
  level:
    com.stove: DEBUG
