# API 게이트웨이(결정 223·224). 내부망에만 있고 BFF만 부른다. BFF가 릴레이한 Bearer를 검증하고, 역할별 경로 규칙과
# 라우팅 표로 업무 서비스에 보낸다. 세션·OAuth 클라이언트·브라우저 입구는 웹 BFF(apps/web-bff)에 있다.
server:
  port: 8093
  # 모든 BFF 트래픽이 이 문을 지난다(D-034). 여기가 먼저 닫히면 하류가 마친 응답을 내보낼 문이 없다.
  shutdown: graceful

spring:
  application:
    name: gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8091}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8091/oauth2/jwks}

  # 진행 중인 요청을 기다리는 상한. 컨테이너 종료 유예(40초)보다 짧아야 한다 —
  # 뒤집히면 SIGKILL 이 먼저 도착해 graceful 이 잘린다(D-035).
  lifecycle:
    timeout-per-shutdown-phase: 30s

  cloud:
    gateway:
      server:
        webflux:
          # 하류 Tomcat은 keep-alive 유휴 연결을 60초에 닫는다(connectionTimeout 기본값). 풀 유휴 상한이 없으면(기본 null)
          # 하류가 닫는 바로 그 순간 그 연결을 골라 요청이 응답 전에 끊기고 500이 된다(D-053, 야간 CI 11-10·11-22).
          # 하류 유휴 닫기보다 짧아야 한다 — common:test GatewayIdleTimeoutContractTest가 지킨다.
          httpclient:
            pool:
              max-idle-time: 30s
          # 추적 컨텍스트(traceparent)는 웹 BFF가 트레이스를 열고 이 게이트웨이가 이어받아
          # 하류로 전달한다 — 라우팅 규칙에서 헤더를 손댈 일이 없다.
          # 각 서비스는 그 값을 이어받고, 응답에는 traceId 를 X-Correlation-Id 로 돌려준다
          # (common:web 의 TraceIdResponseFilter).
          routes:
            # ── 회원가입·OIDC ───────────────────────────────────────
            # 회원가입·비밀번호 등 Auth의 업무 API. 브라우저 로그인 경로(인가·로그인 폼·OIDC 로그아웃)는 웹 BFF가
            # Auth로 바로 보낸다(결정 223).
            - id: auth-api
              uri: ${AUTH_URI:http://localhost:8091}
              predicates:
                - Path=/api/v1/auth/**
            - id: auth-admin-accounts
              uri: ${AUTH_URI:http://localhost:8091}
              predicates:
                - Path=/api/v1/admin/accounts/**
                - Method=POST
              filters: [RemoveRequestHeader=X-Member-Id]

            # ── 유저 대면 ─────────────────────────────────────────
            - id: store
              uri: ${STORE_URI:http://localhost:8087}
              predicates:
                - Path=/api/v1/storefront/**
            # 상품 상세 조회만 공개. 가격 재계산(POST /quote)·운영툴 API 는
            # 이 라우트에 매칭되지 않으므로 외부에서 호출할 수 없다.
            - id: catalog-sales
              uri: ${CATALOG_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/products/by-code/*/sales
                - Method=GET,PUT
              filters: [RemoveRequestHeader=X-Member-Id]
            - id: catalog-sales-admin
              uri: ${CATALOG_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/admin/products/*/sales/restriction
                - Method=GET,PUT
              filters: [RemoveRequestHeader=X-Member-Id]
            - id: catalog-download-restriction-admin
              uri: ${CATALOG_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/admin/products/*/downloads/restriction
                - Method=GET,PUT
              filters: [RemoveRequestHeader=X-Member-Id]
            - id: catalog-listing-seller
              uri: ${CATALOG_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/products/by-code/*/listing
                - Method=GET,PUT
              filters: [RemoveRequestHeader=X-Member-Id]
            - id: catalog-listing-admin
              uri: ${CATALOG_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/admin/products/*/listing/restriction
                - Method=GET,PUT
              filters: [RemoveRequestHeader=X-Member-Id]
            - id: catalog-publication-jobs-admin
              uri: ${CATALOG_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/admin/catalog-release-jobs,/api/v1/admin/catalog-release-jobs/*
                - Method=GET
              filters: [RemoveRequestHeader=X-Member-Id]
            - id: catalog-public
              uri: ${CATALOG_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/products/**
                - Method=GET
            - id: promotions
              uri: ${CATALOG_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/promotions/**
            - id: order
              uri: ${ORDER_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/orders/**
              filters: [RemoveRequestHeader=X-Member-Id]
            - id: payment
              uri: ${PAYMENT_URI:http://localhost:8083}
              predicates:
                - Path=/api/v1/payments/**
              filters: [RemoveRequestHeader=X-Member-Id]
            - id: license
              uri: ${LICENSE_URI:http://localhost:8084}
              predicates:
                - Path=/api/v1/library/**,/api/v1/storage/**
              filters: [RemoveRequestHeader=X-Member-Id]
            - id: download
              uri: ${DOWNLOAD_URI:http://localhost:8088}
              predicates:
                - Path=/api/v1/downloads/**
              filters: [RemoveRequestHeader=X-Member-Id]

            # ── 창작자 대면(스튜디오) ──────────────────────────────
            - id: studio
              uri: ${STUDIO_URI:http://localhost:8085}
              metadata:
                response-timeout: 300000
              predicates:
                - Path=/api/v1/studio/**

            # ── 사내 운영툴 (실운영에서는 내부망 전용 게이트웨이로 분리) ──
            - id: payment-refund-admin
              uri: ${PAYMENT_URI:http://localhost:8083}
              predicates:
                - Path=/api/v1/admin/refund-cancellation-holds/**,/api/v1/admin/refund-delays/**,/api/v1/admin/approval-reviews/**
                - Method=GET,POST
              filters: [RemoveRequestHeader=X-Member-Id]
            - id: order-refund-admin
              uri: ${ORDER_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/admin/refunds/**
                - Method=GET,POST
              filters: [RemoveRequestHeader=X-Member-Id]
            - id: review-admin
              uri: ${REVIEW_URI:http://localhost:8086}
              predicates:
                - Path=/api/v1/reviews/**
            - id: settlement-admin
              uri: ${SETTLEMENT_URI:http://localhost:8089}
              predicates:
                - Path=/api/v1/settlements/**

            # ── API 명세 프록시 (읽기 전용) ────────────────────────
            # Swagger UI 는 웹 BFF가 서빙하고, 명세는 웹 BFF → 이 게이트웨이 → 각 서비스로 같은 출처에서 받는다.
            #
            # **명세에 있다고 호출할 수 있는 것은 아니다.** 도달 가능성은 위의 라우팅 표가 정하고,
            # 여기 추가된 것은 /v3/api-docs/* 뿐이다(GET 전용). 그 성질을 GatewayRouteTest 가 지킨다.
            - id: docs-catalog
              uri: ${CATALOG_URI:http://localhost:8081}
              predicates: [Path=/v3/api-docs/catalog, Method=GET]
              filters: [SetPath=/v3/api-docs]
            - id: docs-auth
              uri: ${AUTH_URI:http://localhost:8091}
              predicates: [Path=/v3/api-docs/auth, Method=GET]
              filters: [SetPath=/v3/api-docs]
            - id: docs-order
              uri: ${ORDER_URI:http://localhost:8082}
              predicates: [Path=/v3/api-docs/order, Method=GET]
              filters: [SetPath=/v3/api-docs]
            - id: docs-payment
              uri: ${PAYMENT_URI:http://localhost:8083}
              predicates: [Path=/v3/api-docs/payment, Method=GET]
              filters: [SetPath=/v3/api-docs]
            - id: docs-license
              uri: ${LICENSE_URI:http://localhost:8084}
              predicates: [Path=/v3/api-docs/license, Method=GET]
              filters: [SetPath=/v3/api-docs]
            - id: docs-studio
              uri: ${STUDIO_URI:http://localhost:8085}
              predicates: [Path=/v3/api-docs/studio, Method=GET]
              filters: [SetPath=/v3/api-docs]
            - id: docs-review
              uri: ${REVIEW_URI:http://localhost:8086}
              predicates: [Path=/v3/api-docs/review, Method=GET]
              filters: [SetPath=/v3/api-docs]
            - id: docs-store
              uri: ${STORE_URI:http://localhost:8087}
              predicates: [Path=/v3/api-docs/store, Method=GET]
              filters: [SetPath=/v3/api-docs]
            - id: docs-download
              uri: ${DOWNLOAD_URI:http://localhost:8088}
              predicates: [Path=/v3/api-docs/download, Method=GET]
              filters: [SetPath=/v3/api-docs]
            - id: docs-settlement
              uri: ${SETTLEMENT_URI:http://localhost:8089}
              predicates: [Path=/v3/api-docs/settlement, Method=GET]
              filters: [SetPath=/v3/api-docs]

management:
  endpoints.web.exposure.include: health,info,prometheus,gateway
  metrics.tags.application: gateway
  # 트레이스가 시작되는 자리. 하류 서비스와 샘플링 비율이 다르면 트레이스가 반쪽만 남는다.
  tracing.sampling.probability: ${TRACING_SAMPLE_RATE:1.0}
  otlp.tracing.endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    org.springframework.cloud.gateway: INFO
