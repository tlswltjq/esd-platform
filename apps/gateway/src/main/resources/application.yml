server:
  port: 8080

spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webflux:
          # 상관관계 ID(X-Correlation-Id)는 각 서비스의 CorrelationIdFilter 가
          # 없으면 생성하고 응답 헤더로 돌려준다. 게이트웨이에서 고정값을 심으면
          # 모든 요청이 같은 ID를 갖게 되므로 여기서는 통과만 시킨다.
          routes:
            # ── 유저 대면 ─────────────────────────────────────────
            - id: store
              uri: ${STORE_URI:http://localhost:8087}
              predicates:
                - Path=/api/v1/storefront/**
            # 상품 상세 조회만 공개. 가격 재계산(POST /quote)·운영툴 API 는
            # 이 라우트에 매칭되지 않으므로 외부에서 호출할 수 없다.
            - id: catalog-public
              uri: ${CATALOG_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/products/**
                - Method=GET
            - id: order
              uri: ${ORDER_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/orders/**
            - id: payment
              uri: ${PAYMENT_URI:http://localhost:8083}
              predicates:
                - Path=/api/v1/payments/**
            - id: license
              uri: ${LICENSE_URI:http://localhost:8084}
              predicates:
                - Path=/api/v1/library/**
            - id: download
              uri: ${DOWNLOAD_URI:http://localhost:8088}
              predicates:
                - Path=/api/v1/downloads/**

            # ── 창작자 대면(스튜디오) ──────────────────────────────
            - id: studio
              uri: ${STUDIO_URI:http://localhost:8085}
              predicates:
                - Path=/api/v1/studio/**

            # ── 사내 운영툴 (실운영에서는 내부망 전용 게이트웨이로 분리) ──
            - id: review-admin
              uri: ${REVIEW_URI:http://localhost:8086}
              predicates:
                - Path=/api/v1/reviews/**
            - id: settlement-admin
              uri: ${SETTLEMENT_URI:http://localhost:8089}
              predicates:
                - Path=/api/v1/settlements/**

management:
  endpoints.web.exposure.include: health,info,prometheus,gateway

logging:
  level:
    org.springframework.cloud.gateway: INFO
