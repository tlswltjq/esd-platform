server:
  port: 8080

spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webflux:
          # 추적 컨텍스트(traceparent)는 게이트웨이가 트레이스를 열면서 자동으로 만들어
          # 하류로 전달한다 — 라우팅 규칙에서 헤더를 손댈 일이 없다.
          # 각 서비스는 그 값을 이어받고, 응답에는 traceId 를 X-Correlation-Id 로 돌려준다
          # (common:web 의 TraceIdResponseFilter).
          routes:
            # ── 유저 대면 ─────────────────────────────────────────
            - id: store
              uri: ${STORE_URI:http://localhost:8087}
              predicates:
                - Path=/api/v1/storefront/**
            # 상품 상세 조회만 공개. 가격 재계산(POST /quote)·운영툴 API 는
            # 이 라우트에 매칭되지 않으므로 외부에서 호출할 수 없다.
            - id: catalog-public
              uri: ${CATALOG_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/products/**
                - Method=GET
            - id: order
              uri: ${ORDER_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/orders/**
            - id: payment
              uri: ${PAYMENT_URI:http://localhost:8083}
              predicates:
                - Path=/api/v1/payments/**
            - id: license
              uri: ${LICENSE_URI:http://localhost:8084}
              predicates:
                - Path=/api/v1/library/**
            - id: download
              uri: ${DOWNLOAD_URI:http://localhost:8088}
              predicates:
                - Path=/api/v1/downloads/**

            # ── 창작자 대면(스튜디오) ──────────────────────────────
            - id: studio
              uri: ${STUDIO_URI:http://localhost:8085}
              predicates:
                - Path=/api/v1/studio/**

            # ── 사내 운영툴 (실운영에서는 내부망 전용 게이트웨이로 분리) ──
            - id: review-admin
              uri: ${REVIEW_URI:http://localhost:8086}
              predicates:
                - Path=/api/v1/reviews/**
            - id: settlement-admin
              uri: ${SETTLEMENT_URI:http://localhost:8089}
              predicates:
                - Path=/api/v1/settlements/**

management:
  endpoints.web.exposure.include: health,info,prometheus,gateway
  # 트레이스가 시작되는 자리. 하류 서비스와 샘플링 비율이 다르면 트레이스가 반쪽만 남는다.
  tracing.sampling.probability: ${TRACING_SAMPLE_RATE:1.0}
  otlp.tracing.endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    org.springframework.cloud.gateway: INFO
