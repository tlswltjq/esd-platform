server:
  port: 8080
  # 모든 트래픽이 이 문을 지난다 — PG 콜백도 클라이언트 요청도 창작자 호출도(D-034).
  # 여기가 빠지면 하류 아홉이 켜 둔 graceful 이 전부 무의미해진다.
  # 요청을 마치고 닫아도 그 응답을 내보낼 문이 이미 없기 때문이다.
  shutdown: graceful

spring:
  application:
    name: gateway

  # 진행 중인 요청을 기다리는 상한. 컨테이너 종료 유예(40초)보다 짧아야 한다 —
  # 뒤집히면 SIGKILL 이 먼저 도착해 graceful 이 잘린다(D-035).
  lifecycle:
    timeout-per-shutdown-phase: 30s

  cloud:
    gateway:
      server:
        webflux:
          # 추적 컨텍스트(traceparent)는 게이트웨이가 트레이스를 열면서 자동으로 만들어
          # 하류로 전달한다 — 라우팅 규칙에서 헤더를 손댈 일이 없다.
          # 각 서비스는 그 값을 이어받고, 응답에는 traceId 를 X-Correlation-Id 로 돌려준다
          # (common:web 의 TraceIdResponseFilter).
          routes:
            # ── 유저 대면 ─────────────────────────────────────────
            - id: store
              uri: ${STORE_URI:http://localhost:8087}
              predicates:
                - Path=/api/v1/storefront/**
            # 상품 상세 조회만 공개. 가격 재계산(POST /quote)·운영툴 API 는
            # 이 라우트에 매칭되지 않으므로 외부에서 호출할 수 없다.
            - id: catalog-public
              uri: ${CATALOG_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/products/**
                - Method=GET
            - id: order
              uri: ${ORDER_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/orders/**
            - id: payment
              uri: ${PAYMENT_URI:http://localhost:8083}
              predicates:
                - Path=/api/v1/payments/**
            - id: license
              uri: ${LICENSE_URI:http://localhost:8084}
              predicates:
                - Path=/api/v1/library/**
            - id: download
              uri: ${DOWNLOAD_URI:http://localhost:8088}
              predicates:
                - Path=/api/v1/downloads/**

            # ── 창작자 대면(스튜디오) ──────────────────────────────
            - id: studio
              uri: ${STUDIO_URI:http://localhost:8085}
              predicates:
                - Path=/api/v1/studio/**

            # ── 사내 운영툴 (실운영에서는 내부망 전용 게이트웨이로 분리) ──
            - id: review-admin
              uri: ${REVIEW_URI:http://localhost:8086}
              predicates:
                - Path=/api/v1/reviews/**
            - id: settlement-admin
              uri: ${SETTLEMENT_URI:http://localhost:8089}
              predicates:
                - Path=/api/v1/settlements/**

            # ── API 명세 프록시 (읽기 전용) ────────────────────────
            # Swagger UI 를 게이트웨이가 서빙하므로 명세도 같은 출처에서 와야 한다.
            # 이 저장소에는 CORS 설정이 없어서, 브라우저가 8080 에서 받은 화면으로
            # 8082 를 직접 부르면 막힌다. 그래서 프록시한다.
            #
            # **명세에 있다고 호출할 수 있는 것은 아니다.** 도달 가능성은 위의 라우팅 표가 정하고,
            # 여기 추가된 것은 /v3/api-docs/* 뿐이다(GET 전용). 그 성질을 GatewayRouteTest 가 지킨다.
            - id: docs-catalog
              uri: ${CATALOG_URI:http://localhost:8081}
              predicates: [Path=/v3/api-docs/catalog, Method=GET]
              filters: [SetPath=/v3/api-docs]
            - id: docs-order
              uri: ${ORDER_URI:http://localhost:8082}
              predicates: [Path=/v3/api-docs/order, Method=GET]
              filters: [SetPath=/v3/api-docs]
            - id: docs-payment
              uri: ${PAYMENT_URI:http://localhost:8083}
              predicates: [Path=/v3/api-docs/payment, Method=GET]
              filters: [SetPath=/v3/api-docs]
            - id: docs-license
              uri: ${LICENSE_URI:http://localhost:8084}
              predicates: [Path=/v3/api-docs/license, Method=GET]
              filters: [SetPath=/v3/api-docs]
            - id: docs-studio
              uri: ${STUDIO_URI:http://localhost:8085}
              predicates: [Path=/v3/api-docs/studio, Method=GET]
              filters: [SetPath=/v3/api-docs]
            - id: docs-review
              uri: ${REVIEW_URI:http://localhost:8086}
              predicates: [Path=/v3/api-docs/review, Method=GET]
              filters: [SetPath=/v3/api-docs]
            - id: docs-store
              uri: ${STORE_URI:http://localhost:8087}
              predicates: [Path=/v3/api-docs/store, Method=GET]
              filters: [SetPath=/v3/api-docs]
            - id: docs-download
              uri: ${DOWNLOAD_URI:http://localhost:8088}
              predicates: [Path=/v3/api-docs/download, Method=GET]
              filters: [SetPath=/v3/api-docs]
            - id: docs-settlement
              uri: ${SETTLEMENT_URI:http://localhost:8089}
              predicates: [Path=/v3/api-docs/settlement, Method=GET]
              filters: [SetPath=/v3/api-docs]

# 9개 서비스의 명세를 한 화면에서 드롭다운으로 전환한다.
#
# `api-docs.enabled: false` 로 게이트웨이 자기 명세를 끄려다 **Swagger UI 까지 404 가 됐다** —
# springdoc 에서 그 속성은 명세 엔드포인트 하나가 아니라 구성 전체의 스위치다.
# 게이트웨이는 컨트롤러가 없어 자기 명세가 어차피 비어 있으므로 그냥 켜 둔다.
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - { name: 1. store (진열·검색),      url: /v3/api-docs/store }
      - { name: 2. catalog (상품),         url: /v3/api-docs/catalog }
      - { name: 3. order (주문),           url: /v3/api-docs/order }
      - { name: 4. payment (결제),         url: /v3/api-docs/payment }
      - { name: 5. license (라이선스),      url: /v3/api-docs/license }
      - { name: 6. download (다운로드),     url: /v3/api-docs/download }
      - { name: 7. studio (크리에이터),     url: /v3/api-docs/studio }
      - { name: 8. review (심의·운영),      url: /v3/api-docs/review }
      - { name: 9. settlement (정산·운영),  url: /v3/api-docs/settlement }

management:
  endpoints.web.exposure.include: health,info,prometheus,gateway
  # 트레이스가 시작되는 자리. 하류 서비스와 샘플링 비율이 다르면 트레이스가 반쪽만 남는다.
  tracing.sampling.probability: ${TRACING_SAMPLE_RATE:1.0}
  otlp.tracing.endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    org.springframework.cloud.gateway: INFO
