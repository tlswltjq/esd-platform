dependencies {
    // API 게이트웨이(결정 223·224): 내부망에서 BFF가 릴레이한 Bearer를 검증하고 역할별 경로 규칙으로 라우팅한다.
    // 세션·OAuth 클라이언트·Swagger UI는 웹 BFF(apps/web-bff)에 있다.
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    // 계정 접근 변경 사실(결정 180·225)로 subject별 거절 기준(changedAt)을 Redis에 두고 이전 토큰을 거절한다(GW-T18).
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
    // DB가 없어 코어(격리·Outbox)를 쓰지 않는다. 계약·수신 포트만 알고 수신은 Kafka adapter가 한다(Store와 같음, 결정 209).
    // 일시 실패는 성공까지 재시도, 영구 실패만 DLT(결정 226).
    implementation project(':common:contract')
    runtimeOnly project(':common:messaging-kafka')
    testImplementation project(':common:messaging-kafka')
    implementation 'io.micrometer:micrometer-core'
    testImplementation 'io.projectreactor:reactor-test'
    integrationTestImplementation project(':common:messaging-kafka')
    integrationTestImplementation 'org.springframework.kafka:spring-kafka-test'
}
