server:
  port: 8086
  shutdown: graceful

spring:
  application:
    name: review

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/stove_review?serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USER:stove}
    password: ${DB_PASSWORD:stove1234}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record

stove:
  review:
    # 자체등급분류 건은 접수 즉시 자동 승인(로컬 데모용). 운영에서는 false + 담당자 승인 API.
    auto-approve-self-rated: true
    default-self-rating-code: ALL
  outbox:
    relay-enabled: true
    batch-size: 200
    poll-interval-ms: 1000
    max-retry: 10

management:
  endpoints.web.exposure.include: health,info,prometheus,metrics
  endpoint.health.probes.enabled: true
  metrics.tags.application: review

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"
  level:
    com.stove: DEBUG
