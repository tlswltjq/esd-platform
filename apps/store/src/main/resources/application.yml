server:
  port: 8087
  shutdown: graceful

spring:
  application:
    name: store

  # 진행 중인 요청을 기다리는 상한. compose 의 stop_grace_period(40s)보다 짧아야 한다 —
  # 뒤집히면 SIGKILL 이 먼저 도착해 graceful 이 잘린다(D-035). 부등호는 테스트가 지킨다.
  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/stove_store?serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USER:stove}
    password: ${DB_PASSWORD:stove1234}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 3000
      # 부팅 때만 첫 연결을 60초 동안 다시 시도한다(결정 136). 실행 중 요청의 기한은 connection-timeout 그대로다.
      initialization-fail-timeout: 60000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    # 이 서비스는 도메인 이벤트를 발행하지 않는다. 프로듀서 설정이 있는 이유는 **DLT 뿐이다** —
    # 재시도를 소진한 메시지를 <원본토픽>.DLT 로 넘기는 것도 발행이라, 직렬화가 없으면 그 순간 터진다.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      # 헤더의 traceparent 를 이어받아 리스너 처리를 발행 측과 같은 트레이스에 붙인다.
      # 끄면 카프카를 건널 때마다 트레이스가 새로 시작돼 흐름이 조각난다.
      observation-enabled: true

stove:
  store:
    catalog-service-key: ${CATALOG_STORE_SERVICE_KEY:}
    catalog-base-url: ${CATALOG_BASE_URL:http://localhost:8081}
    sync:
      enabled: ${STORE_SYNC_ENABLED:true}
      poll-interval-ms: ${STORE_SYNC_POLL_INTERVAL_MS:1000}
      retry-delay: ${STORE_SYNC_RETRY_DELAY:PT5S}
      reconcile-interval: ${STORE_SYNC_RECONCILE_INTERVAL:PT1M}
  messaging:
    ops:
      enabled: false

management:
  endpoints.web.exposure.include: health,info,prometheus,metrics
  endpoint.health.probes.enabled: true
  metrics.tags.application: store
  # 전량 샘플링 — 데모에서는 트레이스가 드문드문 있으면 확인 자체가 안 된다. 운영이라면 낮춰 잡는다.
  tracing.sampling.probability: ${TRACING_SAMPLE_RATE:1.0}
  otlp.tracing.endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    com.stove: DEBUG
