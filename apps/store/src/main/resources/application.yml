server:
  port: 8087
  shutdown: graceful

spring:
  application:
    name: store

  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
    connection-timeout: 3s
    # 색인 생성/매핑 반영은 조회보다 오래 걸린다 — 기동 실패를 막기 위해 넉넉히
    socket-timeout: 10s

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      # 헤더의 traceparent 를 이어받아 리스너 처리를 발행 측과 같은 트레이스에 붙인다.
      # 끄면 카프카를 건널 때마다 트레이스가 새로 시작돼 흐름이 조각난다.
      observation-enabled: true

management:
  endpoints.web.exposure.include: health,info,prometheus,metrics
  endpoint.health.probes.enabled: true
  metrics.tags.application: store
  # 전량 샘플링 — 데모에서는 트레이스가 드문드문 있으면 확인 자체가 안 된다. 운영이라면 낮춰 잡는다.
  tracing.sampling.probability: ${TRACING_SAMPLE_RATE:1.0}
  otlp.tracing.endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    com.stove: DEBUG
