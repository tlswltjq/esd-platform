dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation project(':common:web')
    implementation project(':common:jpa')
    // DB 가 없어 코어(격리·Outbox)를 쓰지 않는다. 계약·수신 포트만 알고, 수신은 Kafka adapter 가 한다(결정 209).
    // 실패는 격리 대신 DLT 로 간다(Store tasks SO-T6). 다른 adapter 는 코어가 필요해 넣지 않는다.
    implementation project(':common:contract')
    runtimeOnly project(':common:messaging-kafka')
    testImplementation project(':common:messaging-kafka')
    implementation 'io.micrometer:micrometer-core'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
}
