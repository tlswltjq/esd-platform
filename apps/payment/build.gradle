dependencies {
    implementation project(':common:web')
    implementation project(':common:messaging')

    // 중단된 환불 재개의 단일 실행 보장. 인스턴스가 여러 대면 같은 CANCELING 행을 동시에 집어
    // PG 취소를 대수만큼 부른다. pgTxId 기준 멱등이라 이중 환불은 아니지만, 재개 로그와
    // PaymentCancelled 가 겹쳐 "몇 번 시도했나" 를 알 수 없게 된다 (RefundSweeper 주석).
    implementation 'net.javacrumbs.shedlock:shedlock-spring:6.9.0'
    implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:6.9.0'

    testImplementation 'org.springframework.kafka:spring-kafka-test'
}
