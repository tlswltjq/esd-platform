dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

    implementation project(':common:web')
    implementation project(':common:security')
    implementation project(':common:messaging')

    testImplementation 'org.springframework.kafka:spring-kafka-test'
}

// 공급자는 별도 프로세스다. classpath에 넣지 않고 실제 실행 파일 내용을 추적한다.
tasks.matching { it.name in ['integrationTest', 'migrationTest'] }.configureEach {
    dependsOn ':simulators:mock-pg:bootJar'
    def supplierJar = rootProject.file('simulators/mock-pg/build/libs/mock-pg-0.0.1-SNAPSHOT.jar')
    inputs.file(supplierJar).withPropertyName('externalPgJar').withPathSensitivity(PathSensitivity.NONE)
    systemProperty 'mock.pg.jar', supplierJar.absolutePath
}

tasks.named('migrationTest') {
    inputs.files(rootProject.file('tools/migrations/payment/payment-transition.sql'),
            rootProject.file('tools/migrations/mock-pg/migrate.py'))
            .withPropertyName('externalMigrationTools').withPathSensitivity(PathSensitivity.RELATIVE)
}

// Test-only classpath for restarting the real OCI process with explicit fault fixtures.
tasks.register('writeVerificationClasspath') {
    dependsOn tasks.named('integrationTestClasses')
    doLast {
        layout.buildDirectory.file('verification-classpath.txt').get().asFile.text = sourceSets.integrationTest.runtimeClasspath.asPath
    }
}
