server:
  port: 8083
  shutdown: graceful

spring:
  application:
    name: payment

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/stove_payment?serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USER:stove}
    password: ${DB_PASSWORD:stove1234}
    hikari:
      maximum-pool-size: 20
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      # 헤더의 traceparent 를 이어받아 리스너 처리를 발행 측과 같은 트레이스에 붙인다.
      # 끄면 카프카를 건널 때마다 트레이스가 새로 시작돼 흐름이 조각난다.
      observation-enabled: true

stove:
  payment:
    # 주문이 만들어진 뒤 결제를 시작할 수 있는 시간. 금액은 주문 시각의 서버 가격으로 굳으므로,
    # 이 창이 곧 "옛 가격이 유효한 기간" 이다 — 없으면 무한이다(D-029, 실측 30일 뒤에도 승인).
    window: ${PAYMENT_WINDOW:30m}
    # 사전등록 뒤 승인 콜백까지 허용하는 시간. 지나서 온 승인은 거절하지 않고 받아 적은 뒤
    # 자동 환불한다 — 그 시점엔 PG 에서 이미 돈이 움직였으므로 거절은 대사를 깨뜨린다.
    # 실 PG 결제창 세션(보통 10~30분) 안쪽에 두어 대개는 PG 가 먼저 만료시키게 한다.
    checkout-window: ${PAYMENT_CHECKOUT_WINDOW:15m}
  outbox:
    relay-enabled: true
    batch-size: 200
    poll-interval-ms: 200   # 한산할 때 종단 지연의 바닥 — 근거와 적응형 폴링 검토는 OutboxRelay 주석
    max-retry: 10

management:
  endpoints.web.exposure.include: health,info,prometheus,metrics
  endpoint.health.probes.enabled: true
  metrics.tags.application: payment
  # 전량 샘플링 — 데모에서는 트레이스가 드문드문 있으면 확인 자체가 안 된다. 운영이라면 낮춰 잡는다.
  tracing.sampling.probability: ${TRACING_SAMPLE_RATE:1.0}
  otlp.tracing.endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    com.stove: DEBUG
