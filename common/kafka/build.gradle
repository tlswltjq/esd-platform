apply plugin: 'java-library'

// 이벤트 계약과 Kafka 소비 정책(재시도·DLT)을 제공한다.
//
// common:messaging 에서 떼어냈다. 거기 있는 동안에는 이 정책을 쓰려면 Outbox 와 JPA 까지
// 딸려와서, 저장소가 JPA 가 아닌 store(ES)·download(Mongo) 가 쓸 수 없었다.
// 그 둘은 결과적으로 스프링 기본값(FixedBackOff(0ms, 9회) + 로그 후 건너뛰기)으로 돌고 있었다.
dependencies {
    api 'com.fasterxml.jackson.core:jackson-databind'
    api 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    // DLT 운영 API 가 공통 응답 봉투를 쓰고, DLT 레코드에서 계약 헤더를 읽는다.
    api 'org.springframework.kafka:spring-kafka'
    api 'org.springframework.boot:spring-boot-autoconfigure'
    // 실패 처리는 무엇을 포기했는지 남기는 것이 절반이다 — 로깅 API 를 직접 건다
    // (spring-kafka 가 컴파일 클래스패스로는 넘겨주지 않는다)
    api 'org.slf4j:slf4j-api'
    // DLT 유입은 알람 대상이다 — 로그만으로는 사람에게 도달하지 않는다
    api 'io.micrometer:micrometer-core'

    // 운영 API 는 HTTP 어댑터라 spring-web 이 필요하다. 다만 이 모듈이 웹을 **요구**하지는 않는다 —
    // 웹이 아닌 실행에서도 재시도·DLT 정책은 그대로 돌아야 한다.
    // 그래서 compileOnly 로 두고 @ConditionalOnWebApplication 으로 켠다.
    compileOnly 'org.springframework:spring-web'
    testImplementation 'org.springframework:spring-web'
    compileOnly project(':common:web')
    testImplementation project(':common:web')
    testImplementation 'org.springframework.boot:spring-boot-starter-web'

    // 공용 라이브러리 방향 검증 (ArchUnit)
    testImplementation project(':common:archunit')

    // 랙 지표가 실제 미소비 건수를 말하는지는 **실 브로커로만** 확인할 수 있다.
    // 대역으로는 "우리가 짠 대역이 뭘 돌려주나"만 알게 된다(D-026).
    integrationTestImplementation project(':common:testcontainers')
}
