apply plugin: 'java-library'

dependencies {
    // 규칙 세트는 각 앱의 testImplementation 으로만 쓰이지만,
    // 규칙 자체를 한 곳에 모아두기 위해 main 소스셋에 둔다.
    api 'com.tngtech.archunit:archunit-junit5:1.3.0'

    // 규칙이 실제로 위반을 잡는지 확인하려면 위반 픽스처가 필요하고,
    // 픽스처는 규칙이 검사하는 애노테이션을 달 수 있어야 한다(ArchRuleEnforcementTest).
    testImplementation 'org.springframework:spring-web'
    testImplementation 'org.springframework:spring-tx'
    testImplementation 'org.springframework:spring-context'
    testImplementation 'org.springframework.boot:spring-boot'
    testImplementation 'org.springframework.data:spring-data-commons'
}
