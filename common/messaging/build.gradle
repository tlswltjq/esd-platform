apply plugin: 'java-library'

dependencies {
    api project(':common:core')
    api project(':common:event')
    api project(':common:jpa')
    api 'org.springframework.kafka:spring-kafka'
    // 릴레이는 배경 스레드라 지표 없이는 관측 수단이 없다
    api 'io.micrometer:micrometer-core'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // 공용 라이브러리 방향 검증 (ArchUnit)
    testImplementation project(':common:archunit')

    // lockPendingBatch 는 네이티브 SQL 이라 대역으로는 의미를 확인할 수 없다.
    // 이 쿼리에 9개 서비스가 의존하므로 검증도 이 모듈이 가지고 있어야 한다(OutboxPendingQueryTest).
    testImplementation project(':common:test')
}
