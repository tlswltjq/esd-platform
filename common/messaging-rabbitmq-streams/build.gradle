apply plugin: 'java-library'

// 메시징 RabbitMQ Streams adapter(결정 211). stove.messaging.broker=rabbitmq-streams 일 때만 연결·구독을 만든다.
// classic queue adapter(common:messaging-rabbitmq)와 따로 둔다: 클라이언트(stream 프로토콜, 5552)와 토폴로지(토픽마다 super stream 하나)가 다르다.
// 코어(common:messaging)에만 의존한다. 다른 adapter 를 모른다(결정 209).
dependencies {
    api project(':common:messaging')
    implementation 'com.rabbitmq:stream-client'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation project(':common:archunit')
    testImplementation project(':common:test')
    integrationTestImplementation project(':common:testcontainers')
    // 코어 엔티티·스키마로 뜨는 테스트 부트 앱(OutboxQueryTestApplication)과 Flyway 이관을 코어에서 받는다.
    integrationTestImplementation testFixtures(project(':common:messaging'))
}
