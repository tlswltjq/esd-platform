plugins {
    id 'stove.library'
}

// 이벤트 계약: 토픽·이벤트 종류·본문 타입과 이벤트 메시지(EventMessage)·헤더 이름.
// 메시징은 Kafka 단일 구현이라(결정 227) 이벤트 메시지는 Kafka 레코드에서 바로 만든다. 그래서 Kafka 클라이언트(레코드·헤더 타입)만 안다.
// Spring Kafka·JPA·메시징 코어는 모른다 — DB 없는 앱(Store·게이트웨이·웹 BFF)도 이 모듈만으로 계약을 쓴다.
dependencies {
    api 'org.apache.kafka:kafka-clients'
    api 'com.fasterxml.jackson.core:jackson-databind'
    api 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // 공용 라이브러리 방향 검증 (ArchUnit)
    testImplementation project(':common:archunit')
}
