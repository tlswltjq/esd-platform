pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

rootProject.name = 'stove'

// ── 공용 라이브러리 ────────────────────────────────────────────────
include 'common:core'
include 'common:web'
include 'common:event'
include 'common:jpa'
include 'common:kafka'
include 'common:messaging'
include 'common:archunit'
include 'common:test'
include 'common:testcontainers'

// ── 마이크로서비스 9종 + 게이트웨이 ─────────────────────────────────
include 'apps:gateway'

// 트랙 A. 크리에이터 (입점~노출)
include 'apps:studio'
include 'apps:review'
include 'apps:catalog'

// 트랙 B. 커머스 (구매~결제)
include 'apps:store'
include 'apps:order'
include 'apps:payment'

// 트랙 C. 이용/정산 (지급~배분)
include 'apps:license'
include 'apps:download'
include 'apps:settlement'
