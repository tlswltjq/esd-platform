include 'libs:common-jpa'
include 'libs:common-messaging'
include 'libs:common-archunit'
include 'libs:common-test'

// ── 마이크로서비스 9종 + 게이트웨이 ─────────────────────────────────
include 'apps:gateway'

// 트랙 A. 크리에이터 (입점~노출)
include 'apps:studio'
include 'apps:review'
include 'apps:catalog'

// 트랙 B. 커머스 (구매~결제)
include 'apps:store'
include 'apps:order'
include 'apps:payment'

// 트랙 C. 이용/정산 (지급~배분)
include 'apps:license'
