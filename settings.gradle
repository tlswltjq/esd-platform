pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

rootProject.name = 'stove'

// ── 공용 라이브러리 ────────────────────────────────────────────────
include 'common:web'
include 'common:security'
include 'common:jpa'
include 'common:contract'
// 메시징(결정 227): Kafka 단일 구현. JPA 코어(Outbox·Inbox·격리)와 JPA 없는 앱도 쓰는 Kafka 공통 모듈로 나눈다.
include 'common:messaging'
include 'common:messaging-kafka'
include 'common:archunit'
include 'common:test'
include 'common:testcontainers'

// ── 인수 시나리오 ──────────────────────────────────────────────────
// 떠 있는 전체 스택을 밖에서 두드린다. 기본 빌드에 들어가지 않는다 (e2e/build.gradle 참고).
include 'e2e'

// ── 마이크로서비스 10종 + 게이트웨이 ─────────────────────────────────
include 'apps:gateway'
include 'apps:web-bff'
include 'apps:auth'

// 트랙 A. 크리에이터 (입점~노출)
include 'apps:studio'
include 'apps:review'
include 'apps:catalog'

// 트랙 B. 커머스 (구매~결제)
include 'apps:store'
include 'apps:order'
include 'apps:payment'

// 트랙 C. 이용/정산 (지급~배분)
include 'apps:license'
include 'apps:download'
include 'apps:settlement'

// 외부 공급자 검증용 독립 실행 앱
include 'simulators:mock-pg'

// ── 벤치마크 ──────────────────────────────────────────────────────
// Kafka 기준선 층 2 메시징 구간 벤치(결정 234). 운영 앱은 의존하지 않고 이미지도 만들지 않는다.
include 'benchmarks:messaging'

// 로컬 S3 검증용 MinIO/mc: 고정 Go 소스 빌드와 Jib 이미지 패키징.
include 'infra:minio'

// 백업·복구 도구용 MySQL 클라이언트: 공식 MySQL 이미지 + 같은 버전의 mysqlbinlog.
include 'infra:mysql-client'
