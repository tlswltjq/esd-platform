# Host access for local development and E2E; base services stay internal.
# docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
services:
  elasticsearch:
    ports: ["127.0.0.1:9200:9200"]
  grafana:
    ports: ["127.0.0.1:3000:3000"]
  kafka:
    ports: ["127.0.0.1:9092:9092"]
  kafka-exporter:
    ports: ["127.0.0.1:9308:9308"]
  kafka-ui:
    ports: ["127.0.0.1:8090:8080"]
  minio:
    ports: ["127.0.0.1:19000:9000", "127.0.0.1:9001:9001"]
  mongodb:
    ports: ["127.0.0.1:27017:27017"]
  mysql:
    ports: ["127.0.0.1:3306:3306"]
  prometheus:
    ports: ["127.0.0.1:9090:9090"]
  redis:
    ports: ["127.0.0.1:6379:6379"]
  tempo:
    ports: ["127.0.0.1:13200:3200", "127.0.0.1:4318:4318"]
