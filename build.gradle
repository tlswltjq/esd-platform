plugins {
    id 'java'
}

allprojects {
    group = 'com.stove'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

// 모듈 공통 빌드 구성은 build-logic/ 의 convention plugin 에 있고, 모듈이 자기 build.gradle 에서 적용한다
// (결정 build-logic-convention-plugins).
//   stove.java-base                Java 모듈 공통(툴체인·BOM·test / integrationTest / defectTest·pitest)
//   stove.app                      apps/* 부트 애플리케이션(+ stove.image)
//   stove.library                  common/* 라이브러리
//   stove.staged-verification      공유 픽스처와 migrationTest 를 나눈 모듈
//   stove.minio-integration-test   통합 테스트가 MinIO 이미지를 쓰는 모듈
//   stove.image                    Jib 이미지(앱·모의 PG)
// 이 파일에는 여러 모듈이 함께 쓰는 값(이미지 registry·MinIO 이미지 선택)과 전체를 훑는 검증 태스크만 둔다.

// 결정 135: 직접 만드는 이미지(앱·MinIO·mysql-client)의 registry는 여기서 한 번만 정한다.
// registry 주소가 없는 이름(stove/...)은 Docker Hub의 다른 사람 계정(stove)을 가리키므로, 기본값은 Docker Hub로
// 해석되지 않는 localhost/stove다. 배포는 STOVE_JIB_REGISTRY·-Pstove.jib.registry로 우리 registry를 지정한다.
// Docker Hub의 stove를 가리키는 값은 받지 않고 거절한다. 같은 규칙: common/testcontainers의 LocalImageNames,
// tools/verification/support/image_names.py.
def defaultImageRegistry = 'localhost/stove'
def dockerHubHosts = ['docker.io', 'index.docker.io', 'registry-1.docker.io']
def dockerHubPath = { String image ->
    String name = image.trim().split('@', 2)[0]
    int slash = name.lastIndexOf('/')
    String last = name.substring(slash + 1).split(':', 2)[0]
    List<String> parts = (slash < 0 ? last : name.substring(0, slash) + '/' + last).split('/', -1).toList()
    String first = parts[0]
    if (parts.size() > 1 && (first.contains('.') || first.contains(':') || first == 'localhost')) {
        return first.toLowerCase(Locale.ROOT) in dockerHubHosts ? parts.subList(1, parts.size()) : null
    }
    return parts
}
def requireNotDockerHubStove = { String setting, String image ->
    List<String> path = image.isEmpty() ? null : dockerHubPath(image)
    if (path != null && path.size() > 1 && path[0] == 'stove') {
        List<String> written = image.trim().split('/', -1).toList()
        if (written[0].toLowerCase(Locale.ROOT) in dockerHubHosts) {
            written = written.subList(1, written.size())
        }
        throw new GradleException("${setting}=${image} 는 Docker Hub의 다른 사람 계정(stove)을 가리킨다(결정 135). "
                + "${([defaultImageRegistry] + written.subList(1, written.size())).join('/')} 로 바꾼다.")
    }
    return image
}
def stoveImageRegistry = providers.gradleProperty('stove.jib.registry').map { it.trim() }.filter { !it.isEmpty() }
        .orElse(providers.environmentVariable('STOVE_JIB_REGISTRY').map { it.trim() }.filter { !it.isEmpty() })
        .getOrElse(defaultImageRegistry)
List<String> registryPath = dockerHubPath(stoveImageRegistry + '/image')
if (registryPath != null && registryPath.size() > 1 && registryPath[0] == 'stove') {
    throw new GradleException("STOVE_JIB_REGISTRY·stove.jib.registry=${stoveImageRegistry} 는 Docker Hub의 "
            + "다른 사람 계정(stove)을 가리킨다(결정 135). ${defaultImageRegistry} 로 바꾸거나 지운다.")
}
ext.stoveImageRegistry = stoveImageRegistry
ext.requireNotDockerHubStove = requireNotDockerHubStove

// MinIO 이미지 이름은 여기서 한 번만 정한다. :infra:minio와 통합 테스트가 이 값을 쓰고,
// tools/verification/support/minio_image.py가 같은 규칙을 따른다(docs/testing.md#minio-image).
// - 빌드 이름(Compose·게시와 같다): -Pstove.minio.image > <registry>/minio:<태그>. 테스트 전용 변수는 바꾸지 않는다.
// - 테스트 이름: STOVE_TEST_MINIO_IMAGE > STOVE_MINIO_IMAGE > 빌드 이름
// - STOVE_TEST_MINIO_IMAGE 없이 STOVE_MINIO_IMAGE만 있으면 공급 이미지로 보고 빌드하지 않는다.
// - 테스트 이름이 빌드 이름이나 고정 기본 이름(localhost/stove/minio:<태그>)이면 소스로 만든다(registry에서 받지 않는다).
//   고정 기본 이름이 빌드 이름과 다르면 빌드한 이미지에 그 이름을 붙인다. 그 밖의 이름은 Testcontainers가 받는다.
// - Docker Hub의 stove를 가리키는 이름(예전 기본값 stove/minio:<태그>)은 거절한다(결정 135).
def minioTag = 'RELEASE.2025-04-22T22-12-26Z-local'
def minioEnv = { String name ->
    requireNotDockerHubStove(name, providers.environmentVariable(name).map { it.trim() }.getOrElse(''))
}
def minioTestOverride = minioEnv('STOVE_TEST_MINIO_IMAGE')
def minioSuppliedImage = minioEnv('STOVE_MINIO_IMAGE')
def minioFixedImage = "${defaultImageRegistry}/minio:${minioTag}".toString()
def minioBuildImage = requireNotDockerHubStove('stove.minio.image', providers.gradleProperty('stove.minio.image')
        .map { it.trim() }.getOrElse("${stoveImageRegistry}/minio:${minioTag}".toString()))
def minioTestImage = minioTestOverride ?: (minioSuppliedImage ?: minioBuildImage)
boolean minioSupplied = minioTestOverride.isEmpty() && !minioSuppliedImage.isEmpty()
boolean minioFromSource = !minioSupplied && minioTestImage in [minioBuildImage, minioFixedImage]
ext.minioImageSelection = [
        buildImage    : minioBuildImage,
        testImage     : minioTestImage,
        supplied      : minioSupplied,
        // 테스트 이름으로 빌드 이름을 직접 고른 경우에만, 로컬에 있으면 jibDockerBuild를 건너뛴다.
        reuseRequested: minioTestOverride == minioBuildImage,
        fromSource    : minioFromSource,
        retagForTest  : minioFromSource && minioTestImage != minioBuildImage,
].asImmutable()

// 클래스의 의존성뿐 아니라 실제 런타임에 웹 서버가 전파되는지도 검증한다.
tasks.register('verifyCommonRuntimeDependencies') {
    group = 'verification'
    description = '공통 라이브러리의 실행 환경과 의존성 방향을 검증한다'

    doLast {
        def modules = ['web', 'jpa', 'security', 'contract', 'messaging', 'messaging-kafka']
        modules.each { moduleName ->
            def components = project(":common:${moduleName}").configurations.runtimeClasspath
                    .incoming.resolutionResult.allComponents
            components.each { component ->
                def id = component.id
                if (id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier) {
                    if (id.module in ['spring-webmvc', 'jakarta.servlet-api', 'spring-boot-starter-web',
                                      'spring-boot-starter-tomcat'] || id.group == 'org.apache.tomcat.embed') {
                        throw new GradleException("common:${moduleName} must not provide Servlet runtime: ${id}")
                    }
                }
                if (id instanceof org.gradle.api.artifacts.component.ProjectComponentIdentifier) {
                    if (moduleName != 'web' && id.projectPath == ':common:web') {
                        throw new GradleException("common:${moduleName} must not require common:web at runtime")
                    }
                    if (moduleName == 'contract' && id.projectPath != ':common:contract') {
                        throw new GradleException("common:contract must not require other modules: ${id}")
                    }
                    if (moduleName == 'messaging-kafka' && id.projectPath in [':common:jpa', ':common:messaging']) {
                        throw new GradleException("common:messaging-kafka must not require database messaging: ${id}")
                    }
                }
            }
        }
        logger.lifecycle('Common runtime dependencies verified: ' + modules.join(', '))
    }
}

// 결정 234: 벤치 모듈은 운영 산출물에 들어가지 않는다. 벤치 밖의 어떤 모듈도 실행 클래스패스에 :benchmarks:* 를 두지 않는다.
tasks.register('verifyBenchmarksIsolation') {
    group = 'verification'
    description = '운영 앱·공통 모듈·모의 PG가 벤치 모듈에 의존하지 않는지 검증한다'

    doLast {
        def production = subprojects.findAll { !it.path.startsWith(':benchmarks') && it.configurations.findByName('runtimeClasspath') != null }
        production.each { candidate ->
            candidate.configurations.runtimeClasspath.incoming.resolutionResult.allComponents.each { component ->
                def id = component.id
                if (id instanceof org.gradle.api.artifacts.component.ProjectComponentIdentifier
                        && id.projectPath.startsWith(':benchmarks')) {
                    throw new GradleException("${candidate.path} must not depend on benchmark module ${id.projectPath} (결정 234)")
                }
            }
        }
        logger.lifecycle("Benchmark isolation verified: ${production.size()} modules")
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyCommonRuntimeDependencies')
    dependsOn tasks.named('verifyBenchmarksIsolation')
}

// ── 결함 재현 테스트 합산 보고 ────────────────────────────────────────
//
// **몇 건이 돌았는지 말하게 한다.**
//
// 모듈별 defectTest 는 ignoreFailures = true 라 실패해도 초록이고, 태그가 붙은 테스트가
// 하나도 없으면 아무것도 출력하지 않는다. 그래서 "재현 대기 중인 결함이 없다" 와
// "전부 통과했다" 와 "돌기는 했나?" 가 화면에서 구분되지 않았다 —
// 실제로 지금 0건인데 명령은 조용히 성공한다.
//
// 스모크에서 고친 것과 같은 부류다. 거기서는 EXPECTED_CHECKS 와 종료 코드로 갈랐고
// (docs/decisions.md 20번 옆 흐름), 여기서는 합산해서 말하는 것으로 갈랐다.
// 판정을 바꾸지는 않는다 — 이 태스크의 실패는 "결함이 아직 살아 있다"는 정보이지
// 빌드를 세울 사유가 아니라는 원래 판단은 그대로다.
tasks.register('defectTest') {
    group = 'verification'
    description = '알려진 결함 재현 테스트를 전 모듈에서 돌리고 결과를 합산한다'
    // 소스가 없는 묶음 프로젝트(apps·common 등)에는 defectTest 가 없다.
    dependsOn subprojects.collect { sub -> sub.tasks.matching { it.name == 'defectTest' } }

    def resultDirs = subprojects.collect { it.layout.buildDirectory.dir('test-results/defectTest') }

    doLast {
        int total = 0
        int unresolved = 0
        resultDirs.each { provider ->
            def dir = provider.get().asFile
            if (!dir.isDirectory()) {
                return
            }
            dir.listFiles()?.findAll { it.name.startsWith('TEST-') && it.name.endsWith('.xml') }?.each { file ->
                def suite = new groovy.xml.XmlSlurper().parse(file)
                total += (suite.@tests.text() ?: '0') as int
                unresolved += ((suite.@failures.text() ?: '0') as int) + ((suite.@errors.text() ?: '0') as int)
            }
        }

        println '════════════════════════════════'
        if (total == 0) {
            println '  결함 재현 테스트 0건 — 재현 대기 중인 결함이 없다.'
            println '  (통과가 아니라 미실행이다. 새 결함은 고치기 전에 @Tag("known-defect") 로 먼저 커밋한다)'
        } else if (unresolved > 0) {
            println "  결함 재현 ${total}건 중 ${unresolved}건이 아직 살아 있다 — docs/defects.md 참고"
        } else {
            println "  결함 재현 ${total}건이 전부 통과했다."
            println '  (고쳐졌다는 뜻이다. 태그를 떼고 회귀 방어선으로 승격한다 — docs/testing.md 3절)'
        }
        println '════════════════════════════════'
    }
}
