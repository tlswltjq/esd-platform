plugins {
    id 'java'
    id 'org.springframework.boot' version "${springBootVersion}" apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    // 뮤테이션 테스트. 기본 빌드에 얹지 않고 필요할 때만 돌린다 (아래 pitest 블록 참고)
    id 'info.solidsoft.pitest' version '1.15.0' apply false
}

allprojects {
    group = 'com.stove'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    // Spring Boot BOM 의 testcontainers.version 을 덮어쓴다 (gradle.properties 참고)
    ext['testcontainers.version'] = testcontainersVersion

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
            mavenBom "software.amazon.awssdk:bom:${awsSdkVersion}"
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'

        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs << '-parameters'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    // 결함 재현 테스트(@Tag("known-defect"))는 기본 빌드에서 뺀다.
    // "실패하는 것이 정상"인 테스트라 CI 를 빨갛게 두면 신호가 아니라 소음이 된다.
    // 제외는 test 태스크에만 건다 — withType 으로 걸면 아래 defectTest 까지 같이 걸러진다.
    tasks.named('test') {
        useJUnitPlatform {
            excludeTags 'known-defect'
        }
    }

    // 결함 재현 테스트만 돌린다. 실패 = 결함이 아직 살아 있다는 증거.
    // 고쳐서 통과하기 시작하면 태그를 떼고 회귀 방어선으로 승격한다.
    tasks.register('defectTest', Test) {
        group = 'verification'
        description = '알려진 결함을 재현하는 테스트만 실행한다 (docs/defects.md 참고)'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform {
            includeTags 'known-defect'
        }
        // 결함이 여러 모듈에 걸쳐 있으므로 첫 실패에서 멈추지 않고 전부 돌린다
        ignoreFailures = true
        testLogging {
            events 'passed', 'failed'
            exceptionFormat = 'short'
        }
    }

    // ── 뮤테이션 테스트 ────────────────────────────────────────────────
    // 커버리지는 "거쳐 갔는가"를 재고, 뮤테이션은 "잡아내는가"를 잰다.
    // 통과하지만 결함을 못 잡는 테스트를 색출하는 것이 목적이다.
    //
    // CI 에 넣지 않는다 — 전 모듈 기준 수십 분이 걸려 피드백 루프를 망가뜨린다.
    // 테스트를 새로 붙인 모듈에 대해 수동으로 돌리고 결과를 판단한다.
    //   ./gradlew :apps:payment:pitest
    apply plugin: 'info.solidsoft.pitest'

    pitest {
        junit5PluginVersion = '1.2.1'
        // 앱은 도메인·서비스 계층만 본다. 어댑터는 대부분 위임이라 살아남은 뮤턴트가
        // 대개 "검증할 가치가 없는 위임"이어서 신호 대 잡음비가 나쁘다.
        // common 은 계층이 아니라 모듈 자체가 로직이므로 전체를 본다.
        targetClasses = project.path.startsWith(':apps:')
                ? ['com.stove.*.core.*']
                : ['com.stove.common.*']
        // 결함 재현 테스트는 실패하는 것이 정상이라 뮤테이션 판정에 쓸 수 없다
        excludedTestClasses = ['*DefectTest']
        threads = 4
        timestampedReports = false
        outputFormats = ['HTML', 'XML']
    }
}

// apps/* 는 실행 가능한 부트 애플리케이션, common/* 는 일반 라이브러리 jar
configure(subprojects.findAll { it.path.startsWith(':apps:') }) {
    apply plugin: 'org.springframework.boot'

    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
        runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

        // 모듈 패키지 구조 검증 규칙 (ArchUnit)
        testImplementation project(':common:archunit')
        // 컨텍스트 로딩 검증용 인프라 컨테이너
        testImplementation project(':common:test')
    }

    // Dockerfile 이 build/libs/*.jar 하나만 집도록 plain jar 는 만들지 않는다
    tasks.named('jar') { enabled = false }
}

configure(subprojects.findAll { it.path.startsWith(':common:') }) {
    // 라이브러리는 bootJar 대신 plain jar 를 산출한다
    tasks.named('jar') { enabled = true }

    // 디렉터리에서 뺀 common- 접두사를 산출물에서는 되살린다.
    // 경로는 패키지와 1:1 로 두되(common/core → com.stove.common.core),
    // 클래스패스에 core.jar / web.jar / test.jar 로 뜨는 것은 피한다.
    base { archivesName = "common-${project.name}" }
}

// apps 와 common 은 자식을 담는 껍데기라 소스가 없다.
// 빈 jar 를 만들어 두면 common-*.jar 목록에 모듈이 아닌 것이 섞인다.
configure([project(':apps'), project(':common')]) {
    tasks.named('jar') { enabled = false }
}
