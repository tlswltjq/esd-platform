plugins {
    id 'java'
    id 'org.springframework.boot' version "${springBootVersion}" apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
    group = 'com.stove'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    // Spring Boot BOM 의 testcontainers.version 을 덮어쓴다 (gradle.properties 참고)
    ext['testcontainers.version'] = testcontainersVersion

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
            mavenBom "software.amazon.awssdk:bom:${awsSdkVersion}"
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'

        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs << '-parameters'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}

// apps/* 는 실행 가능한 부트 애플리케이션, common/* 는 일반 라이브러리 jar
configure(subprojects.findAll { it.path.startsWith(':apps:') }) {
    apply plugin: 'org.springframework.boot'

    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
        runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

        // 모듈 패키지 구조 검증 규칙 (ArchUnit)
        testImplementation project(':common:archunit')
        // 컨텍스트 로딩 검증용 인프라 컨테이너
        testImplementation project(':common:test')
    }

    // Dockerfile 이 build/libs/*.jar 하나만 집도록 plain jar 는 만들지 않는다
    tasks.named('jar') { enabled = false }
}

configure(subprojects.findAll { it.path.startsWith(':common:') }) {
    // 라이브러리는 bootJar 대신 plain jar 를 산출한다
    tasks.named('jar') { enabled = true }

    // 디렉터리에서 뺀 common- 접두사를 산출물에서는 되살린다.
    // 경로는 패키지와 1:1 로 두되(common/core → com.stove.common.core),
    // 클래스패스에 core.jar / web.jar / test.jar 로 뜨는 것은 피한다.
    base { archivesName = "common-${project.name}" }
}

// apps 와 common 은 자식을 담는 껍데기라 소스가 없다.
// 빈 jar 를 만들어 두면 common-*.jar 목록에 모듈이 아닌 것이 섞인다.
configure([project(':apps'), project(':common')]) {
    tasks.named('jar') { enabled = false }
}
