# 10개 도메인 서비스 + 게이트웨이를 컨테이너로 띄운다.
#
#   ./gradlew jibDockerBuild                    # 앱·MinIO 이미지 생성
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
#   bash scripts/start-apps.sh -f docker-compose.apps.yml -f docker-compose.apps.local.yml
# 기본 정의는 포트를 열지 않는다. 로컬·E2E의 호스트 접속은 local 오버라이드로 제공한다.
#
# 인프라(docker-compose.yml)가 만든 stove_default 네트워크에 합류한다.
name: stove-apps

x-common-env: &common-env
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_USER: stove
  DB_PASSWORD: stove1234
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  KAFKA_BROKERS: kafka:19092
  ES_URIS: http://elasticsearch:9200
  # 컨테이너 안에서는 localhost 기본값이 자기 자신을 가리키므로 수집기 주소를 명시한다.
  OTLP_ENDPOINT: http://tempo:4318/v1/traces
  JWT_ISSUER_URI: ${AUTH_ISSUER:-http://localhost:8091}
  JWT_JWK_SET_URI: http://auth:8091/oauth2/jwks

x-app-health: &app-health
  interval: 15s
  timeout: 3s
  start_period: 40s
  retries: 5

x-app: &app
  restart: unless-stopped
  networks:
    - stove
  # SIGTERM 뒤 SIGKILL 까지의 유예. **스프링의 종료 단계 타임아웃(30초)보다 길어야 한다** —
  # 짧으면 요청을 마치려고 기다리는 중에 프로세스가 죽어 graceful shutdown 이 그대로 잘린다(D-035).
  # 도커 기본값은 10초라 **양쪽을 명시하지 않으면 이 부등호는 항상 거짓이다.**
  # 여유 10초는 종료 단계가 끝난 뒤 JVM 이 실제로 내려가는 데 쓴다.
  # 부등호는 DeploymentShutdownContractTest 가 지킨다.
  stop_grace_period: 40s

services:
  gateway:
    <<: *app
    image: ${STOVE_JIB_REGISTRY:-stove}/gateway:${STOVE_IMAGE_TAG:-latest}
    healthcheck:
      <<: *app-health
      test: [CMD-SHELL, "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      BFF_CLIENT_SECRET: ${BFF_CLIENT_SECRET:-bff-local-only}
      BFF_PUBLIC_AUTH_BASE: ${BFF_PUBLIC_AUTH_BASE:-http://localhost:8080}
      OTLP_ENDPOINT: http://tempo:4318/v1/traces
      JWT_ISSUER_URI: ${AUTH_ISSUER:-http://localhost:8091}
      JWT_JWK_SET_URI: http://auth:8091/oauth2/jwks
      AUTH_URI: http://auth:8091
      CATALOG_URI: http://catalog:8081
      ORDER_URI: http://order:8082
      PAYMENT_URI: http://payment:8083
      LICENSE_URI: http://license:8084
      STUDIO_URI: http://studio:8085
      REVIEW_URI: http://review:8086
      STORE_URI: http://store:8087
      DOWNLOAD_URI: http://download:8088
      SETTLEMENT_URI: http://settlement:8089

  auth:
    <<: *app
    image: ${STOVE_JIB_REGISTRY:-stove}/auth:${STOVE_IMAGE_TAG:-latest}
    healthcheck:
      <<: *app-health
      test: [CMD-SHELL, "wget -qO- http://localhost:8091/actuator/health | grep -q UP || exit 1"]
    environment:
      <<: *common-env
      AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:8091}
      BFF_CLIENT_SECRET: ${BFF_CLIENT_SECRET:-bff-local-only}
      BFF_REDIRECT_URI: ${BFF_REDIRECT_URI:-http://localhost:8080/login/oauth2/code/gateway-bff}
      AUTH_REVIEWER_EMAIL: reviewer@esd.local
      AUTH_REVIEWER_PASSWORD: ${AUTH_REVIEWER_PASSWORD:-reviewer-local-only}
      AUTH_ADMIN_EMAIL: admin@esd.local
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:-admin-local-only}

  studio:
    <<: *app
    image: ${STOVE_JIB_REGISTRY:-stove}/studio:${STOVE_IMAGE_TAG:-latest}
    healthcheck:
      <<: *app-health
      test: [CMD-SHELL, "wget -qO- http://localhost:8085/actuator/health | grep -q UP || exit 1"]
    expose: ["8085"]
    environment:
      <<: *common-env
      STORAGE_PROVIDER: s3
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PRESIGN_ENDPOINT: http://localhost:9000
      STORAGE_ACCESS_KEY: stove
      STORAGE_SECRET_KEY: stove1234
      # 로컬 MinIO에는 KMS가 없으므로 개발 스택만 SSE를 끈다. 운영 기본값은 true다.
      STORAGE_ENCRYPTION_ENABLED: "false"

  review:
    <<: *app
    image: ${STOVE_JIB_REGISTRY:-stove}/review:${STOVE_IMAGE_TAG:-latest}
    healthcheck:
      <<: *app-health
      test: [CMD-SHELL, "wget -qO- http://localhost:8086/actuator/health | grep -q UP || exit 1"]
    expose: ["8086"]
    environment:
      <<: *common-env
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PRESIGN_ENDPOINT: ${STORAGE_PRESIGN_ENDPOINT:-http://127.0.0.1:19000}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-stove-builds}
      REVIEW_STORAGE_ACCESS_KEY: ${REVIEW_STORAGE_ACCESS_KEY:-}
      REVIEW_STORAGE_SECRET_KEY: ${REVIEW_STORAGE_SECRET_KEY:-}
      REVIEW_BUILD_URL_TTL: ${REVIEW_BUILD_URL_TTL:-PT5M}

  catalog:
    <<: *app
    image: ${STOVE_JIB_REGISTRY:-stove}/catalog:${STOVE_IMAGE_TAG:-latest}
    healthcheck:
      <<: *app-health
      test: [CMD-SHELL, "wget -qO- http://localhost:8081/actuator/health | grep -q UP || exit 1"]
    expose: ["8081"]
    environment:
      <<: *common-env
      STUDIO_URI: http://studio:8085
      CATALOG_DOWNLOAD_SERVICE_KEY: ${CATALOG_DOWNLOAD_SERVICE_KEY:-}
      CATALOG_SETTLEMENT_SERVICE_KEY: ${CATALOG_SETTLEMENT_SERVICE_KEY:-}

  store:
    <<: *app
    image: ${STOVE_JIB_REGISTRY:-stove}/store:${STOVE_IMAGE_TAG:-latest}
    healthcheck:
      <<: *app-health
      test: [CMD-SHELL, "wget -qO- http://localhost:8087/actuator/health | grep -q UP || exit 1"]
    expose: ["8087"]
    environment:
      <<: *common-env
      CATALOG_BASE_URL: http://catalog:8081

  order:
    <<: *app
    image: ${STOVE_JIB_REGISTRY:-stove}/order:${STOVE_IMAGE_TAG:-latest}
    healthcheck:
      <<: *app-health
      test: [CMD-SHELL, "wget -qO- http://localhost:8082/actuator/health | grep -q UP || exit 1"]
    expose: ["8082"]
    environment:
      <<: *common-env
      CATALOG_BASE_URL: http://catalog:8081

  payment:
    <<: *app
    image: ${STOVE_JIB_REGISTRY:-stove}/payment:${STOVE_IMAGE_TAG:-latest}
    healthcheck:
      <<: *app-health
      test: [CMD-SHELL, "wget -qO- http://localhost:8083/actuator/health | grep -q UP || exit 1"]
    expose: ["8083"]
    environment:
      <<: *common-env
      MOCK_PG_URI: http://mock-pg:8092
      MOCK_PG_PAYMENT_KEY: ${MOCK_PG_PAYMENT_KEY:-}

  license:
    <<: *app
    image: ${STOVE_JIB_REGISTRY:-stove}/license:${STOVE_IMAGE_TAG:-latest}
    healthcheck:
      <<: *app-health
      test: [CMD-SHELL, "wget -qO- http://localhost:8084/actuator/health | grep -q UP || exit 1"]
    expose: ["8084"]
    environment: *common-env

  download:
    <<: *app
    image: ${STOVE_JIB_REGISTRY:-stove}/download:${STOVE_IMAGE_TAG:-latest}
    healthcheck:
      <<: *app-health
      test: [CMD-SHELL, "wget -qO- http://localhost:8088/actuator/health | grep -q UP || exit 1"]
    expose: ["8088"]
    environment:
      JWT_ISSUER_URI: ${AUTH_ISSUER:-http://localhost:8091}
      JWT_JWK_SET_URI: http://auth:8091/oauth2/jwks
      OTLP_ENDPOINT: http://tempo:4318/v1/traces
      LICENSE_BASE_URL: http://license:8084
      CATALOG_BASE_URL: http://catalog:8081
      CATALOG_DOWNLOAD_SERVICE_KEY: ${CATALOG_DOWNLOAD_SERVICE_KEY:-}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PRESIGN_ENDPOINT: ${STORAGE_PRESIGN_ENDPOINT:-http://127.0.0.1:19000}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-stove-builds}
      DOWNLOAD_STORAGE_ACCESS_KEY: ${DOWNLOAD_STORAGE_ACCESS_KEY:-}
      DOWNLOAD_STORAGE_SECRET_KEY: ${DOWNLOAD_STORAGE_SECRET_KEY:-}
      DOWNLOAD_BUILD_URL_TTL: ${DOWNLOAD_BUILD_URL_TTL:-PT5M}

  settlement:
    <<: *app
    image: ${STOVE_JIB_REGISTRY:-stove}/settlement:${STOVE_IMAGE_TAG:-latest}
    healthcheck:
      <<: *app-health
      test: [CMD-SHELL, "wget -qO- http://localhost:8089/actuator/health | grep -q UP || exit 1"]
    expose: ["8089"]
    environment:
      <<: *common-env
      MOCK_PG_URI: http://mock-pg:8092
      MOCK_PG_SETTLEMENT_KEY: ${MOCK_PG_SETTLEMENT_KEY:-}
      CATALOG_BASE_URL: http://catalog:8081
      CATALOG_SETTLEMENT_SERVICE_KEY: ${CATALOG_SETTLEMENT_SERVICE_KEY:-}

  mock-pg:
    <<: *app
    image: ${STOVE_JIB_REGISTRY:-stove}/mock-pg:${STOVE_IMAGE_TAG:-latest}
    healthcheck:
      <<: *app-health
      test: [CMD-SHELL, "wget -qO- http://localhost:8092/actuator/health | grep -q UP || exit 1"]
    expose: ["8092"]
    networks: [stove, mock-pg-private]
    depends_on:
      pg-mysql:
        condition: service_healthy
    environment:
      MOCK_PG_DB_HOST: pg-mysql
      MOCK_PG_DB_PORT: "3306"
      MOCK_PG_DB_NAME: mock_pg
      MOCK_PG_DB_USER: mock_pg
      MOCK_PG_DB_PASSWORD: ${MOCK_PG_DB_PASSWORD:-}
      MOCK_PG_PAYMENT_KEY: ${MOCK_PG_PAYMENT_KEY:-}
      MOCK_PG_SETTLEMENT_KEY: ${MOCK_PG_SETTLEMENT_KEY:-}
      MOCK_PG_CONTROL_KEY: ${MOCK_PG_CONTROL_KEY:-}

  pg-mysql:
    image: mysql:8.0
    restart: unless-stopped
    networks: [mock-pg-private]
    environment:
      MYSQL_ROOT_PASSWORD: ${MOCK_PG_DB_ROOT_PASSWORD:-}
      MYSQL_DATABASE: mock_pg
      MYSQL_USER: mock_pg
      MYSQL_PASSWORD: ${MOCK_PG_DB_PASSWORD:-}
    volumes: [mock_pg_mysql:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 2s
      timeout: 3s
      retries: 60

networks:
  mock-pg-private:
    internal: true
  stove:
    name: stove_default
    external: true

volumes:
  mock_pg_mysql:
