# 9개 서비스 + 게이트웨이를 컨테이너로 띄운다.
#
#   ./gradlew build -x test                     # bootJar 생성
#   docker compose up -d                        # 인프라
#   docker compose -f docker-compose.apps.yml up -d --build
#
# 인프라(docker-compose.yml)가 만든 stove_default 네트워크에 합류한다.
name: stove-apps

x-common-env: &common-env
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_USER: stove
  DB_PASSWORD: stove1234
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  KAFKA_BROKERS: kafka:19092
  ES_URIS: http://elasticsearch:9200
  MONGO_URI: mongodb://mongodb:27017/stove_download
  # 컨테이너 안에서는 localhost 기본값이 자기 자신을 가리키므로 수집기 주소를 명시한다.
  OTLP_ENDPOINT: http://tempo:4318/v1/traces

x-app: &app
  restart: unless-stopped
  networks:
    - stove

services:
  gateway:
    <<: *app
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    image: stove/gateway
    ports: ["8080:8080"]
    environment:
      # 게이트웨이는 인프라 접속이 없어 *common-env 를 쓰지 않는다. 추적만 따로 붙인다 —
      # 트레이스가 시작되는 자리라 여기가 빠지면 하류 스팬에 부모가 없다.
      OTLP_ENDPOINT: http://tempo:4318/v1/traces
      CATALOG_URI: http://catalog:8081
      ORDER_URI: http://order:8082
      PAYMENT_URI: http://payment:8083
      LICENSE_URI: http://license:8084
      STUDIO_URI: http://studio:8085
      REVIEW_URI: http://review:8086
      STORE_URI: http://store:8087
      DOWNLOAD_URI: http://download:8088
      SETTLEMENT_URI: http://settlement:8089

  studio:
    <<: *app
    build: { context: ., dockerfile: apps/studio/Dockerfile }
    image: stove/studio
    ports: ["8085:8085"]
    environment: *common-env

  review:
    <<: *app
    build: { context: ., dockerfile: apps/review/Dockerfile }
    image: stove/review
    ports: ["8086:8086"]
    environment: *common-env

  catalog:
    <<: *app
    build: { context: ., dockerfile: apps/catalog/Dockerfile }
    image: stove/catalog
    ports: ["8081:8081"]
    environment: *common-env

  store:
    <<: *app
    build: { context: ., dockerfile: apps/store/Dockerfile }
    image: stove/store
    ports: ["8087:8087"]
    environment: *common-env

  order:
    <<: *app
    build: { context: ., dockerfile: apps/order/Dockerfile }
    image: stove/order
    ports: ["8082:8082"]
    environment:
      <<: *common-env
      CATALOG_BASE_URL: http://catalog:8081

  payment:
    <<: *app
    build: { context: ., dockerfile: apps/payment/Dockerfile }
    image: stove/payment
    ports: ["8083:8083"]
    environment: *common-env

  license:
    <<: *app
    build: { context: ., dockerfile: apps/license/Dockerfile }
    image: stove/license
    ports: ["8084:8084"]
    environment: *common-env

  download:
    <<: *app
    build: { context: ., dockerfile: apps/download/Dockerfile }
    image: stove/download
    ports: ["8088:8088"]
    environment: *common-env

  settlement:
    <<: *app
    build: { context: ., dockerfile: apps/settlement/Dockerfile }
    image: stove/settlement
    ports: ["8089:8089"]
    environment: *common-env

networks:
  stove:
    name: stove_default
    external: true
