# e2e 오버라이드 (인프라) — 조회가 필요한 것 하나만 루프백으로 연다.
#
#   docker compose -f docker-compose.yml -f docker-compose.ci.yml -f docker-compose.e2e.yml up -d
#
# 앱 쪽과 같은 규칙이다(docker-compose.apps.e2e.yml, decisions.md 21번) —
# ci 가 `ports: !reset []` 로 지운 뒤 이 파일이 `127.0.0.1` + 오프셋 10000 으로 다시 연다.
#
# **tempo 하나뿐인 이유.** 21번이 인프라를 열지 않기로 한 근거는 인증 없는 서비스들
# (Elasticsearch·Grafana·MinIO 콘솔·MySQL·MongoDB)이었다. 그 목록은 그대로 닫혀 있다.
# 여는 것은 Tempo 의 **조회 API** 뿐이고, e2e 가 "하나의 traceId 가 6개 서비스에 걸치는지" 를
# 물어보려면 이 문이 필요하다 — Kafka 를 건너는 트레이스 연결에는 지금 회귀 방어선이 없다
# (decisions.md 17번이 메운 간극인데, `trace_parent` 저장을 지워도 아무것도 빨개지지 않았다).
#
# 스팬 수신(4318)은 열지 않는다. 앱이 컨테이너 네트워크 안에서 보내므로 밖에서 넣을 일이 없다.

name: stove

services:
  tempo:
    ports: ["127.0.0.1:13200:3200"]
