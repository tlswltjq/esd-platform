name: stove

services:
  mysql:
    image: mysql:8.0
    container_name: stove-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_USER: stove
      MYSQL_PASSWORD: stove1234
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot1234"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: stove-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]

  # KRaft 모드 — Zookeeper 불필요
  kafka:
    image: apache/kafka:3.9.0
    container_name: stove-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: stove-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      - kafka

  # 컨슈머 랙을 Prometheus 시계열로 올린다.
  #
  # **왜 앱 지표로는 안 되나** — 앱이 노출하는
  # `kafka_consumer_fetch_manager_records_lag` 는 컨슈머 클라이언트가 직전 fetch 응답에서
  # 본 값이다. 그래서 fetch 가 돌지 않는 동안(컨슈머 정지·리밸런싱·유휴 파티션)에는 갱신되지
  # 않는다 — **실제 랙 113,517건 동안 0 을 보고했다**(docs/perf-tuning.md 4절, D-026).
  # 랙이 가장 큰 순간이 그 지표가 가장 못 미더운 순간이다.
  #
  # 이 익스포터는 브로커에게 커밋 오프셋과 로그 끝 오프셋을 직접 물어 차이를 낸다.
  # 컨슈머가 죽어 있어도 참인 값이고, **컨슈머가 죽었을 때야말로 랙을 알아야 한다.**
  #
  # `stove_outbox_pending` 으로는 대신할 수 없다. 그쪽은 발행이 끝나면 0 이다 —
  # 적체가 브로커로 옮겨간 것뿐인데 생산자 지표만 보면 해소된 것처럼 보인다.
  # 이 익스포터가 그 사각을 메운다.
  #
  # 태그를 박는다(mysql·kafka·mongo·tempo 와 같은 이유). v1.9.0 은 amd64·arm64 둘 다 있어
  # 로컬 x86 과 CI 의 aarch64 에서 같은 이미지가 뜬다.
  #
  # `--concurrent.enable` 이 D-032 의 처방이다. 기본값(꺼짐)은 여러 스크레이프가 수집 결과를
  # 공유하는데, 그 공유 경로가 **스크레이프마다 지표를 정확히 한 줄씩 흘린다** — 그리고
  # 흘리는 것은 언제나 토픽 블록의 마지막 전송인 `kafka_consumergroup_lag_sum` 이다.
  # 응답은 200 이고 로그도 조용해서(verbosity=3 + sarama 로깅에서도) 결측이 보이지 않는다.
  #
  # 플래그 설명은 "큰 클러스터에서는 끄라" 고 경고한다 — 스크레이프마다 브로커를 실제로
  # 부르기 때문이다. 여기는 브로커 1대에 컨슈머그룹 12개이므로 그 경고가 적용되지 않는다.
  # **클러스터가 커지면 이 판단을 다시 봐야 한다**(defects.md D-032).
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: stove-kafka-exporter
    command:
      - --kafka.server=kafka:19092
      - --web.listen-address=:9308
      - --concurrent.enable
    ports:
      - "9308:9308"
    depends_on:
      - kafka
    restart: unless-stopped

  # store 검색 색인
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.6
    container_name: stove-elasticsearch
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # 빌드 바이너리 저장소 (S3 호환). 운영의 S3 자리를 로컬에서 대신한다.
  minio:
    image: minio/minio:latest
    container_name: stove-minio
    ports:
      - "9000:9000"     # S3 API
      - "9001:9001"     # 콘솔
    environment:
      MINIO_ROOT_USER: stove
      MINIO_ROOT_PASSWORD: stove1234
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # download 패치 매니페스트/권한 사본
  mongodb:
    image: mongo:7
    container_name: stove-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  prometheus:
    image: prom/prometheus:latest
    container_name: stove-prometheus
    # 기본 인자를 그대로 적고 `--web.enable-lifecycle` 만 더한다.
    # command 를 주는 순간 이미지 기본값이 통째로 대체되므로, 한 줄을 더하려면 네 줄을 옮겨 와야 한다.
    #
    # **왜 필요한가** — 이게 없으면 `POST /-/reload` 가 403 이고 규칙을 바꾸려면 재시작해야 한다.
    # 재시작은 알람 상태(`pending`/`firing` 경과 시간)와 TSDB 의 최근 구간을 함께 흔들어서,
    # **알람이 언제 울리는지를 재는 회차에서 재는 대상 자체를 리셋한다.**
    # 14-7 이 "이번 변경과 무관한 원래 성질"로 넘겼던 것인데, 보상 대신 보류(D-027)를 택하면서
    # **알람이 울린다는 것이 안전의 전제**가 되어 더 이상 넘길 수 없게 됐다.
    #
    # 되돌리는 쪽 위험은 없다 — lifecycle 은 reload/quit 만 열고 쓰기 API 는 열지 않는다.
    # (열리는 것이 부담이면 `--web.enable-admin-api` 와 혼동하지 않는지부터 본다. 그쪽은 안 켠다.)
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      # 파일이 아니라 **디렉터리**를 마운트한다. 파일 단위 바인드는 inode 를 잡으므로,
      # rsync 처럼 파일을 새로 쓰는 도구가 갱신하면 컨테이너 안이 옛 내용에 묶인다 —
      # 원격에서 실제로 겪었다. 호스트 파일은 바뀌었는데 컨테이너는 계속 옛 타깃을 긁고 있었다.
      - ./infra/prometheus:/etc/prometheus:ro

  # 분산 추적 수집/저장. 앱은 OTLP/HTTP(4318)로 보내고 Grafana 는 3200 으로 읽는다.
  #
  # 4318 을 호스트로 열어 두는 이유는 컨테이너 밖(./gradlew bootRun)에서 띄운 앱도
  # 같은 수집기로 보내기 위해서다 — application.yml 의 OTLP_ENDPOINT 기본값이 localhost:4318 이다.
  # 버전을 고정한다. `:latest` 로 뒀더니 원격에서 v3.0.0 이 받아졌고 곧바로 죽었다 —
  # 3.x 에서 설정 스키마가 바뀌어 `ingester`·`compactor` 가 최상위 필드가 아니다:
  #   failed parsing config: field ingester not found in type app.Config
  # 설정 파일과 이미지는 같이 움직여야 하므로 mysql·kafka·mongo 처럼 태그를 박는다.
  tempo:
    image: grafana/tempo:2.9.4
    container_name: stove-tempo
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports:
      - "3200:3200"     # 조회 API (Grafana)
      - "4318:4318"     # OTLP/HTTP 수신
    volumes:
      - ./infra/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo

  grafana:
    image: grafana/grafana:latest
    container_name: stove-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - tempo

volumes:
  mysql-data:
  mongo-data:
  minio-data:
  tempo-data:
