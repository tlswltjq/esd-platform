name: stove

services:
  mysql:
    image: mysql:8.0
    container_name: stove-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_USER: stove
      MYSQL_PASSWORD: stove1234
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot1234"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: stove-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]

  # KRaft 모드 — Zookeeper 불필요
  kafka:
    image: apache/kafka:3.9.0
    container_name: stove-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: stove-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      - kafka

  # store 검색 색인
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.6
    container_name: stove-elasticsearch
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # 빌드 바이너리 저장소 (S3 호환). 운영의 S3 자리를 로컬에서 대신한다.
  minio:
    image: minio/minio:latest
    container_name: stove-minio
    ports:
      - "9000:9000"     # S3 API
      - "9001:9001"     # 콘솔
    environment:
      MINIO_ROOT_USER: stove
      MINIO_ROOT_PASSWORD: stove1234
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # download 패치 매니페스트/권한 사본
  mongodb:
    image: mongo:7
    container_name: stove-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  prometheus:
    image: prom/prometheus:latest
    container_name: stove-prometheus
    ports:
      - "9090:9090"
    volumes:
      # 파일이 아니라 **디렉터리**를 마운트한다. 파일 단위 바인드는 inode 를 잡으므로,
      # rsync 처럼 파일을 새로 쓰는 도구가 갱신하면 컨테이너 안이 옛 내용에 묶인다 —
      # 원격에서 실제로 겪었다. 호스트 파일은 바뀌었는데 컨테이너는 계속 옛 타깃을 긁고 있었다.
      - ./infra/prometheus:/etc/prometheus:ro

  # 분산 추적 수집/저장. 앱은 OTLP/HTTP(4318)로 보내고 Grafana 는 3200 으로 읽는다.
  #
  # 4318 을 호스트로 열어 두는 이유는 컨테이너 밖(./gradlew bootRun)에서 띄운 앱도
  # 같은 수집기로 보내기 위해서다 — application.yml 의 OTLP_ENDPOINT 기본값이 localhost:4318 이다.
  # 버전을 고정한다. `:latest` 로 뒀더니 원격에서 v3.0.0 이 받아졌고 곧바로 죽었다 —
  # 3.x 에서 설정 스키마가 바뀌어 `ingester`·`compactor` 가 최상위 필드가 아니다:
  #   failed parsing config: field ingester not found in type app.Config
  # 설정 파일과 이미지는 같이 움직여야 하므로 mysql·kafka·mongo 처럼 태그를 박는다.
  tempo:
    image: grafana/tempo:2.9.4
    container_name: stove-tempo
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports:
      - "3200:3200"     # 조회 API (Grafana)
      - "4318:4318"     # OTLP/HTTP 수신
    volumes:
      - ./infra/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo

  grafana:
    image: grafana/grafana:latest
    container_name: stove-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - tempo

volumes:
  mysql-data:
  mongo-data:
  minio-data:
  tempo-data:
