# e2e 오버라이드 (앱) — 루프백으로만 포트를 연다.
#
#   docker compose -f docker-compose.apps.yml \
#                  -f docker-compose.apps.ci.yml \
#                  -f docker-compose.apps.e2e.yml up -d
#
# **순서가 중요하다.** ci 가 `ports: !reset []` 로 지운 뒤에 이 파일이 다시 연다.
# 반대로 놓으면 ci 가 이 오버라이드를 지운다.
#
# ── 왜 여는가 ────────────────────────────────────────────────────────
#
# `:e2e` 모듈은 스택 **밖의** JVM 이다. 셸 스모크는 같은 네트워크에 curl 컨테이너를 띄워
# 서비스 이름으로 불렀지만, 그레이들 테스트 JVM 을 그 네트워크에 넣을 수는 없다.
#
# ── 왜 127.0.0.1 인가 ────────────────────────────────────────────────
#
# docker-compose.ci.yml 이 포트를 닫은 근거는 **공개 IP + 인증 없는 서비스**였다
# (Elasticsearch 의 xpack.security 꺼짐, Grafana 익명 접속, MinIO 콘솔, MySQL·MongoDB 기본 자격증명).
# 위험한 것은 포트를 여는 행위가 아니라 `0.0.0.0` 에 붙이는 것이다.
#
# 루프백 바인딩은 그 위험을 만들지 않는다 — 호스트 안에서만 닿고, 호스트에 들어올 수 있는 사람은
# 이미 `docker exec` 로 무엇이든 할 수 있다. 그래서 원래 결정을 뒤집지 않고 풀린다.
# 근거는 docs/decisions.md 21번에 남겼다.
#
# ── 왜 1808X 인가 ────────────────────────────────────────────────────
#
# 앱 포트에 10000 을 더한 오프셋이다. 이 호스트에는 traefik 이 127.0.0.1:8080 을 잡던 자리가 있고
# (docker-compose.apps.ci.yml 주석), 로컬 개발자의 8080 과도 겹치지 않는다.
# **오프셋이 규칙이라 새 서비스가 늘어도 계산이 필요 없다.**

name: stove-apps

services:
  gateway:
    ports: ["127.0.0.1:18080:8080"]
  catalog:
    ports: ["127.0.0.1:18081:8081"]
  order:
    ports: ["127.0.0.1:18082:8082"]
  payment:
    ports: ["127.0.0.1:18083:8083"]
  license:
    ports: ["127.0.0.1:18084:8084"]
  studio:
    ports: ["127.0.0.1:18085:8085"]
  review:
    ports: ["127.0.0.1:18086:8086"]
  store:
    ports: ["127.0.0.1:18087:8087"]
  download:
    ports: ["127.0.0.1:18088:8088"]
  settlement:
    ports: ["127.0.0.1:18089:8089"]
