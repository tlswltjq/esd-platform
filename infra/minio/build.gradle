plugins {
    id 'stove.java-base'
}

apply plugin: 'com.google.cloud.tools.jib'

def targetArchitecture = providers.gradleProperty('stove.jib.platform').getOrElse(
        System.getProperty('os.arch') in ['aarch64', 'arm64'] ? 'arm64' : 'amd64')
// 이미지 이름과 빌드 여부는 루트 build.gradle의 minioImageSelection이 정한다.
def minioImageSelection = rootProject.ext.minioImageSelection
String targetImage = minioImageSelection.buildImage
String testImage = minioImageSelection.testImage
boolean suppliedImage = minioImageSelection.supplied
boolean reuseRequested = minioImageSelection.reuseRequested
boolean retagForTest = minioImageSelection.retagForTest
def rootfs = layout.buildDirectory.dir('rootfs')
def goModules = layout.buildDirectory.dir('go-modules')
def goCache = layout.buildDirectory.dir('go-cache')
def builderImage = providers.gradleProperty('stove.minio.builderImage').getOrElse('golang:1.24-alpine')

// 실행 시점에 판단한다(설정 단계에서 외부 명령을 띄우지 않는다).
def localImagePresent = { String image ->
    try {
        Process process = new ProcessBuilder('docker', 'image', 'inspect', image)
                .redirectErrorStream(true)
                .redirectOutput(ProcessBuilder.Redirect.DISCARD)
                .start()
        return process.waitFor() == 0
    } catch (IOException ignored) {
        return false
    }
}
def reuseLocalImage = { -> reuseRequested && localImagePresent(targetImage) }
// 로컬 이미지 재사용은 jibDockerBuild만 대신한다. 같은 실행에 게시(jib)·tar(jibBuildTar)가 있으면 rootfs를 만든다.
def artifactTaskPaths = ['jib', 'jibBuildTar'].collect { "${project.path}:${it}".toString() }
boolean artifactRequested = false
gradle.taskGraph.whenReady { graph -> artifactRequested = artifactTaskPaths.any { graph.hasTask(it) } }

tasks.register('compileMinio', Exec) {
    group = 'build'
    description = '고정 MinIO/mc 소스를 Go 컨테이너에서 Linux 바이너리로 빌드한다'
    inputs.file('compile.sh').withPathSensitivity(PathSensitivity.NONE)
    inputs.property('architecture', targetArchitecture)
    inputs.property('builderImage', builderImage)
    outputs.dir(rootfs)
    // 결과는 고정 커밋(compile.sh)·빌더 이미지 이름·아키텍처로 정해진다. 테스트용 이미지는 같은 입력의 결과를 빌드 캐시에서
    // 쓴다(CI 전체 빌드에서 약 3분, 로컬 6분이 든다 — 2026-11-23 프로파일). 빌더 이미지는 움직이는 태그라 캐시된 결과가
    // Go 패치·인증서가 조금 오래될 수 있으므로, 배포 산출물(jib 게시·jibBuildTar)을 만들 때는 캐시를 쓰지 않고 새로 컴파일한다.
    outputs.cacheIf('게시·tar(배포 산출물)를 만들지 않는다') { !artifactRequested }
    // 캐시를 끄는 것과 최신 판단은 별개다. 테스트 빌드·캐시 복원이 남긴 rootfs를 배포가 UP-TO-DATE로 쓰지 않게 한다(PR #231 R1).
    outputs.upToDateWhen { !artifactRequested }
    onlyIf('공급 이미지가 없고, 게시·tar를 만들거나 재사용할 로컬 이미지가 없다') {
        !suppliedImage && (artifactRequested || !reuseLocalImage())
    }
    doFirst {
        [rootfs, goModules, goCache].each { it.get().asFile.mkdirs() }
    }
    // 컨테이너는 root로 돈다(compile.sh가 apk add를 한다). 결과물의 주인은 compile.sh가 끝날 때 되돌린다.
    commandLine 'docker', 'run', '--rm',
            '--mount', "type=bind,source=${projectDir}/compile.sh,target=/compile.sh,readonly",
            '--mount', "type=bind,source=${rootfs.get().asFile},target=/out",
            '--mount', "type=bind,source=${goModules.get().asFile},target=/go/pkg/mod",
            '--mount', "type=bind,source=${goCache.get().asFile},target=/root/.cache/go-build",
            '--env', "GOARCH=${targetArchitecture}", builderImage, 'sh', '/compile.sh'
}

jib {
    from {
        image = providers.gradleProperty('stove.minio.baseImage').getOrElse('alpine:3.21')
        platforms {
            platform {
                architecture = targetArchitecture
                os = 'linux'
            }
        }
    }
    to {
        image = targetImage
    }
    container {
        entrypoint = ['/usr/bin/minio']
        ports = ['9000', '9001']
        creationTime = 'EPOCH'
    }
    extraDirectories {
        paths {
            path {
                from = rootfs
                into = '/'
            }
        }
        permissions = ['/usr/bin/minio': '755', '/usr/bin/mc': '755']
    }
}

['jib', 'jibDockerBuild', 'jibBuildTar'].each { name ->
    tasks.named(name) {
        onlyIf('공급 이미지가 없다') { !suppliedImage }
        dependsOn tasks.named('compileMinio')
    }
}
tasks.named('jibDockerBuild') {
    onlyIf('재사용할 로컬 이미지가 없다') { !reuseLocalImage() }
}

// 통합 테스트가 고정 기본 이름을 골랐는데 빌드 이름(registry)이 다르면, 빌드한 이미지에 그 이름을 붙인다.
tasks.register('tagTestImage', Exec) {
    group = 'build'
    description = '통합 테스트용 MinIO 이미지를 준비한다(필요하면 고정 기본 이름을 붙인다)'
    dependsOn tasks.named('jibDockerBuild')
    onlyIf('테스트 이름이 빌드 이름과 다른 고정 기본 이름이다') { retagForTest }
    commandLine 'docker', 'tag', targetImage, testImage
}
tasks.named('jar') { enabled = false }
