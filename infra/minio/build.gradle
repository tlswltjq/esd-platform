plugins {
    id 'com.google.cloud.tools.jib'
}

def targetArchitecture = providers.gradleProperty('stove.jib.platform').getOrElse(
        System.getProperty('os.arch') in ['aarch64', 'arm64'] ? 'arm64' : 'amd64')
// 이미지 이름과 빌드 여부는 루트 build.gradle의 minioImageSelection이 정한다.
def minioImageSelection = rootProject.ext.minioImageSelection
String targetImage = minioImageSelection.buildImage
boolean suppliedImage = minioImageSelection.supplied
boolean reuseRequested = minioImageSelection.reuseRequested
def rootfs = layout.buildDirectory.dir('rootfs')
def goModules = layout.buildDirectory.dir('go-modules')
def goCache = layout.buildDirectory.dir('go-cache')
def builderImage = providers.gradleProperty('stove.minio.builderImage').getOrElse('golang:1.24-alpine')

// 실행 시점에 판단한다(설정 단계에서 외부 명령을 띄우지 않는다).
def localImagePresent = { String image ->
    try {
        Process process = new ProcessBuilder('docker', 'image', 'inspect', image)
                .redirectErrorStream(true)
                .redirectOutput(ProcessBuilder.Redirect.DISCARD)
                .start()
        return process.waitFor() == 0
    } catch (IOException ignored) {
        return false
    }
}
def buildNeeded = { -> !suppliedImage && !(reuseRequested && localImagePresent(targetImage)) }

tasks.register('compileMinio', Exec) {
    group = 'build'
    description = '고정 MinIO/mc 소스를 Go 컨테이너에서 Linux 바이너리로 빌드한다'
    inputs.file('compile.sh')
    inputs.property('architecture', targetArchitecture)
    inputs.property('builderImage', builderImage)
    outputs.dir(rootfs)
    onlyIf('공급 이미지가 없고, 재사용할 로컬 이미지도 없다') { buildNeeded() }
    doFirst {
        [rootfs, goModules, goCache].each { it.get().asFile.mkdirs() }
    }
    // 컨테이너는 root로 돈다(compile.sh가 apk add를 한다). 결과물의 주인은 compile.sh가 끝날 때 되돌린다.
    commandLine 'docker', 'run', '--rm',
            '--mount', "type=bind,source=${projectDir}/compile.sh,target=/compile.sh,readonly",
            '--mount', "type=bind,source=${rootfs.get().asFile},target=/out",
            '--mount', "type=bind,source=${goModules.get().asFile},target=/go/pkg/mod",
            '--mount', "type=bind,source=${goCache.get().asFile},target=/root/.cache/go-build",
            '--env', "GOARCH=${targetArchitecture}", builderImage, 'sh', '/compile.sh'
}

jib {
    from {
        image = providers.gradleProperty('stove.minio.baseImage').getOrElse('alpine:3.21')
        platforms {
            platform {
                architecture = targetArchitecture
                os = 'linux'
            }
        }
    }
    to {
        image = targetImage
    }
    container {
        entrypoint = ['/usr/bin/minio']
        ports = ['9000', '9001']
        creationTime = 'EPOCH'
    }
    extraDirectories {
        paths {
            path {
                from = rootfs
                into = '/'
            }
        }
        permissions = ['/usr/bin/minio': '755', '/usr/bin/mc': '755']
    }
}

['jib', 'jibDockerBuild', 'jibBuildTar'].each { name ->
    tasks.named(name) {
        onlyIf('공급 이미지가 없고, 재사용할 로컬 이미지도 없다') { buildNeeded() }
        dependsOn tasks.named('compileMinio')
    }
}
tasks.named('jar') { enabled = false }
