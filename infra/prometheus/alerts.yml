# 메시지가 사라지고 있는지 사람에게 알리는 규칙.
#
# DLT 와 Outbox DEAD 는 유실을 막지만 **알려주지는 않는다.** 아무도 보지 않으면 조용히 쌓이기만
# 하고, 그건 운영상 유실과 크게 다르지 않다. "포기했다"가 도달해야 복구가 시작된다.
#
# 지표 출처는 코드다 — common:messaging 의 OutboxMetrics, common:kafka 의 DeadLetterMetrics.
# 예외가 하나 있다: stove-consumer 그룹은 kafka-exporter 가 브로커에서 읽어 온 값을 쓴다.
# 앱이 같은 이름의 지표를 내지만 믿을 수 없기 때문이고, 그 사연은 그 그룹의 주석에 있다.
groups:
  - name: stove-messaging
    rules:
      # 발행을 영영 포기한 이벤트. 정상 운영에서는 0 이어야 하므로 한 건이라도 즉시 알린다.
      # 되살리는 경로는 POST /api/v1/ops/outbox/dead/{eventId}/requeue 다.
      - alert: OutboxEventsAbandoned
        expr: increase(stove_outbox_dead_total[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.application }}: Outbox 이벤트 발행을 포기했다"
          description: >-
            최근 5분간 {{ $value }}건이 DEAD 로 떨어졌다.
            GET /api/v1/ops/outbox/dead 로 사유를 보고, 원인을 제거한 뒤 requeue 한다.

      # 적체. 릴레이가 못 따라가거나 브로커가 느린 상태이고, 방치하면 DEAD 로 넘어간다.
      # 순간 폭주와 구분하려고 10분을 본다 -- 배치 한 번에 200건씩 나가므로 짧은 스파이크는 정상이다.
      - alert: OutboxBacklogGrowing
        expr: stove_outbox_pending > 500
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.application }}: Outbox 적체가 10분째 해소되지 않는다"
          description: "발행 대기 {{ $value }}건. 브로커 상태와 릴레이 로그를 먼저 본다."

      # 수신 측이 재시도를 소진해 DLT 로 넘긴 메시지.
      # topic 태그가 어느 흐름이 막혔는지 바로 알려준다.
      #
      # 뒤쪽 절이 필요한 이유 -- Micrometer 는 카운터를 **처음 증가할 때 등록**한다.
      # 그래서 그 서비스의 첫 실패는 시계열이 값 1 로 갑자기 생기는 모습이고,
      # increase() 는 구간에 이전 표본이 없으면 0 을 낸다. 원격에서 실제로 그랬다 --
      # 반복 실패한 서비스만 뜨고 방금 처음 실패한 서비스는 조용했다.
      # "지금 0 보다 큰데 5분 전에는 없던 시계열"이 곧 그 첫 건이다.
      - alert: MessagesDeadLettered
        expr: >-
          increase(stove_kafka_dead_lettered_total[5m]) > 0
          or (stove_kafka_dead_lettered_total > 0
              unless stove_kafka_dead_lettered_total offset 5m)
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.application }}: {{ $labels.topic }} 처리를 포기해 DLT 로 보냈다"
          description: >-
            최근 5분간 {{ $value }}건. GET /api/v1/ops/dlt?topic={{ $labels.topic }}.DLT 로 원인을 보고,
            고친 뒤 POST /api/v1/ops/dlt/replay 로 되돌린다.

      # 사람이 지시하지 않은 환불. 결제창 만료 자동 환불은 사용자 요청도 운영자 조작도 아닌,
      # **시스템이 스스로 돈을 되돌리는** 유일한 HTTP 경로다.
      #
      # 정상 운영에서 0 은 아니다 -- 결제창을 열어 두고 자리를 뜬 사용자가 늘 조금은 있다.
      # 그래서 한 건에 울리지 않고 **추세**로 본다. 갑자기 늘었다면 우리 창(checkout-window)이
      # PG 세션보다 짧아졌다는 뜻이고, 그건 우리가 멀쩡한 결제를 되돌리고 있다는 뜻이다.
      #
      # 사용자에게는 "결제했는데 취소됐다" 로 보인다 -- **당사자만 알고 우리는 모르는 상태**가
      # 이 규칙이 막으려는 것이다.
      - alert: AutoRefundsRising
        expr: increase(stove_payment_auto_refunded_total[15m]) > 5
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.application }}: 시스템 자동 환불이 늘고 있다 (사유 {{ $labels.reason }})"
          description: >-
            최근 15분간 {{ $value }}건. stove.payment.checkout-window 가 PG 결제창 세션보다
            짧으면 정상 결제가 되돌려진다 -- 두 값을 먼저 대조한다.

      # 돈이 나갔는지 불확실한 상태로 남아 있는 결제.
      #
      # CANCELING 은 "PG 환불을 요청하기로 커밋했는데 확정까지 못 갔다" 는 뜻이다. 착수와 확정
      # 사이에 되돌릴 수 없는 외부 호출이 끼어 있어서 생기는 자리이고, 스윕이 분 단위로 재개한다.
      #
      # **게이지에 거는 이유** -- 재개 카운터(stove_payment_refund_resumed_total)는 스윕이 계속
      # 실패해도 늘지 않고, 계속 성공해도 남아 있는 건수를 말해 주지 않는다.
      # 물어야 하는 것은 "지금 몇 건이 불확실한가" 이므로 게이지가 답이다.
      #
      # 10분을 보는 것은 스윕 주기(1분) × 여유다. 한두 회차 실패는 PG 순간 장애로 정상이고,
      # 10분을 못 지우면 그건 재개 자체가 막힌 것이다 -- 그때는 사람이 PG 상태를 봐야 한다.
      - alert: RefundsStuckInCanceling
        expr: min_over_time(stove_payment_canceling[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.application }}: 환불이 확정되지 않은 채 10분째 남아 있다"
          description: >-
            {{ $value }}건이 CANCELING 이다. 사용자에게는 "환불했다는데 돈이 안 들어왔다" 로 보인다.
            스윕이 1분마다 재개하므로 10분을 못 지웠다면 PG 호출 자체가 막힌 것이다.

      # 스크레이프가 끊긴 것도 신호다 -- 위 세 규칙이 전부 조용해지기 때문이다.
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} 지표 수집이 2분째 끊겼다"
          description: "이 서비스의 다른 알람은 이 동안 울리지 않는다."

  # 받는 쪽. 위 그룹이 못 보는 자리를 본다.
  #
  # **`stove_outbox_pending` 으로는 컨슈머 적체를 볼 수 없다.** 발행이 끝나면 그 값은 0 이다 —
  # 적체가 브로커로 옮겨간 것뿐인데 생산자 지표만 보면 해소된 것처럼 보인다.
  # 측정으로 확인된 격차가 릴레이 948.7 : 컨슈머 141.1 events/s(6.7배)이므로,
  # 밀리는 쪽은 구조적으로 항상 컨슈머다(docs/perf-tuning.md 4절).
  #
  # 지표 출처가 앱이 아니라 kafka-exporter 인 이유 — 앱의
  # `kafka_consumer_fetch_manager_records_lag` 는 **실제 랙 113,517건 동안 0 을 보고했다**(D-026).
  # 컨슈머가 멈추면 그 지표도 같이 멈춘다. 알람이 가장 필요한 상태에서 침묵하는 지표로는
  # 알람을 걸 수 없다.
  - name: stove-consumer
    rules:
      # 적체. OutboxBacklogGrowing 의 컨슈머 쪽 짝이고 임계도 같게 뒀다 —
      # 발행 배치가 200건이라 짧은 스파이크는 정상이고, 10분을 못 비우면 그건 추세다.
      #
      # **`for: 10m` 이 아니라 `min_over_time(...[10m])` 인 이유** — 이 시계열은 끊긴다.
      # 실측에서 스크레이프 133회 중 랙 표본이 126개였다(결측 5.3%). `up` 은 내내 1이었으므로
      # **스크레이프는 성공하는데 익스포터가 그 컨슈머그룹만 빼고 응답한 것**이다.
      # 앱 지표(stove_outbox_pending)는 같은 구간에 180/180 으로 한 번도 안 빠졌다 — 익스포터 쪽 성질이다.
      #
      # `for` 는 조건이 **한 번이라도** 거짓이면 시계를 0으로 되돌린다. 그래서 결측 하나에 리셋된다.
      # 표본당 5.3% 로 60표본을 연속으로 채울 확률은 0.947^60 ≈ 4% — **사실상 울리지 않는다.**
      # 실제로 랙이 592 로 10분 넘게 고정이었는데 pending 이 네 번 리셋되고 끝내 발화하지 않았다(D-031).
      #
      # `min_over_time` 은 창 안의 **있는 표본만** 본다. "10분 내내 500 을 넘었다"를 결측에 무너지지
      # 않게 말하는 형태이고, 지속 조건이 창 안에 들어 있으므로 `for` 는 필요 없다 —
      # 아래 ConsumerStalled 가 `[5m]` 에 `for` 를 붙이지 않는 것과 같은 이유다.
      - alert: ConsumerLagGrowing
        expr: min_over_time(kafka_consumergroup_lag_sum[10m]) > 500
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.consumergroup }}: {{ $labels.topic }} 랙이 10분째 해소되지 않는다"
          description: >-
            미소비 {{ $value }}건. 리스너 처리시간(spring_kafka_listener_seconds)을 먼저 보고,
            느린 것이 아니라 멈춘 것이면 ConsumerStalled 가 같이 울린다.
            처리량이 필요하면 listener.concurrency 를 파티션 수(3)까지 올릴 수 있다.

      # **멈춘 것과 느린 것을 가른다.** 랙이 있는데 커밋 오프셋이 5분간 한 칸도 안 움직이면
      # 밀리는 게 아니라 서 있는 것이다 — 리밸런싱이 끝나지 않았거나, 리스너가 같은 메시지에서
      # 계속 예외를 던지며 재시도를 돌고 있거나, 컨슈머가 죽었다.
      #
      # 위 규칙만으로는 이 상태가 "랙 501건" 으로만 보이고, 500 을 못 넘기면 아예 안 보인다.
      # 컨슈머가 죽어도 브로커의 커밋 오프셋은 남아 있으므로 이 식은 그때도 참을 말한다.
      #
      # delta 를 쓰는 것은 이 값이 카운터가 아니라 게이지이기 때문이다.
      #
      # **`for` 를 두지 않는다.** 지속 조건은 이미 `[5m]` 안에 들어 있다 —
      # 5분 창의 delta 가 0 이라는 것 자체가 "5분간 안 움직였다" 이다.
      # 여기에 `for: 5m` 을 더하면 그 상태가 다시 5분 유지되어야 울려 실제 발화가 10분이 되는데,
      # 정작 description 은 5분이라고 말한다. **critical 알람에서 시계가 두 배로 어긋난다.**
      # 위 ConsumerLagGrowing 도 같은 이유로 `for` 를 뗐다 — 그쪽은 결측이 시계를 리셋해서
      # **아예 울리지 않았다**(D-031). 두 규칙 모두 지속 조건을 창 안에 넣어 표현한다.
      # 랙 지표가 얼마나 자주 빠지는가 -- **알람이 기대는 시계열 자체를 감시한다.**
      #
      # D-031 이 여기서 나왔다. up 은 내내 1인데 랙 표본만 5.3% 가 없었고, `for` 가 그 결측을
      # 거짓으로 읽어 10분 시계를 계속 되돌렸다. 규칙은 min_over_time 으로 고쳤지만
      # **결측률이 더 오르면 창 안에 표본이 아예 없어 무응답이 된다** -- 그때는 위 두 규칙이
      # 조용해지고, 조용한 것은 정상과 모습이 같다.
      #
      # 분모가 `sum_over_time(up)` 인 것은 **성공한 스크레이프만** 세기 위해서다.
      # count_over_time 을 쓰면 실패한 스크레이프까지 분모에 들어가 익스포터가 죽었을 때도
      # 울리는데, 그건 ServiceDown 의 일이다. 익스포터가 완전히 죽으면 랙 시계열이 아예 없어
      # 이 식은 결과를 내지 않는다 -- 한 사건에 두 알람이 겹치지 않는다.
      #
      # **임계를 정하다가 알게 된 것** -- 결측률이 그룹마다 다르다. 같은 10분 창에서
      # license/payment.v1 은 0.967 인데 order/payment.v1 은 **0.750** 이었다(6개 시리즈, 0.75~0.98).
      # 처음에 0.75 로 잡았더니 즉시 발화했다. license 하나만 보고 정한 값이었다.
      #
      # 그래서 0.5 로 낮춘다. 근거는 "언제 지표가 못 쓰게 되는가" 가 아니다 --
      # 10분 창에 60번 긁으므로 90% 를 잃어도 표본 6개가 남아 min_over_time 은 돈다.
      # 근거는 **"관측된 정상 범위(0.75~0.98)에서 명백히 벗어나는 지점"** 이고,
      # 절반이 사라지는 것은 익스포터 동작이 달라졌다는 뜻이다.
      #
      # 원인은 익스포터 쪽이라 우리가 고칠 수 없다. **고치는 대신 나빠지는 것을 본다.**
      - alert: ConsumerLagMetricGaps
        expr: >-
          count_over_time(kafka_consumergroup_lag_sum[10m])
          / scalar(sum_over_time(up{job="kafka-exporter"}[10m])) < 0.5
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.consumergroup }}: 랙 지표 표본이 절반 넘게 빠지고 있다"
          description: >-
            보존율 {{ $value }}. 스크레이프는 성공하는데 익스포터가 이 그룹만 빼고 응답하는 상태다.
            더 나빠지면 ConsumerLagGrowing·ConsumerStalled 가 판정할 표본을 잃는다(D-031).

      - alert: ConsumerStalled
        expr: >-
          kafka_consumergroup_lag_sum > 0
          and delta(kafka_consumergroup_current_offset_sum[5m]) == 0
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.consumergroup }}: {{ $labels.topic }} 소비가 멈췄다"
          description: >-
            미소비 {{ $value }}건이 남았는데 커밋 오프셋이 5분간 움직이지 않았다.
            리스너 예외(spring_kafka_listener_seconds_count{error!="none"})와 DLT 를 본다.
