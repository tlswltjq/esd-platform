# 메시지가 사라지고 있는지 사람에게 알리는 규칙.
#
# DLT 와 Outbox DEAD 는 유실을 막지만 **알려주지는 않는다.** 아무도 보지 않으면 조용히 쌓이기만
# 하고, 그건 운영상 유실과 크게 다르지 않다. "포기했다"가 도달해야 복구가 시작된다.
#
# 지표 출처는 코드다 — common:messaging 의 OutboxMetrics, common:kafka 의 DeadLetterMetrics.
# 예외가 하나 있다: stove-consumer 그룹은 kafka-exporter 가 브로커에서 읽어 온 값을 쓴다.
# 앱이 같은 이름의 지표를 내지만 믿을 수 없기 때문이고, 그 사연은 그 그룹의 주석에 있다.
groups:
  - name: stove-messaging
    rules:
      # 발행을 영영 포기한 이벤트. 정상 운영에서는 0 이어야 하므로 한 건이라도 즉시 알린다.
      # 되살리는 경로는 POST /api/v1/ops/outbox/dead/{eventId}/requeue 다.
      - alert: OutboxEventsAbandoned
        expr: increase(stove_outbox_dead_total[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.application }}: Outbox 이벤트 발행을 포기했다"
          description: >-
            최근 5분간 {{ $value }}건이 DEAD 로 떨어졌다.
            GET /api/v1/ops/outbox/dead 로 사유를 보고, 원인을 제거한 뒤 requeue 한다.

      # 적체. 릴레이가 못 따라가거나 브로커가 느린 상태이고, 방치하면 DEAD 로 넘어간다.
      # 순간 폭주와 구분하려고 10분을 본다 -- 배치 한 번에 200건씩 나가므로 짧은 스파이크는 정상이다.
      - alert: OutboxBacklogGrowing
        expr: stove_outbox_pending > 500
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.application }}: Outbox 적체가 10분째 해소되지 않는다"
          description: "발행 대기 {{ $value }}건. 브로커 상태와 릴레이 로그를 먼저 본다."

      # 수신 측이 재시도를 소진해 DLT 로 넘긴 메시지.
      # topic 태그가 어느 흐름이 막혔는지 바로 알려준다.
      #
      # 뒤쪽 절이 필요한 이유 -- Micrometer 는 카운터를 **처음 증가할 때 등록**한다.
      # 그래서 그 서비스의 첫 실패는 시계열이 값 1 로 갑자기 생기는 모습이고,
      # increase() 는 구간에 이전 표본이 없으면 0 을 낸다. 원격에서 실제로 그랬다 --
      # 반복 실패한 서비스만 뜨고 방금 처음 실패한 서비스는 조용했다.
      # "지금 0 보다 큰데 5분 전에는 없던 시계열"이 곧 그 첫 건이다.
      - alert: MessagesDeadLettered
        expr: >-
          increase(stove_kafka_dead_lettered_total[5m]) > 0
          or (stove_kafka_dead_lettered_total > 0
              unless stove_kafka_dead_lettered_total offset 5m)
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.application }}: {{ $labels.topic }} 처리를 포기해 DLT 로 보냈다"
          description: >-
            최근 5분간 {{ $value }}건. GET /api/v1/ops/dlt?topic={{ $labels.topic }}.DLT 로 원인을 보고,
            고친 뒤 POST /api/v1/ops/dlt/replay 로 되돌린다.

      # 현재 PortOne TEST 환불의 관리자 지연 목록과 같은 집계다.
      # 최초 취소 준비 + 3시간 경계를 이미 지표에서 적용하므로 for 로 더 기다리지 않는다.
      # 확정·실패 건은 빠지고, 미확정 중단 건은 남으며 복구 뒤 자동 해제된다.
      - alert: RefundConfirmationsDelayed
        expr: stove_payment_refund_confirmation_delayed > 0
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.application }}: 환불 확인이 원래 3시간 기한을 넘겼다"
          description: >-
            {{ $value }}건이 최초 취소 준비 뒤 3시간 이상 미확정이다.
            GET /api/v1/admin/refund-delays에서 원래 근거와 다음 조회를 확인한다.
            시간만으로 실패·권한 복구·새 금융 요청을 만들지 않는다.

      # 귀속 미확정 환불(결정 127). PG 조회가 같은 원결제의 전액 취소를 확인해 고객 환불은 끝났지만,
      # 우리 시도의 취소인지 모르는(PG_QUERY_UNATTRIBUTED) PENDING 실행 중 운영 종결이 없는 건이다.
      # 돈은 이미 돌아갔고 종결만 남은 점이 승인 보류 PG_CANCELLED와 같아 warning이며, 대상이 생기면 바로 알리도록 for 를 두지 않는다.
      # 위 RefundConfirmationsDelayed(미확정, critical)와 대상이 겹치지 않는다. 종결하면 자동 해제된다.
      - alert: RefundsUnattributed
        expr: stove_payment_refund_unattributed_open > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.application }}: 귀속 미확정 환불 종결 필요"
          description: >-
            {{ $value }}건이 PG 전액 취소로 환불됐지만 우리 시도의 취소인지 판정되지 않았다.
            GET /api/v1/admin/refund-delays?kind=UNATTRIBUTED에서 대상을 찾고,
            POST /api/v1/admin/refund-delays/{attemptId}/closure로 PG 재조회 근거와 귀속 판정을 남겨 종결한다.
            알려진 과거 건은 Alertmanager silence로 알림을 관리한다.

      # License 단계 이벤트를 기다리다 멈춘 환불(결정 125, 정지·복구·승인 중단으로 범위 확장).
      # LicenseGranted·LicenseSuspended·LicenseRestored·LicenseApprovalCorrected(또는 그 요청)가 DEAD·DLT로 가거나 Kafka에서 사라지면
      # 이벤트 경보는 한 번만 울리고, 환불은 조용히 그 대기 상태에 남는다. 이 경보는 그 환불이 남아 있는 동안 상태(status 라벨)마다 울린다.
      # 진입 + 10분(stove.order.refund.license-grant-delay) 경계를 이미 지표에서 적용하므로 for 로 더 기다리지 않는다.
      # 시스템이 새 금융 동작을 하지 않고 운영자 재처리만 남으므로 결정 125와 같은 warning이다. 다음 이벤트가 반영되면 자동 해제된다.
      # 식은 결정 125 그대로라 status 라벨이 없는 옛 시계열에도 같은 규칙으로 울린다. 그 시계열은 지급 확인 대기만 셌으므로
      # 문구의 상태 기본값을 PENDING_LICENSE_GRANT로 둔다.
      - alert: RefundLicenseGrantsDelayed
        expr: stove_order_refund_license_grant_delayed > 0
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.application }}: 환불이 {{ or $labels.status "PENDING_LICENSE_GRANT" }} 대기에서 10분 넘게 다음 License 이벤트를 기다린다'
          description: >-
            {{ $value }}건이 {{ or $labels.status "PENDING_LICENSE_GRANT" }}에 들어간 뒤 10분 넘게 다음 이벤트를 받지 못했다
            (PENDING_LICENSE_GRANT는 LicenseGranted, PENDING_LICENSE_SUSPENSION은 LicenseSuspended,
            PENDING_LICENSE_RESTORATION은 LicenseRestored, PENDING_APPROVAL_STOP은 LicenseSuspended 또는 LicenseApprovalCorrected).
            GET /api/v1/admin/refunds?status={{ or $labels.status "PENDING_LICENSE_GRANT" }}의 진입 시각(licenseGrantWaitStartedAt·licenseSuspensionWaitStartedAt·
            licenseRestorationWaitStartedAt·approvalStopWaitStartedAt)으로 대상을 찾고, docs/license-event-recovery-runbook.md로
            DEAD 재큐잉·DLT 재투입·SENT 재발행을 확인한다. 새 이벤트를 만들거나 SQL로 상태를 바꾸지 않는다.

      # 승인 보류(결정 114·115). PAID_WITHOUT_ADMISSION은 돈이 나갔는데 주문이 결제되지 않아 critical이다.
      # PG_CANCELLED를 포함한 나머지는 warning이다. PG_CANCELLED는 PG가 이미 전액을 돌려준 상태이고 종결만 남았다.
      # PG_PENDING_AT_ORDER_EXPIRY(결정 126)는 접수 전 PAY_PENDING 관측 건이 만료 뒤에도 PENDING인 상태이고, PAID가 되면 critical 사유로 바뀐다.
      # CONFIRM_WINDOW_EXPIRED(결정 124)는 접수 승인이 최초 준비 + 3시간(confirm 기한)을 넘겼는데 PG가 PENDING·READY인 상태다. 늦은 PAID·FAILED는 원래 주문으로 끝난다.
      - alert: PaymentApprovalsRequireReview
        expr: stove_payment_approval_review_required{reason="PAID_WITHOUT_ADMISSION"} > 0
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.application }}: 결제 승인 보류 조사 필요"
          description: >-
            {{ $value }}건의 승인 보류가 {{ $labels.reason }} 사유로 조사 대기 중이다.
            GET /api/v1/admin/approval-reviews에서 저장된 PG 관측과 조사 기록을 확인한다.
            PG 콘솔에서 처리한 뒤 POST /api/v1/admin/approval-reviews/{approvalId}/closure로 PG 재조회 근거를 확인해 종결한다.
            알려진 과거 보류는 Alertmanager silence로 알림을 관리한다.

      - alert: PaymentApprovalsRequireReview
        expr: stove_payment_approval_review_required{reason!="PAID_WITHOUT_ADMISSION"} > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.application }}: 결제 승인 보류 조사 필요"
          description: >-
            {{ $value }}건의 승인 보류가 {{ $labels.reason }} 사유로 조사 대기 중이다.
            GET /api/v1/admin/approval-reviews에서 저장된 PG 관측과 조사 기록을 확인한다.
            PG 콘솔에서 처리한 뒤 POST /api/v1/admin/approval-reviews/{approvalId}/closure로 PG 재조회 근거를 확인해 종결한다.
            알려진 과거 보류는 Alertmanager silence로 알림을 관리한다.

      # 만료 스윕이 살아 있는가.
      #
      # **스윕이 안 도는 상태는 정상 상태와 모습이 같다** -- 대상이 0건이면 "돌았는데 할 일이
      # 없었다" 와 "아예 안 돌았다" 가 구분되지 않는다. 이 저장소가 D-021·D-023·D-031 로
      # 세 번 밟은 자리라, 장치를 넣으면서 그 장치가 살아 있다는 증거를 같이 넣는다.
      #
      # 현재 스캔은 회차당 100건·기본 1초 간격이며 PENDING 주문만 처리한다.
      # 기존 임계값 2000건과 10분/30분 관측 창은 유지한다.
      #
      # stove_order_pending 이 아니라 expirable 을 보는 이유 -- pending 은 정상 사용으로도
      # 오르내린다. 거기에 걸면 잡음이 되고, 잡음은 사람이 알람을 무시하는 법을 가르친다.
      #
      # 아래 D-031 수치는 과거 실험 기록이며 현재 스캔 설정과 구분한다.
      # **deriv 조건이 핵심이다.** 처음 쓴 판은 `> 2000` 뿐이었는데, 실제로 걸어 보니
      # **밀린 것을 정상적으로 걷어내는 3시간 내내 울렸다** -- 스윕은 500건/분으로 잘 돌고 있었다.
      # 그건 "쌓인다" 가 아니라 "많다" 를 잰 것이다. 물어야 하는 것은 양이 아니라 **방향**이므로
      # 30분 기울기가 0 이상일 때만, 즉 **줄어들지 않을 때만** 울린다.
      # 규칙을 돌려 보지 않았으면 못 봤을 종류다(D-031 이 가르친 자리).
      #
      # min_over_time 을 쓰는 이유도 D-031 과 같다. for 는 결측을 거짓으로 보고 시계를 되돌린다.
      - alert: OrderExpirySweepFalling
        expr: >-
          min_over_time(stove_order_expirable[10m]) > 2000
          and deriv(stove_order_expirable[30m]) >= 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.application }}: 만료 대상 주문이 걷히지 않고 쌓인다"
          description: >-
            생성 후 30분을 넘긴 PENDING 주문이 {{ $value }}건이고 30분 추세가 줄지 않는다.
            만료 스케줄러 실행·DB 잠금·처리 실패 로그를 확인한다.

      # 스크레이프가 끊기면 업무 경보가 조용해지므로 수집 실패 자체도 감시한다.
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} 지표 수집이 2분째 끊겼다"
          description: "이 서비스의 다른 알람은 이 동안 울리지 않는다."

  # 받는 쪽. 위 그룹이 못 보는 자리를 본다.
  #
  # **`stove_outbox_pending` 으로는 컨슈머 적체를 볼 수 없다.** 발행이 끝나면 그 값은 0 이다 —
  # 적체가 브로커로 옮겨간 것뿐인데 생산자 지표만 보면 해소된 것처럼 보인다.
  # 측정으로 확인된 격차가 릴레이 948.7 : 컨슈머 141.1 events/s(6.7배)이므로,
  # 밀리는 쪽은 구조적으로 항상 컨슈머다.
  #
  # 지표 출처가 앱이 아니라 kafka-exporter 인 이유 — 앱의
  # `kafka_consumer_fetch_manager_records_lag` 는 **실제 랙 113,517건 동안 0 을 보고했다**(D-026).
  # 컨슈머가 멈추면 그 지표도 같이 멈춘다. 알람이 가장 필요한 상태에서 침묵하는 지표로는
  # 알람을 걸 수 없다.
  - name: stove-consumer
    rules:
      # 적체. OutboxBacklogGrowing 의 컨슈머 쪽 짝이고 임계도 같게 뒀다 —
      # 발행 배치가 200건이라 짧은 스파이크는 정상이고, 10분을 못 비우면 그건 추세다.
      #
      # **`for: 10m` 이 아니라 `min_over_time(...[10m])` 인 이유** — 이 시계열은 끊긴다.
      # 실측에서 스크레이프 133회 중 랙 표본이 126개였다(결측 5.3%). `up` 은 내내 1이었으므로
      # **스크레이프는 성공하는데 익스포터가 그 컨슈머그룹만 빼고 응답한 것**이다.
      # 앱 지표(stove_outbox_pending)는 같은 구간에 180/180 으로 한 번도 안 빠졌다 — 익스포터 쪽 성질이다.
      #
      # `for` 는 조건이 **한 번이라도** 거짓이면 시계를 0으로 되돌린다. 그래서 결측 하나에 리셋된다.
      # 표본당 5.3% 로 60표본을 연속으로 채울 확률은 0.947^60 ≈ 4% — **사실상 울리지 않는다.**
      # 실제로 랙이 592 로 10분 넘게 고정이었는데 pending 이 네 번 리셋되고 끝내 발화하지 않았다(D-031).
      #
      # `min_over_time` 은 창 안의 **있는 표본만** 본다. "10분 내내 500 을 넘었다"를 결측에 무너지지
      # 않게 말하는 형태이고, 지속 조건이 창 안에 들어 있으므로 `for` 는 필요 없다 —
      # 아래 ConsumerStalled 가 `[5m]` 에 `for` 를 붙이지 않는 것과 같은 이유다.
      - alert: ConsumerLagGrowing
        expr: min_over_time(kafka_consumergroup_lag_sum[10m]) > 500
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.consumergroup }}: {{ $labels.topic }} 랙이 10분째 해소되지 않는다"
          description: >-
            미소비 {{ $value }}건. 리스너 처리시간(spring_kafka_listener_seconds)을 먼저 보고,
            느린 것이 아니라 멈춘 것이면 ConsumerStalled 가 같이 울린다.
            처리량이 필요하면 listener.concurrency 를 파티션 수(3)까지 올릴 수 있다.

      # **멈춘 것과 느린 것을 가른다.** 랙이 있는데 커밋 오프셋이 5분간 한 칸도 안 움직이면
      # 밀리는 게 아니라 서 있는 것이다 — 리밸런싱이 끝나지 않았거나, 리스너가 같은 메시지에서
      # 계속 예외를 던지며 재시도를 돌고 있거나, 컨슈머가 죽었다.
      #
      # 위 규칙만으로는 이 상태가 "랙 501건" 으로만 보이고, 500 을 못 넘기면 아예 안 보인다.
      # 컨슈머가 죽어도 브로커의 커밋 오프셋은 남아 있으므로 이 식은 그때도 참을 말한다.
      #
      # delta 를 쓰는 것은 이 값이 카운터가 아니라 게이지이기 때문이다.
      #
      # **`for` 를 두지 않는다.** 지속 조건은 이미 `[5m]` 안에 들어 있다 —
      # 5분 창의 delta 가 0 이라는 것 자체가 "5분간 안 움직였다" 이다.
      # 여기에 `for: 5m` 을 더하면 그 상태가 다시 5분 유지되어야 울려 실제 발화가 10분이 되는데,
      # 정작 description 은 5분이라고 말한다. **critical 알람에서 시계가 두 배로 어긋난다.**
      # 위 ConsumerLagGrowing 도 같은 이유로 `for` 를 뗐다 — 그쪽은 결측이 시계를 리셋해서
      # **아예 울리지 않았다**(D-031). 두 규칙 모두 지속 조건을 창 안에 넣어 표현한다.
      # 랙 지표가 얼마나 자주 빠지는가 -- **알람이 기대는 시계열 자체를 감시한다.**
      #
      # D-031 이 여기서 나왔다. up 은 내내 1인데 랙 표본만 5.3% 가 없었고, `for` 가 그 결측을
      # 거짓으로 읽어 10분 시계를 계속 되돌렸다. 규칙은 min_over_time 으로 고쳤지만
      # **결측률이 더 오르면 창 안에 표본이 아예 없어 무응답이 된다** -- 그때는 위 두 규칙이
      # 조용해지고, 조용한 것은 정상과 모습이 같다.
      #
      # 분모가 `sum_over_time(up)` 인 것은 **성공한 스크레이프만** 세기 위해서다.
      # count_over_time 을 쓰면 실패한 스크레이프까지 분모에 들어가 익스포터가 죽었을 때도
      # 울리는데, 그건 ServiceDown 의 일이다. 익스포터가 완전히 죽으면 랙 시계열이 아예 없어
      # 이 식은 결과를 내지 않는다 -- 한 사건에 두 알람이 겹치지 않는다.
      #
      # **임계를 정하다가 알게 된 것** -- 결측률이 그룹마다 다르다. 같은 10분 창에서
      # license/payment.v1 은 0.967 인데 order/payment.v1 은 **0.750** 이었다(6개 시리즈, 0.75~0.98).
      # 처음에 0.75 로 잡았더니 즉시 발화했다. license 하나만 보고 정한 값이었다.
      #
      # 그래서 0.5 로 낮춘다. 근거는 "언제 지표가 못 쓰게 되는가" 가 아니다 --
      # 10분 창에 60번 긁으므로 90% 를 잃어도 표본 6개가 남아 min_over_time 은 돈다.
      # 근거는 **"관측된 정상 범위(0.75~0.98)에서 명백히 벗어나는 지점"** 이고,
      # 절반이 사라지는 것은 익스포터 동작이 달라졌다는 뜻이다.
      #
      # 원인은 익스포터 쪽이라 우리가 고칠 수 없다. **고치는 대신 나빠지는 것을 본다.**
      - alert: ConsumerLagMetricGaps
        expr: >-
          count_over_time(kafka_consumergroup_lag_sum[10m])
          / scalar(sum_over_time(up{job="kafka-exporter"}[10m])) < 0.5
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.consumergroup }}: 랙 지표 표본이 절반 넘게 빠지고 있다"
          description: >-
            보존율 {{ $value }}. 스크레이프는 성공하는데 익스포터가 이 그룹만 빼고 응답하는 상태다.
            더 나빠지면 ConsumerLagGrowing·ConsumerStalled 가 판정할 표본을 잃는다(D-031).

      - alert: ConsumerStalled
        expr: >-
          kafka_consumergroup_lag_sum > 0
          and delta(kafka_consumergroup_current_offset_sum[5m]) == 0
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.consumergroup }}: {{ $labels.topic }} 소비가 멈췄다"
          description: >-
            미소비 {{ $value }}건이 남았는데 커밋 오프셋이 5분간 움직이지 않았다.
            리스너 예외(spring_kafka_listener_seconds_count{error!="none"})와 DLT 를 본다.

  # Store 사본이 틀어졌는데 자동 복구가 멈춘 것을 사람에게 알리는 규칙.
  #
  # Store 는 Catalog 정본의 사본이다. 정상이면 Kafka 로 반영되고, 어긋나면 주기 대조(기본 1분)가
  # 스스로 교정한다. **멈춘 대조는 정상과 모습이 같다** -- 손님은 틀린 가격·노출을 계속 본다.
  # 지표 출처는 코드다(apps/store 의 StoreSynchronizationMetrics).
  #
  # 경보 임계값은 대조 주기 1분을 기준으로 정했다. 마지막 대조 성공 시각만으로 상품별 갱신 지연을
  # 보장하지 않으므로, 상품 지연이 아니라 **대조 자체가 도는가**를 본다.
  - name: stove-store-sync
    rules:
      # 시작이 안 끝난다. 정상이면 시작 직후 한 번 전체 대조가 끝나 ready=1 이 된다.
      # Catalog 일시 장애로 한두 회차 재시도하는 것은 정상이므로 10분을 본다 --
      # OutboxBacklogGrowing 의 warning 과 같은 결이다. 복구되면 ready=1 로 자동 해제된다.
      - alert: StoreSyncInitStalled
        expr: stove_store_sync_ready == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.application }}: Store 초기 동기화가 10분째 끝나지 않았다"
          description: >-
            ready 가 0 이다. Store 는 아직 조회를 열지 못했다(503).
            Catalog 접근과 stove.store.sync.runs{result="failure"} 를 본다.

      # 대조가 계속 실패한다. 성공 주기가 1분이므로 성공 시각이 5분 멈추면 약 5회차 연속 실패다.
      # 한두 번 실패는 일시 장애로 정상이고, 성공 한 번에 시각이 갱신돼 자동 해제된다.
      #
      # last.success.timestamp > 0 을 함께 보는 이유 -- 아직 한 번도 성공 못 한 시작 직후에는
      # 이 값이 0 이라 time() 과의 차가 거대해진다. 그 구간은 StoreSyncInitStalled 가 보므로
      # 여기서는 "한 번은 성공했는데 그 뒤 5분 끊긴" 상태만 본다.
      #
      # for 를 두지 않는다. 지속 조건(5분 끊김)이 이미 식 안에 있다 -- ConsumerStalled 와 같은 이유다.
      - alert: StoreSyncReconcileFailing
        expr: >-
          stove_store_sync_last_success_timestamp > 0
          and time() - stove_store_sync_last_success_timestamp > 300
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.application }}: Store 사본 대조가 5분째 성공하지 못했다"
          description: >-
            마지막 성공 뒤 {{ $value }}초가 지났다. 사본이 정본과 어긋난 채 손님에게 보일 수 있다.
            Catalog 정본 조회와 개별 상품 계약/식별 오류 로그를 본다.
