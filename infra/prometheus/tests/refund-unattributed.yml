rule_files:
  - ../alerts.yml

evaluation_interval: 1m

# 결정 127: 귀속 미확정 미종결 환불은 > 0이면 for 없이 바로 warning으로 울리고, 종결되면 해제된다.
# 같은 시각 미확정 지연 게이지가 0이면 RefundConfirmationsDelayed는 울리지 않아 두 경보의 대상이 겹치지 않음을 함께 확인한다.
tests:
  - interval: 1m
    input_series:
      - series: 'stove_payment_refund_unattributed_open{application="payment",instance="payment:8083"}'
        values: '0 1 1 0'
      - series: 'stove_payment_refund_confirmation_delayed{application="payment",instance="payment:8083"}'
        values: '0 0 0 0'
    alert_rule_test:
      - eval_time: 0m
        alertname: RefundsUnattributed
        exp_alerts: []
      - eval_time: 1m
        alertname: RefundsUnattributed
        exp_alerts:
          - exp_labels:
              application: payment
              instance: payment:8083
              severity: warning
            exp_annotations:
              summary: "payment: 귀속 미확정 환불 종결 필요"
              description: >-
                1건이 PG 전액 취소로 환불됐지만 우리 시도의 취소인지 판정되지 않았다.
                GET /api/v1/admin/refund-delays?kind=UNATTRIBUTED에서 대상을 찾고,
                POST /api/v1/admin/refund-delays/{attemptId}/closure로 PG 재조회 근거와 귀속 판정을 남겨 종결한다.
                알려진 과거 건은 Alertmanager silence로 알림을 관리한다.
      - eval_time: 1m
        alertname: RefundConfirmationsDelayed
        exp_alerts: []
      - eval_time: 3m
        alertname: RefundsUnattributed
        exp_alerts: []
