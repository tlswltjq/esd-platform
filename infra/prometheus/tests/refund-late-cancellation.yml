rule_files:
  - ../alerts.yml

evaluation_interval: 1m

# 결정 128: 실패로 끝난 환불의 늦은 전액 취소는 > 0이면 for 없이 바로 warning으로 울린다.
# 같은 시각 귀속 미확정·미확정 지연 게이지가 0이면 두 경보는 울리지 않아 대상이 겹치지 않음을 함께 확인한다.
tests:
  - interval: 1m
    input_series:
      - series: 'stove_payment_refund_failed_late_cancellation{application="payment",instance="payment:8083"}'
        values: '0 1 1 0'
      - series: 'stove_payment_refund_unattributed_open{application="payment",instance="payment:8083"}'
        values: '0 0 0 0'
      - series: 'stove_payment_refund_confirmation_delayed{application="payment",instance="payment:8083"}'
        values: '0 0 0 0'
    alert_rule_test:
      - eval_time: 0m
        alertname: RefundCancelledAfterFailure
        exp_alerts: []
      - eval_time: 1m
        alertname: RefundCancelledAfterFailure
        exp_alerts:
          - exp_labels:
              application: payment
              instance: payment:8083
              severity: warning
            exp_annotations:
              summary: "payment: 실패로 끝난 환불의 늦은 전액 취소"
              description: >-
                1건이 환불 실패(보유권 복구) 뒤 PG에서 전액 취소로 확인됐다.
                GET /api/v1/admin/refund-delays?kind=LATE_CANCELLATION에서 대상을 찾아 PortOne 콘솔의 취소 내역을 조사한다.
                시스템은 보유권·환불 상태를 자동으로 바꾸지 않는다.
      - eval_time: 1m
        alertname: RefundsUnattributed
        exp_alerts: []
      - eval_time: 1m
        alertname: RefundConfirmationsDelayed
        exp_alerts: []
      - eval_time: 3m
        alertname: RefundCancelledAfterFailure
        exp_alerts: []
