springBootVersion=3.5.6
springCloudVersion=2025.0.0
awsSdkVersion=2.50.2

# 스프링 부트 BOM 에 없어 직접 고정한다.
# 3.x 는 부트 4 를 겨냥하므로 부트 3.5 에서는 2.8.x 가 맞는 줄이다.
springdocVersion=2.8.17

# Spring Boot BOM 이 물고 오는 버전보다 앞서 나간다.
# Testcontainers 1.21.3 은 Docker API 1.32 로 핑을 보내는데 Docker 29 가 1.40 미만을 끊었다:
#   "client version 1.32 is too old. Minimum supported API version is 1.40"
testcontainersVersion=1.21.4

org.gradle.parallel=true
org.gradle.caching=true

# 워커 수는 이제 컨테이너와 무관하다.
#
# 예전에는 이 값이 두 가지를 동시에 정했다 — 컴파일·단위 테스트의 병렬도와,
# 동시에 뜨는 인프라 컨테이너 스택 수. 후자 때문에 2 로 눌러야 했고,
# 그 대가로 컨테이너가 필요 없는 816개 테스트까지 같이 느려졌다.
#
# 컨테이너 스택은 integrationTest 태스크만 띄우고, 그 동시 실행 수는
# 루트 build.gradle 의 InfraTestThrottle 이 따로 센다. 그래서 이 값은
# CPU·힙 기준으로만 정하면 된다.
org.gradle.workers.max=4
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# 동시에 뜨는 인프라 컨테이너 스택 수. 코어가 아니라 Docker 에 준 메모리가 한계선이다.
# 머신이 넉넉하면 -Pstove.infraTest.maxParallel=N 으로 덮는다.
stove.infraTest.maxParallel=2
