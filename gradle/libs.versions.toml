# 의존성·플러그인 버전의 정본(결정 version-catalog).
# 여기에 없는 라이브러리 버전은 Spring Boot·Spring Cloud·AWS SDK BOM 이 정한다.
# settings 플러그인(foojay 리졸버)은 카탈로그를 읽을 수 없어 settings.gradle 에 둔다.

[versions]
spring-boot = "3.5.6"
spring-cloud = "2025.0.0"
aws-sdk = "2.50.2"

# 스프링 부트 BOM 에 없어 직접 고정한다.
# 3.x 는 부트 4 를 겨냥하므로 부트 3.5 에서는 2.8.x 가 맞는 줄이다.
springdoc = "2.8.17"

# Spring Boot BOM 이 물고 오는 버전보다 앞서 나간다.
# Testcontainers 1.21.3 은 Docker API 1.32 로 핑을 보내는데 Docker 29 가 1.40 미만을 끊었다:
#   "client version 1.32 is too old. Minimum supported API version is 1.40"
testcontainers = "1.21.4"

archunit = "1.3.0"
# micrometer-core 가 끌어오는 값과 같게 둔다(Boot BOM 이 관리하지 않는다).
hdrhistogram = "2.2.2"

dependency-management-plugin = "1.1.7"
jib-plugin = "3.5.4"
pitest-plugin = "1.15.0"
pitest-junit5-plugin = "1.2.1"

[libraries]
springdoc-common = { module = "org.springdoc:springdoc-openapi-starter-common", version.ref = "springdoc" }
springdoc-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
springdoc-webflux-ui = { module = "org.springdoc:springdoc-openapi-starter-webflux-ui", version.ref = "springdoc" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
hdrhistogram = { module = "org.hdrhistogram:HdrHistogram", version.ref = "hdrhistogram" }

# build-logic 의 convention plugin 이 적용하는 Gradle 플러그인(결정 build-logic-convention-plugins).
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
dependency-management-gradle-plugin = { module = "io.spring.gradle:dependency-management-plugin", version.ref = "dependency-management-plugin" }
jib-gradle-plugin = { module = "com.google.cloud.tools:jib-gradle-plugin", version.ref = "jib-plugin" }
pitest-gradle-plugin = { module = "info.solidsoft.gradle.pitest:gradle-pitest-plugin", version.ref = "pitest-plugin" }
