# Host access and browser URLs for local development and E2E.
# Use with docker-compose.apps.yml; the default stack publishes no ports.
services:
  gateway:
    ports: ["127.0.0.1:18080:8080"]
    environment:
      BFF_PUBLIC_AUTH_BASE: http://127.0.0.1:18080
  auth:
    ports: ["127.0.0.1:18091:8091"]
    environment:
      BFF_REDIRECT_URI: http://127.0.0.1:18080/login/oauth2/code/gateway-bff
  catalog:
    ports: ["127.0.0.1:18081:8081"]
  order:
    ports: ["127.0.0.1:18082:8082"]
  payment:
    ports: ["127.0.0.1:18083:8083"]
  license:
    ports: ["127.0.0.1:18084:8084"]
  studio:
    ports: ["127.0.0.1:18085:8085"]
    environment:
      STUDIO_ASSET_PUBLIC_BASE_URL: http://127.0.0.1:18080
      STORAGE_PRESIGN_ENDPOINT: http://127.0.0.1:19000
      STOVE_DOCS_OAUTH_AUTHORIZATION_URL: /oauth2/authorize
      STOVE_DOCS_OAUTH_TOKEN_URL: /oauth2/token
  review:
    ports: ["127.0.0.1:18086:8086"]
    environment:
      STOVE_DOCS_OAUTH_AUTHORIZATION_URL: /oauth2/authorize
      STOVE_DOCS_OAUTH_TOKEN_URL: /oauth2/token
  store:
    ports: ["127.0.0.1:18087:8087"]
  download:
    ports: ["127.0.0.1:18088:8088"]
    environment:
      STORAGE_PRESIGN_ENDPOINT: http://127.0.0.1:19000
  settlement:
    ports: ["127.0.0.1:18089:8089"]
