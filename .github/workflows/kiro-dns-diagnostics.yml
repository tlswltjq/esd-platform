name: Temporary Kiro DNS path diagnostics
on:
  push:
    branches: ["codex/kiro-funnel-diagnostics-20261114"]
    paths: [".github/workflows/kiro-dns-diagnostics.yml"]
permissions: {}
jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 3
    steps:
      - name: Compare private and public routes without changes
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "oci-ampere-a1"
          test "$(hostname -s)" = "host-10-0-0-56"
          python3 - <<'PY'
          import subprocess,json,urllib.request,urllib.error,urllib.parse,datetime,concurrent.futures,socket,ssl,http.client,ipaddress
          assert datetime.datetime.now(datetime.timezone.utc)<datetime.datetime(2026,11,14,8,30,tzinfo=datetime.timezone.utc)
          domain="host-10-0-0-56.tail21684f.ts.net"
          print("TIME",datetime.datetime.now(datetime.timezone.utc).isoformat())
          print("HOST_DNS",sorted({x[4][0] for x in socket.getaddrinfo(domain,443,type=socket.SOCK_STREAM)}))
          p=subprocess.run(["tailscale","status","--json"],stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,timeout=10)
          if p.returncode==0:
              data=json.loads(p.stdout)
              phones=[v for v in (data.get("Peer") or {}).values() if v.get("OS","").lower() in ("ios","android")]
              print("MOBILE_PEERS",json.dumps([{k:v.get(k) for k in ("HostName","OS","Online","TailscaleIPs","LastSeen")} for v in phones],ensure_ascii=False))
              for phone in phones[:3]:
                  ips=phone.get("TailscaleIPs") or []
                  if ips and phone.get("Online"):
                      ping=subprocess.run(["tailscale","ping","--c=1","--timeout=5s","--until-direct=false",ips[0]],stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,timeout=8)
                      print("MOBILE_PING",json.dumps({"host":phone.get("HostName"),"code":ping.returncode,"result":ping.stdout.strip()[:250],"error":ping.stderr.strip()[:150]},ensure_ascii=False))
          answers=[]
          try:
              dns_url="https://cloudflare-dns.com/dns-query?"+urllib.parse.urlencode({"name":domain,"type":"A"})
              request=urllib.request.Request(dns_url,headers={"Accept":"application/dns-json"})
              with urllib.request.urlopen(request,timeout=10) as r:
                  dns=json.load(r)
              print("PUBLIC_DNS",json.dumps({"Status":dns.get("Status"),"Answer":dns.get("Answer")}))
              answers=[v["data"] for v in dns.get("Answer",[]) if v.get("type")==1]
          except Exception as e:
              print("PUBLIC_DNS_ERROR",type(e).__name__,str(e)[:180])
          class DestinationHTTPS(http.client.HTTPSConnection):
              def __init__(self,host,port,ip):
                  super().__init__(host,port,timeout=10,context=ssl.create_default_context())
                  self.destination=ip
              def connect(self):
                  self.sock=self._context.wrap_socket(socket.create_connection((self.destination,self.port),self.timeout),server_hostname=self.host)
          def test_public(port):
              ip=answers[0]
              assert ipaddress.ip_address(ip).is_global
              c=DestinationHTTPS(domain,port,ip)
              try:
                  c.request("GET","/index.html" if port==8443 else "/")
                  r=c.getresponse()
                  r.read(100)
                  return {"port":port,"resolved_ip":ip,"status":r.status}
              except Exception as e:
                  return {"port":port,"resolved_ip":ip,"error":type(e).__name__,"detail":str(e)[:180]}
              finally:
                  c.close()
          if answers:
              with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
                  for result in pool.map(test_public,(443,8443)):
                      print("PUBLIC_ROUTE",json.dumps(result))
          for path in ("/api/health","/api/status"):
              try:
                  with urllib.request.urlopen("https://"+domain+path,timeout=10) as r:
                      print("CREW_API",path,r.status)
              except urllib.error.HTTPError as e:
                  print("CREW_API",path,e.code)
              except Exception as e:
                  print("CREW_API",path,type(e).__name__,str(e)[:150])
          PY
          
