name: Temporary Kiro Funnel diagnostics
on:
  push:
    branches: ["codex/kiro-funnel-diagnostics-20261114"]
    paths: [".github/workflows/kiro-funnel-diagnostics.yml"]
permissions: {}
jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 3
    steps:
      - name: Inspect Crew and demo routing without changes
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "oci-ampere-a1"
          test "$(hostname -s)" = "host-10-0-0-56"
          python3 - <<'PY'
          import subprocess,json,urllib.request,urllib.error,urllib.parse,datetime,concurrent.futures,re,socket
          now=datetime.datetime.now(datetime.timezone.utc)
          assert now < datetime.datetime(2026,11,14,8,30,tzinfo=datetime.timezone.utc), "Diagnostic request expired"
          print("TIME",now.isoformat())
          print("HOST",socket.gethostname())
          domain="host-10-0-0-56.tail21684f.ts.net"
          def safe_url(text):
              try:
                  p=urllib.parse.urlsplit(text)
                  host=p.hostname or ""
                  if ":" in host: host="["+host+"]"
                  if p.port: host+=":"+str(p.port)
                  return urllib.parse.urlunsplit((p.scheme,host,p.path,"",""))
              except Exception:
                  return "[unparseable URL]"
          def run(args):
              p=subprocess.run(args,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,timeout=15)
              if p.returncode:
                  print("COMMAND_ERROR",args[0:3],p.returncode,p.stderr.strip()[:200])
              return p
          ts=run(["tailscale","status","--json"])
          if ts.returncode==0:
              data=json.loads(ts.stdout); node=data.get("Self") or {}
              print("TAILSCALE",json.dumps({"BackendState":data.get("BackendState"),"Health":data.get("Health"),"Self":{k:node.get(k) for k in ("HostName","DNSName","TailscaleIPs","Online")}},ensure_ascii=False))
          targets={}
          for kind in ("serve","funnel"):
              p=run(["tailscale",kind,"status","--json"])
              if p.returncode==0:
                  try:
                      data=json.loads(p.stdout)
                      web={}
                      for host,item in (data.get("Web") or {}).items():
                          handlers={}
                          for path,handler in (item.get("Handlers") or {}).items():
                              row={}
                              for key in ("Proxy","Path","Text"):
                                  if key in handler:
                                      row[key]=safe_url(handler[key]) if key=="Proxy" else ("[text configured]" if key=="Text" else handler[key])
                              handlers[path]=row
                              if handler.get("Proxy"):
                                  target=urllib.parse.urlsplit(handler["Proxy"])
                                  if target.scheme in ("http","https") and target.hostname in ("127.0.0.1","localhost","::1"):
                                      targets[host+path]=handler["Proxy"]
                          web[host]={"Handlers":handlers}
                      print(kind.upper()+"_CONFIG",json.dumps({"TCP":data.get("TCP"),"Web":web,"AllowFunnel":data.get("AllowFunnel")},ensure_ascii=False))
                  except (ValueError,TypeError) as e:
                      print(kind.upper()+"_CONFIG_PARSE_ERROR",type(e).__name__)
          for unit in ("kirocrew.service","tailscaled.service"):
              p=run(["systemctl","show",unit,"--property=ActiveState,SubState,User,MainPID,NRestarts,ExecMainStartTimestamp,ExecMainStatus,Result"])
              print("SERVICE",unit,p.stdout.strip().replace("\n","; "))
          p=run(["ss","-lnt"])
          print("LISTENERS\n"+p.stdout)
          checks=[
          ("crew-local-health","http://127.0.0.1:5476/api/health",None),
          ("crew-local-root","http://127.0.0.1:5476/",None),
          ("crew-tailnet-host","http://127.0.0.1:5476/",domain),
          ("crew-tailnet-https","https://"+domain+"/",None),
          ("demo-tailnet-https","https://"+domain+":8443/index.html",None),
          ]
          for name,target in targets.items():
              checks.append(("proxy-target-"+name,target,None))
          def check(entry):
              name,url,host=entry
              req=urllib.request.Request(url,headers={"Host":host} if host else {})
              try:
                  with urllib.request.urlopen(req,timeout=12) as r:
                      body=r.read(30000).decode("utf-8",errors="replace")
                      title=re.search(r"<title[^>]*>(.*?)</title>",body,re.I|re.S)
                      return {"check":name,"url":safe_url(url),"status":r.status,"type":r.headers.get("Content-Type"),"title":re.sub(r"\s+"," ",title.group(1)).strip()[:120] if title else None,"final_url":safe_url(r.url)}
              except urllib.error.HTTPError as e:
                  body=e.read(500).decode(errors="replace")
                  known=next((x for x in ("Host header not allowed","Token required","Session expired","Unauthorized","Bad Gateway") if x.lower() in body.lower()),None)
                  return {"check":name,"url":safe_url(url),"status":e.code,"known_error":known}
              except Exception as e:
                  return {"check":name,"url":safe_url(url),"error":type(e).__name__,"detail":str(e)[:180]}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              for result in pool.map(check,checks):
                  print("HTTP",json.dumps(result,ensure_ascii=False))
          PY
          
