name: Temporary Kiro service inspection
on:
  push:
    branches: ["codex/kiro-mobile-repair-20261105"]
    paths: [".github/workflows/kiro-mobile-service.yml"]
permissions: {}
jobs:
  inspect-service:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 3
    steps:
      - name: Inspect the target service without credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "oci-ampere-a1"
          test "$(hostname -s)" = "host-10-0-0-56"
          printf '[Sudo availability] '
          if sudo -n true 2>/dev/null; then printf 'yes\n'; else printf 'no\n'; fi
          python3 - <<'PY'
          import subprocess,re,json
          text=subprocess.check_output(['systemctl','show','kirocrew.service','--property=User,Group,ExecStart,WorkingDirectory,MainPID,EnvironmentFiles'],text=True)
          data=dict(line.split('=',1) for line in text.splitlines() if '=' in line)
          value=data.pop('ExecStart','')
          m=re.search(r'path=([^ ;]+)',value)
          data['Executable']=m.group(1) if m else 'unresolved'
          print(json.dumps(data,indent=2))
          PY
          printf '\n[Local health and host guard]\n'
          for path in /api/health /; do
            curl --silent --show-error --max-time 10 --output /dev/null --write-out "$path HTTP %{http_code}\n" -H 'Host: host-10-0-0-56.tail21684f.ts.net' "http://127.0.0.1:5476$path"
          done
          
