name: Temporary Kiro TLS diagnostics
on:
  push:
    branches: ["codex/kiro-funnel-diagnostics-20261114"]
    paths: [".github/workflows/kiro-tls-diagnostics.yml"]
permissions: {}
jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 3
    steps:
      - name: Verify TLS and Safari asset responses
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "oci-ampere-a1"
          test "$(hostname -s)" = "host-10-0-0-56"
          python3 - <<'PY'
          import socket,ssl,urllib.request,urllib.parse,html.parser,json,concurrent.futures,datetime
          assert datetime.datetime.now(datetime.timezone.utc)<datetime.datetime(2026,11,14,9,0,tzinfo=datetime.timezone.utc),"Expired diagnostic"
          host="host-10-0-0-56.tail21684f.ts.net"
          print("TIME",datetime.datetime.now(datetime.timezone.utc).isoformat())
          for version in (ssl.TLSVersion.TLSv1_2,ssl.TLSVersion.TLSv1_3):
              ctx=ssl.create_default_context()
              ctx.minimum_version=version; ctx.maximum_version=version
              with socket.create_connection(("100.119.167.32",443),timeout=10) as sock:
                  with ctx.wrap_socket(sock,server_hostname=host) as secure:
                      cert=secure.getpeercert()
                      print("TLS",json.dumps({"version":secure.version(),"cipher":secure.cipher()[0],"notBefore":cert.get("notBefore"),"notAfter":cert.get("notAfter"),"SAN":cert.get("subjectAltName")}))
          base="https://"+host+"/"
          ua="Mozilla/5.0 (iPhone; CPU iPhone OS 27_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/27.0 Mobile/15E148 Safari/604.1"
          with urllib.request.urlopen(urllib.request.Request(base,headers={"User-Agent":ua,"Cache-Control":"no-cache"}),timeout=10) as r:
              root=r.read().decode()
              print("ROOT",r.status,"bytes",len(root))
          class Assets(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__(); self.urls=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=="script" and a.get("src"): self.urls.append(a["src"])
                  if tag=="link" and a.get("rel") in ("stylesheet","modulepreload") and a.get("href"): self.urls.append(a["href"])
          a=Assets();a.feed(root)
          def check(path):
              url=urllib.parse.urljoin(base,path)
              assert urllib.parse.urlsplit(url).hostname==host
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":ua,"Cache-Control":"no-cache"}),timeout=10) as r:
                      sample=r.read(100)
                      return {"path":path,"status":r.status,"type":r.headers.get("Content-Type"),"html_fallback":b"<html" in sample.lower()}
              except Exception as e:
                  return {"path":path,"error":type(e).__name__,"detail":str(e)[:120]}
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              for result in pool.map(check,a.urls[:8]): print("ASSET",json.dumps(result))
          with urllib.request.urlopen(urllib.request.Request(base+"api/health",headers={"User-Agent":ua,"Cache-Control":"no-cache"}),timeout=10) as r:
              print("HEALTH",r.status,"type",r.headers.get("Content-Type"))
          PY
          
