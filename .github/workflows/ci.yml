# 결정 101: GitHub 호스팅 러너로 검증한다. 공개 저장소이므로 self-hosted 러너를 쓰지 않는다.
# - PR·main push: 결정 번호·식별자와 기준 판 보존 검사를 먼저 돌린 뒤 단위·아키텍처·통합(Testcontainers)·과거 이행 = ./gradlew build
#   결정 207: PR은 바뀐 범위만 빌드한다(tools/ci/build_scope.py). main push는 항상 전체.
#   결정 217: 전체 빌드는 통합·이행 테스트를 여러 러너로 나눠 동시에 돌리고(tools/ci/build_shards.py), build가 결과를 모은다.
# - 밤마다·수동: 실제 앱 스택 E2E + 로컬 fake-PortOne 환불·정산 여정과 승인 보류 종결·실패 시도 재결제·30분 안 재진입 여정,
#   주문 기한(30분)을 넘기는 승인 여정(31분 대기, 별도 작업) (실제 PortOne·비밀 값 없음)
# 실제 PortOne 결제·환불은 CI에서 돌리지 않는다(사람 승인 뒤 손으로 실행). 비밀 값을 쓰지 않는다.
# 결정 107: main 규칙셋이 build 작업의 name을 필수 검사로 쓴다. name을 바꾸거나 pull_request에
# paths 조건을 달면 필수 검사가 보고되지 않아 PR이 병합 대기에서 풀리지 않는다. 바꿀 때는 규칙셋도 함께 고친다.
# 결정 build-on-draft: 착수 표시용 draft PR에서도 push마다 build를 돌린다. job if로 건너뛴 작업은 필수 검사에서
# 성공으로 보고되므로 PR에서 build를 건너뛰는 조건을 두지 않는다. ready는 build를 다시 돌리지 않는다(같은 head의 결과).
# tools/ci/test_workflows.py가 조건식·이벤트 목록·concurrency 그룹을 지킨다.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    - cron: "0 18 * * *"   # 매일 03:00 KST
  workflow_dispatch:
    inputs:
      stack:
        description: "실제 앱 스택 E2E와 로컬 fake-PortOne 환불·정산 여정 실행"
        type: boolean
        default: true

permissions:
  contents: read

# PR #232 R5: 밤·수동 스택 실행(최대 약 1시간)이 main push 검증을 기다리게 하거나, 대기 중 다음 push에 밀려 사라지지 않게 나눈다.
concurrency:
  group: ci-${{ github.ref }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'stack' || 'build' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 결정 217: build를 세 단계로 나눈다. plan(범위·번호·도구 테스트) → gradle(조각별 러너, matrix) → build(결과 모음).
  # 필수 검사 이름은 결과를 모으는 build 작업이 이어받는다(결정 107). plan·gradle 이름은 `build`로 시작하지 않는다
  # (tools/ci/pr_finish.py가 `build` 접두로 필수 검사를 찾는다).
  plan:
    name: plan (scope · decision numbers · tool tests)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      gradle: ${{ steps.shards.outputs.gradle }}
      matrix: ${{ steps.shards.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # PR #233 R7: 번호 오류를 빌드 전에 알린다. 이 단계가 실패하면 뒤 단계는 기본 조건(success())이라 건너뛰고,
      # plan이 실패하므로 gradle도 돌지 않는다. 번호를 고쳐 다시 push하면 처음부터 다시 돈다.
      - name: Check decision numbers
        if: ${{ !cancelled() }}
        run: python3 -I -B tools/ci/decision_numbers.py --root . --base-ref HEAD^1
      # 결정 207: PR은 바뀐 범위만 빌드한다(문서만 → Gradle 생략, 한 앱 안만 → 그 앱, 그 밖 → 전체).
      # 결정 216: Gradle이 읽지 않는다고 확인한 도구 경로(build_scope.py의 허용 목록)만 바뀌어도 Gradle을 생략한다.
      # main push는 항상 전체.
      - name: Build scope
        id: scope
        run: python3 -I -B tools/ci/build_scope.py --event "${{ github.event_name }}" --base HEAD^1 >> "$GITHUB_OUTPUT"
      # 결정 217: 전체 빌드는 통합·이행 테스트를 조각으로 나눈다. 앱 범위 빌드는 한 조각, 빈 범위는 Gradle 없음.
      - name: Build shards
        id: shards
        run: python3 -I -B tools/ci/build_shards.py --tasks "${{ steps.scope.outputs.tasks }}" >> "$GITHUB_OUTPUT"
      # 결정 216: 검증·측정 도구의 Python 테스트는 Gradle 범위와 무관하게 늘 돈다(약 15초). Java가 필요 없다.
      # 이 경로만 바뀐 PR은 Gradle을 생략하므로(build_scope.py) 여기가 그 변경을 검증하는 유일한 곳이다.
      # tools/ci 테스트는 review-gate가 돌린다. Docker 장애는 통합 테스트에서 드러나므로 버전 출력 단계는 두지 않는다.
      - name: Python tool tests
        run: |
          python3 -B -m unittest discover -s tools/verification -p 'test_*.py'
          python3 -B -m unittest discover -s tools/measurement -p 'test_*.py'

  gradle:
    name: gradle (${{ matrix.shard }})
    needs: plan
    if: needs.plan.outputs.gradle == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # 한 조각이 실패해도 나머지를 끝까지 돌려 실패를 한 번에 본다(--continue와 같은 뜻).
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Build
        run: ./gradlew ${{ matrix.tasks }} --continue --console=plain
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.shard }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7

  # 결정 217·137: 건너뛴 작업은 필수 검사에서 성공으로 보고된다. 그래서 이 작업은 always()로 늘 돌아, plan이 성공하지
  # 않았거나 Gradle을 돌려야 하는데 조각 하나라도 성공하지 않았으면(실패·취소·건너뜀·없음) 실패한다.
  # PR #234 R1: matrix의 합친 결과(needs.gradle.result)는 부분 재실행·러너 미배정 취소에서 success로 보고된 사례가 있어
  # 쓰지 않는다. 이 실행의 작업 목록(filter=latest)에서 조각마다의 최신 결론을 tools/ci/shard_results.py로 본다.
  build:
    name: build (unit · architecture · integration · migration)
    needs: [plan, gradle]
    if: always() && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: tools/ci
      - name: Gather results
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          PLAN: ${{ needs.plan.result }}
          RUN_GRADLE: ${{ needs.plan.outputs.gradle }}
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs?filter=latest&per_page=100" --jq '.jobs[] | [.name, (.conclusion // .status)] | @tsv' > "$RUNNER_TEMP/jobs.tsv"
          python3 -I -B tools/ci/shard_results.py --plan "$PLAN" --gradle "$RUN_GRADLE" --matrix "$MATRIX" --jobs "$RUNNER_TEMP/jobs.tsv"

  stack:
    name: stack E2E (verify-jib.py)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.stack)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stack E2E
        run: python3 -B tools/verification/verify-jib.py
      - name: Upload run logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stack-run
          path: runs/
          retention-days: 7

  refund-settlement:
    name: fake PortOne refund settlement
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.stack)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare cached local dependencies
        run: |
          docker pull mysql:8.0
          docker pull redis:7-alpine
          docker pull apache/kafka:3.9.0
      - name: Refund settlement journey
        run: python3 -B tools/verification/verify-refund-settlement.py
      # 결정 119·120: 흉내 서버를 넓힌 G1 종료 여정과 30분 안 이탈/재진입 조합. 앞 여정이 실패해도 따로 돌린다.
      - name: Approval hold closure, failed-attempt retry and re-entry journeys
        if: success() || failure()
        run: python3 -B tools/verification/verify-approval-journeys.py
      - name: Upload run logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: refund-settlement-run
          path: runs/
          retention-days: 7

  # 결정 120: 주문 기한을 넘는 승인 조합. 주문을 함께 만들고 31분을 한 번 기다린다. PR CI에는 넣지 않는다.
  approval-expiry:
    name: fake PortOne approval expiry (31 min)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.stack)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare cached local dependencies
        run: |
          docker pull mysql:8.0
          docker pull redis:7-alpine
          docker pull apache/kafka:3.9.0
      - name: Approval expiry journey
        run: python3 -B tools/verification/verify-expiry-journeys.py
      - name: Upload run logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: approval-expiry-run
          path: runs/
          retention-days: 7
