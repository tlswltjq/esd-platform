name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # OCI Ampere A1 (4코어 / 23GB / aarch64). ubuntu-latest(2코어 / 7GB)로는
    # Testcontainers 스택을 병렬로 못 띄운다 — 워커 수를 올릴 수 있는 것이 이 러너의 이유다.
    #
    # 러너는 전용 사용자(runner)로 돌고 systemd 드롭인이 MemoryMax 를 건다.
    # 상한을 CI 쪽에 걸어야 사고가 CI 안에서 끝난다.
    runs-on: [self-hosted, Linux, ARM64]

    steps:
      - uses: actions/checkout@v4

      # JDK 21(Temurin, arm64)은 호스트에 설치되어 있다. setup-java 는 매 잡마다
      # 같은 것을 다시 조달할 뿐이므로 두지 않는다.
      - name: Show toolchain
        run: |
          java -version
          docker version --format 'docker {{.Server.Version}}'

      # self-hosted 는 ~/.gradle 이 잡 사이에 그대로 남는다. GitHub 캐시로
      # 왕복시키는 것은 순수 낭비다.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      # 단위 816건(test) + 실 인프라 통합 175건(integrationTest). build 가 둘 다 돈다.
      #
      # 워커 수와 힙은 러너의 ~/.gradle/gradle.properties 가 정한다(4 / 6g).
      # 리포의 gradle.properties(4 / 2g)는 Docker 3.83GB 랩탑의 값이고 그대로 둔다 —
      # 머신별 값은 머신에.
      #
      # 워커 수를 올려도 컨테이너가 그만큼 뜨지는 않는다. 동시 스택 수는
      # stove.infraTest.maxParallel 이 따로 세고(루트 build.gradle 의 InfraTestThrottle),
      # 러너에서 덮고 싶으면 -Pstove.infraTest.maxParallel=N 을 붙인다.
      - name: Build
        run: ./gradlew build --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            apps/*/build/reports/tests/test
            common/*/build/reports/tests/test
          retention-days: 7

      # self-hosted 는 워크스페이스가 남는다. Testcontainers 가 흘린 컨테이너를
      # 잡 단위로 걷는다(이미지·레이어는 docker-prune.timer 가 날마다 정리).
      #
      # Testcontainers 는 자체 reaper(Ryuk)로 자기 컨테이너를 치우므로 이 단계는 그것과
      # 경합한다. 이미 삭제 중인 컨테이너에 docker rm 이 실패하면 xargs 가 123 을 반환해
      # **빌드가 통과했는데 잡이 빨개진다** — 실제로 그렇게 됐다:
      #   "removal of container ... is already in progress" → exit 123
      #
      # 이 단계의 목적은 검증이 아니라 위생이다. 경합으로 진 것은 실패가 아니라
      # 남이 대신 치운 것이므로 잡을 세우지 않는다. 대신 정리 뒤 남은 개수를 남긴다 —
      # 조용히 삼키면 컨테이너가 쌓여도 알 수 없다.
      - name: Reap stray test containers
        if: always()
        run: |
          docker ps -aq --filter label=org.testcontainers=true \
            | while read -r id; do docker rm -f "$id" >/dev/null 2>&1 || true; done

          remaining=$(docker ps -aq --filter label=org.testcontainers=true | wc -l | tr -d ' ')
          echo "정리 후 남은 테스트 컨테이너: ${remaining}"
          if [ "$remaining" -gt 0 ]; then
            echo "::warning::테스트 컨테이너 ${remaining}개가 남았다 — 러너에 쌓이는지 확인이 필요하다"
          fi

  # 인수 시나리오 42건. 서비스 *사이* 의 결함을 잡는 층이라 PR 단위보다 통합 시점에 의미가 있다.
  #
  # **PR 마다 돌리지 않는다.** 러너가 1대인 것이 결정적이다 — 20컨테이너 스택을 올렸다 내리는
  # 잡이 PR 수만큼 붙으면 큐가 생기고, 방어선이 인프라 경합으로 간헐 실패하기 시작하면
  # 사람들이 빨간불을 무시하는 법을 배운다. 그건 방어선이 없는 것보다 나쁘다
  # (docs/test-audit.md 4.3·4.4).
  #
  # 급할 때의 문은 둘이다 — workflow_dispatch, 그리고 PR 에 `e2e` 라벨.
  e2e:
    needs: build
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: [self-hosted, Linux, ARM64]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      # compose 의 Dockerfile 은 build/libs/*.jar 하나를 집는다. 이미지 안에서 빌드하지 않는다.
      - name: Build boot jars
        run: ./gradlew bootJar --console=plain

      # 오버라이드 순서가 의미를 가진다 — ci 가 ports 를 !reset 으로 지운 뒤에
      # e2e 가 127.0.0.1:1808X 로 다시 연다(docs/decisions.md 21번).
      - name: Start stack
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d
          docker compose -f docker-compose.apps.yml \
                         -f docker-compose.apps.ci.yml \
                         -f docker-compose.apps.e2e.yml up -d --build

      # 기다리고 판정한다. 여기서 막히면 e2e 를 돌릴 이유가 없다 — 시나리오가 실패한 것과
      # 스택이 서 있지 않은 것은 대응이 다르고, 그것을 종료 코드 2 로 가른다.
      - name: Gate
        run: bash scripts/stack-wait.sh

      - name: Acceptance
        run: ./gradlew :e2e:e2eTest --console=plain

      - name: Upload e2e report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: e2e/build/reports/tests/e2eTest
          retention-days: 7

      # **스택을 내리지 않는다.**
      #
      # 이 러너는 원격 개발 스택과 같은 호스트다(decisions.md 15번). 잡이 끝날 때마다 내리면
      # 사람이 `remote.sh` 로 쓰던 스택이 사라지고, 다시 올릴 때 Elasticsearch·Kafka 콜드 스타트를
      # 매번 문다. 20컨테이너가 상주하는 것은 이미 이 호스트의 정상 상태이고
      # 그 위에서 build 잡이 통과해 왔다 — 이 잡이 새로 만드는 부하가 아니다.
      #
      # 대신 상태를 남긴다. 실패한 채 방치된 스택을 조용히 지나치지 않기 위해서다.
      - name: Report stack state
        if: always()
        run: bash scripts/stack-wait.sh || echo "::warning::e2e 뒤 스택이 게이트를 통과하지 못한 상태로 남았다"
