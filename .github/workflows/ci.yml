name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 러너에 Docker 데몬이 있으므로 Testcontainers 기반 컨텍스트 로딩 테스트가 그대로 돈다.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 아키텍처 규칙 + 도메인 단위 테스트 + 9개 앱 컨텍스트 로딩 테스트
      - name: Build
        run: ./gradlew build --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: apps/*/build/reports/tests/test
          retention-days: 7
