name: Temporary Kiro mobile diagnostics
on:
  push:
    branches: ["codex/kiro-mobile-repair-20261105"]
    paths: [".github/workflows/kiro-mobile-diagnostics.yml"]
permissions: {}
concurrency:
  group: temporary-kiro-mobile-diagnostics
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 3
    steps:
      - name: Verify target and inspect Kiro mobile access
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "oci-ampere-a1"
          test "$(hostname -s)" = "host-10-0-0-56"
          export PATH="$HOME/.local/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
          printf '[HOST] '
          hostname
          printf '[USER] '
          id -un
          date -u
          printf '\n[Tailscale self]\n'
          tailscale status --json | python3 -c 'import json,sys; s=json.load(sys.stdin); p=s.get("Self",{}); print(json.dumps({"BackendState":s.get("BackendState"), "Self":{k:p.get(k) for k in ("HostName","DNSName","TailscaleIPs","Online")}},indent=2))'
          tailscale serve status
          printf '\n[Gateway services]\n'
          systemctl list-units --all --type=service --no-pager --no-legend | awk 'tolower($0) ~ /kiro|crew|tailscale/'
          printf '\n[Kiro command]\n'
          if command -v kirocrew; then
            kirocrew --version
            kirocrew tailnet status || true
          else
            printf 'No kirocrew on current PATH\n'
          fi
          printf '\n[TCP listeners]\n'
          ss -lnt
          printf '\n[Containers]\n'
          if command -v docker >/dev/null; then
            docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}' || true
          fi
