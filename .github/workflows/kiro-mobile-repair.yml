name: Temporary Kiro mobile access repair
on:
  push:
    branches: ["codex/kiro-mobile-repair-20261105"]
    paths: [".github/workflows/kiro-mobile-repair.yml"]
permissions: {}
jobs:
  repair:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 6
    steps:
      - name: Repair Kiro tailnet origin as its service owner
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,sys,json,base64,pathlib,subprocess,shutil,time
          os.umask(0o077)
          transport_dir=pathlib.Path("/tmp/kiro-mobile-transport.Mg2MfHKW")
          result_pub="-----BEGIN PUBLIC KEY-----\nMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAqG78fTP2h2dyQ0vT9bvq\nD7RYitd/qQiA6AZhzwpDdCJBhquqnnp63xJtEyW1BTHa+hORtem7HlJryd4Kydr3\n0aV4csbJrTwJwvf5k8ZgeNwyD4pcdFlmRaF+SD9L1z9K/MqVS5pM5d9FeqieSa/M\nLXmvxSUBLfjwuanwW1kBhxqcuOe8rrkIDTS2m34zV7dCSsCPhIoF9AUTs0AhLPwE\nBms7jXRKdr5aAZdfQmhA0LIf0iJGIYsOHNtuSRYj5LaEI1ZRn0mPcSND7vefiYog\nhDMhIheIZHZ7YliWDDA1Ln/xnxvykKSRa1YZyN10VzRo9CpzA7REkV21JzUknBqh\nMjWn0vE3LXJ0y/fqg8/lm2dzG1EJa08dHpkzcb6auF/d8sK6OBoVxCDjzhUarCCp\ne/xg1gEVjOtM+Y2jS4RTZLSp++8kQ/53jr/PXUX819fb3rHTqjUIJGBudjF3mmIp\n9GaB6i8kMInDZwG0o1NPsqjjGdIpl2f327GL+VejqOhtAgMBAAE=\n-----END PUBLIC KEY-----\n"
          chunks=["","","","","","",""]
          inner="import os,sys,time,subprocess,shutil,pathlib,urllib.request,urllib.error,json\nos.environ[\"PATH\"]=\"/home/ubuntu/.local/bin:/usr/local/bin:/usr/bin:/bin:\"+os.environ.get(\"PATH\",\"\")\ncli=\"/home/ubuntu/.local/bin/kirocrew\"\nassert pathlib.Path(cli).is_file(), \"Kiro CLI not found at service executable\"\nassert os.getuid()==__import__(\"pwd\").getpwnam(\"ubuntu\").pw_uid, \"Unexpected service user\"\npid=subprocess.check_output([\"systemctl\",\"show\",\"kirocrew.service\",\"--property=MainPID\",\"--value\"],text=True).strip()\ntry:\n    entries=pathlib.Path(\"/proc/\"+pid+\"/environ\").read_bytes().split(b\"\\0\")\n    for entry in entries:\n        k,sep,v=entry.partition(b\"=\")\n        if sep and k in (b\"KIROCREW_HOME\",b\"KIROCREW_PORT\"):\n            os.environ[k.decode()]=v.decode()\nexcept (OSError,ValueError):\n    print(\"Service environment selectors unavailable; using account defaults\")\ndef command(args,timeout=100,required=True):\n    p=subprocess.run(args,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=timeout)\n    print(\"COMMAND\",json.dumps(args),\"EXIT\",p.returncode)\n    print(p.stdout)\n    if required and p.returncode:\n        raise RuntimeError(\"Command failed: \"+args[0])\n    return p\ncommand([cli,\"--version\"])\ncommand([cli,\"tailnet\",\"status\"],required=False)\ndata_home=pathlib.Path(os.environ.get(\"KIROCREW_HOME\",str(pathlib.Path.home()/\".kiro\"/\"crew\")))\ncfg=data_home/\"config.json\"\nif cfg.is_file():\n    backup=cfg.with_name(\"config.before-mobile-repair-20261105.json\")\n    if not backup.exists():\n        shutil.copy2(cfg,backup)\n        backup.chmod(0o600)\n    print(\"Config backup saved with owner-only permissions\")\ncommand([cli,\"config\",\"set\",\"dashboard.tailscale.enabled\",\"true\"])\ncommand([cli,\"restart\"],timeout=150)\ndef http_status(url,host=None):\n    request=urllib.request.Request(url,headers={\"Host\":host} if host else {})\n    try:\n        with urllib.request.urlopen(request,timeout=8) as response:\n            return response.status\n    except urllib.error.HTTPError as exc:\n        return exc.code\n    except Exception:\n        return 0\nfor _ in range(45):\n    if http_status(\"http://127.0.0.1:5476/api/health\")==200:\n        break\n    time.sleep(1)\ndomain=\"host-10-0-0-56.tail21684f.ts.net\"\nhealth=http_status(\"http://127.0.0.1:5476/api/health\")\nlocal_host=http_status(\"http://127.0.0.1:5476/\",domain)\nhttps=http_status(\"https://\"+domain+\"/\")\nprint(\"VERIFICATION\",json.dumps({\"health\":health,\"tailnet_host_request\":local_host,\"tailnet_https\":https}))\ncommand([cli,\"tailnet\",\"status\"],required=False)\nassert health==200 and local_host==200 and https==200,\"Gateway or tailnet HTTPS verification failed\"\ncommand([cli,\"token\"])\n"
          assert pathlib.Path("/etc/hostname").read_text().strip()=="host-10-0-0-56"
          assert os.environ.get("RUNNER_NAME")=="oci-ampere-a1"
          assert transport_dir.is_dir() and not transport_dir.is_symlink()
          assert 0 <= time.time()-(transport_dir/"transport.pem").stat().st_mtime < 1200, "Expired transport"
          def rsa(args,data):
              return subprocess.run(["openssl","pkeyutl"]+args+["-pkeyopt","rsa_padding_mode:oaep","-pkeyopt","rsa_oaep_md:sha256","-pkeyopt","rsa_mgf1_md:sha256"],input=data,stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=True).stdout
          try:
              key=b"".join(rsa(["-decrypt","-inkey",str(transport_dir/"transport.pem")],base64.b64decode(c)) for c in chunks)
              key_path=transport_dir/"ssh_key"
              key_path.write_bytes(key)
              key_path.chmod(0o600)
              fingerprint=subprocess.check_output(["ssh-keygen","-lf",str(key_path)],text=True)
              assert "SHA256:g1KQstuyhXrMCEehdi0aTKTybMY0j8R9cJcd+Smqi0o" in fingerprint
              host_key=pathlib.Path("/etc/ssh/ssh_host_ed25519_key.pub").read_text().split()
              known=transport_dir/"known_hosts"
              known.write_text("127.0.0.1 "+host_key[0]+" "+host_key[1]+"\n")
              pub_path=transport_dir/"result_public.pem"
              pub_path.write_text(result_pub)
              p=subprocess.run(["ssh","-F","/dev/null","-i",str(key_path),"-o","BatchMode=yes","-o","IdentitiesOnly=yes","-o","ConnectTimeout=10","-o","StrictHostKeyChecking=yes","-o","UserKnownHostsFile="+str(known),"-o","LogLevel=ERROR","ubuntu@127.0.0.1","/usr/bin/python3","-"],input=inner.encode(),stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=300)
              output=p.stdout
              encrypted=[base64.b64encode(rsa(["-encrypt","-pubin","-inkey",str(pub_path)],output[i:i+250])).decode() for i in range(0,len(output),250)]
              print("SSH_EXIT="+str(p.returncode))
              print("ENCRYPTED_RESULT="+json.dumps(encrypted,separators=(",",":")))
              sys.exit(p.returncode)
          finally:
              shutil.rmtree(transport_dir,ignore_errors=True)
          
          PY
          
