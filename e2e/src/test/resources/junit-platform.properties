# 인수 시나리오는 순서가 곧 의미다.
#
# 트랙 A 가 만든 상품을 B 가 사고, B 가 만든 주문을 C 가 지급·환불한다.
# 단위 테스트라면 순서 의존이 냄새지만 여기서는 **검증 대상 자체가 순서**다 —
# 등록에서 정산까지 한 번 흐르는 것을 보는 것이 이 층의 존재 이유다.
#
# 클래스 순서는 @Order, 메서드 순서도 @Order 로 정한다. 둘 다 명시적으로 켜야 동작한다.
junit.jupiter.testclass.order.default=org.junit.jupiter.api.ClassOrderer$OrderAnnotation
junit.jupiter.testmethod.order.default=org.junit.jupiter.api.MethodOrderer$OrderAnnotation
