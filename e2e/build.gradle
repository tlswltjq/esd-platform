plugins {
    id 'stove.java-base'
}

// 인수 시나리오 — 떠 있는 전체 스택(인프라 12 + 앱 11)을 **밖에서** 두드린다.
//
//   ./gradlew :e2e:e2eTest
//
// `scripts/smoke-stack.sh` 의 인수 45건이 여기로 왔다. 셸이 하던 일이라 옮긴 것이 아니라,
// 셸로는 할 수 없던 것이 있어서 옮겼다 — 정규식 단언(`"grossAmount":18000.*"netAmount":12600,`)이
// 필드 순서에 묶여 있었고, 깨져도 무엇이 틀렸는지 말하지 않았다.
//
// **스프링 컨텍스트를 띄우지 않는다.** 여기서 보는 것은 컨테이너로 배포된 앱 10종이 서로
// 맞물려 도는지이고, 그걸 보려면 이 프로세스가 그 스택의 일부가 아니어야 한다.
// 인프라를 띄워 한 서비스 안을 보는 것은 `integrationTest` 의 일이다(decisions.md 20번).

dependencies {
    // 배포된 API의 오류 문자열을 검증하며 앱의 구현 클래스에는 의존하지 않는다.
    testImplementation 'org.springframework:spring-web'                 // RestClient
    testImplementation 'com.fasterxml.jackson.core:jackson-databind'
    testImplementation 'org.awaitility:awaitility'
    testImplementation project(':common:messaging-kafka')
    // LocalStack 이 인프라를 띄운다(결정 e2e-stack-in-junit). 앱은 컨테이너가 아니라 bootJar 프로세스다.
    testImplementation project(':common:testcontainers')
    // MySQLContainer 가 준비 여부를 JDBC 접속으로 확인한다.
    testRuntimeOnly 'com.mysql:mysql-connector-j'
}

// 소스가 없다. 빈 jar 를 만들면 산출물 목록에 모듈이 아닌 것이 섞인다
// (실행 앱이 plain jar 를 만들지 않는 것과 같은 이유).
tasks.named('jar') { enabled = false }

// **기본 빌드에서 뺀다.** `./gradlew build` 는 스택이 떠 있다고 가정할 수 없다.
// 여기가 켜져 있으면 컨테이너가 없는 로컬에서 전체 빌드가 항상 빨개진다.
tasks.named('test') { enabled = false }

// 그레이들은 `-D` 를 테스트 JVM 으로 자동 전달하지 않는다. 여기서 넘기지 않으면
// Stove 가 값을 영영 못 본다 — stove.java-base 의 `stove.openapi.update` 와 같은 자리다.
//
// 노브가 하나인 것은 포트가 오프셋 규칙이기 때문이다(Stove 클래스 주석).
def endpoints = ['host', 'port-offset']

// LocalStack 이 띄울 수 있는 앱 전체(StackApp 과 같은 목록).
def localStackApps = ['auth', 'studio', 'web-bff', 'gateway', 'review', 'catalog', 'store', 'order', 'payment',
                      'license', 'download', 'settlement']

// ── 모듈·여정별 검증 태스크 표 ─────────────────────────────────────────
// 태그 하나에 태스크 하나다. 아래 `e2eTest` 의 제외 목록과 태스크 등록이 모두 이 표에서 나온다(결정 e2e-task-table).
// 새 태그를 여기에 더하면 `e2eTest` 에서 자동으로 빠진다.
//   props    : 테스트 JVM 으로 넘기는 `stove.e2e.<이름>` (없으면 빈 문자열)
//   optional : 주어졌을 때만 넘기는 `stove.e2e.<이름>`
//   phase    : `stove.e2e.<property>` 로 고르는 테스트 메서드 하나(재시작을 사이에 둔 단계 실행)
//   expected : 실행 건수. 다르거나 건너뜀이 있으면 failure 문구로 실패한다. 없으면 세지 않는다
//   localStack: 테스트가 스택을 직접 띄운다(LocalStackExtension). 값은 그 여정이 띄우는 앱 목록이고(@LocalStackApps 와 같게 둔다),
//               그 앱의 bootJar 와 MinIO 이미지를 먼저 준비한다
def suites = [
    // 열두 앱. 테스트가 스택을 띄우고 내린다(결정 e2e-stack-in-junit, 시범 1)
    [task: 'ownershipE2eTest', tag: 'ownership',
     description: '실제 BFF 로그인으로 구매자·창작자·운영자가 자기 것만 보고 자기 문만 여는지 검증한다 (스택을 직접 띄운다)',
     localStack: localStackApps,
     expected: 3, failure: 'Ownership verification requires 3 executed checks without skips'],
    // 장애 주입(L7). 앱을 실제로 멈추므로 다른 여정과 같은 실행에 두지 않는다 — 여정 중간에 서비스가 사라지면
    // "인수가 깨졌다"와 "일부러 죽였다"가 리포트에서 같은 모양이 된다. 스택이 테스트의 것이라 따로 뜬다.
    [task: 'chaosTest', tag: 'chaos',
     description: 'License를 실제로 멈추고 격리·닫힌 실패·복구를 검증한다 (스택을 직접 띄우고 멈춘다)',
     localStack: localStackApps,
     expected: 5, failure: 'Chaos verification requires 5 executed checks without skips'],
    // Auth·Gateway·Studio
    [task: 'studioE2eTest', tag: 'studio',
     description: 'Auth·Gateway·Studio만으로 로그인, 소유권, 업로드와 이벤트 처리 경계를 검증한다 (스택을 직접 띄운다)',
     localStack: ['auth', 'studio', 'web-bff', 'gateway'],
     expected: 7, failure: 'Studio E2E requires 7 executed checks without skips'],
    // Auth·Gateway·Studio·Review
    [task: 'reviewE2eTest', tag: 'review',
     description: '실제 로그인·심사·빌드 열람·재심사·출시 요청을 네 모듈로 검증한다 (스택을 직접 띄운다)',
     localStack: ['auth', 'studio', 'web-bff', 'gateway', 'review'],
     expected: 10, failure: 'Review E2E requires 10 executed checks without skips'],
    [task: 'reviewRestartE2eTest', tag: 'review-restart',
     description: 'Review를 재시작해도 저장된 판정이 그대로이고 미발행 Outbox가 복구되는지 검증한다 (스택을 직접 띄우고 재시작한다)',
     localStack: ['auth', 'studio', 'web-bff', 'gateway', 'review'],
     expected: 1, failure: 'Review restart verification requires one executed check without skips'],
    // 다섯 모듈. 실제 프로세스 재시작을 단계로 나눠 검증한다
    [task: 'catalogE2eTest', tag: 'catalog',
     description: '실제 심사·출시·공개 조회와 Catalog 재시작 후 결과 복구를 검증한다',
     props: ['catalog-evidence'],
     phase: [test: 'CatalogPublicationFlowTest', property: 'catalog-phase',
             first: 'publishesOnlyApprovedRequestedSnapshotsAndReplacesAfterNewReview'],
     expected: 1, failure: 'Catalog verification requires one executed check without skips'],
    // 여섯 모듈
    [task: 'withdrawalE2eTest', tag: 'withdrawal',
     description: '단일 심사·명시적 철회·동일 승인본 재출시와 Catalog 자동 공개 재시작 복구를 검증한다',
     props: ['withdrawal-evidence'],
     phase: [test: 'WithdrawalFlowTest', property: 'withdrawal-phase', first: 'prepareQueuedRelease'],
     expected: 1, failure: 'Withdrawal verification requires one executed check without skips'],
    [task: 'g4OperationsE2eTest', tag: 'g4-operations',
     description: '출시·철회부터 Store 복구·판매/노출/다운로드 제어·기존 구매권까지 연결한다 (결제 결과는 계약 픽스처)',
     props: ['kafka-brokers', 'g4-evidence', 'g4-secrets'],
     phase: [test: 'G4OperationsFlowTest', property: 'g4-phase', first: 'publishesAndPreparesOwnedAndPendingOrders'],
     expected: 1, failure: 'G4 operations requires one executed check without skips'],
    [task: 'storeE2eTest', tag: 'store',
     description: '공개 상품의 Store 검색·사본 갱신·HTTP 초기화·재시작을 검증한다',
     props: ['store-evidence'],
     phase: [test: 'StorePublicationFlowTest', property: 'store-phase',
             first: 'publishesSearchesAndReplacesOnlyReleasedSnapshots'],
     expected: 1, failure: 'Store verification requires one executed check without skips'],
    // 일곱 앱. 격리 Order 검증에서 Payment 는 계약 픽스처다
    [task: 'orderE2eTest', tag: 'order',
     description: '공개 상품 주문·결제 결과 계약·장애와 재시작을 검증한다',
     props: ['kafka-brokers', 'order-evidence'],
     phase: [test: 'OrderPurchaseFlowTest', property: 'order-phase', first: 'preparesOrdersWithRelayPaused'],
     expected: 1, failure: 'Order verification requires one executed check without skips'],
    // 여덟 앱. 실제 Payment 작업자
    [task: 'paymentE2eTest', tag: 'payment',
     description: '주문·결제·결과 반영과 응답 유실·재시작·발행 복구를 검증한다',
     props: ['kafka-brokers', 'payment-evidence'],
     phase: [test: 'PaymentPurchaseFlowTest', property: 'payment-phase', first: 'prepareReceiptWithoutProcessing'],
     expected: 1, failure: 'Payment verification requires one executed check without skips'],
    // 아홉 앱
    [task: 'licenseE2eTest', tag: 'license',
     description: '결제 완료 주문의 권한 지급·라이브러리·반복 구매·중단과 재시작을 검증한다',
     props: ['kafka-brokers', 'license-evidence'],
     phase: [test: 'LicensePurchaseFlowTest', property: 'license-phase', first: 'preparePendingPurchase'],
     expected: 1, failure: 'License verification requires one executed check without skips'],
    // 메시징 비교 실험의 부하 드라이버(결정 204 G). 검증이 아니라 측정이라 건수를 세지 않는다.
    //   ./gradlew :e2e:messagingLoadTest -Dstove.e2e.port-offset=<오프셋> -Dstove.e2e.load-rate=5 \
    //       -Dstove.e2e.load-duration-secs=300 -Dstove.e2e.load-evidence=runs/load.json
    [task: 'messagingLoadTest', tag: 'messaging-load',
     description: '정해진 도착률로 주문을 만들어 메시징 비교 실험의 부하를 건다 (스택이 먼저 떠 있어야 한다)',
     props: ['load-rate', 'load-duration-secs', 'load-warmup-secs', 'load-buyers', 'load-refund-every', 'load-evidence']],
    // 열 앱과 실제 전체 빌드 전송
    [task: 'downloadE2eTest', tag: 'download',
     description: '보유권·현재 공개본·실제 ZIP 다운로드와 만료·장애·재시작을 검증한다',
     props: ['download-evidence'],
     phase: [test: 'DownloadPurchaseFlowTest', property: 'download-phase', first: 'preparePendingPurchase'],
     expected: 1, failure: 'Download verification requires one executed check without skips'],
    [task: 'tracingE2eTest', tag: 'tracing',
     description: '현행 구매·Payment 내구 재개·별도 Download의 실제 Tempo 연결을 검증한다',
     optional: ['tempo-base-url', 'tracing-evidence', 'tracing-scenario', 'tracing-sampled', 'tracing-expected-state'],
     phase: [test: 'TracePropagationE2eTest', property: 'tracing-phase', first: 'prepareTwoDurableReceipts'],
     expected: 1, failure: 'Tracing verification requires one executed check without skips'],
    // 열두 앱 전체 스택(verify-jib.py). 결제는 프로세스 안 승인 어댑터가 확정한다(결정 in-process-pg-approval)
    [task: 'purchaseE2eTest', tag: 'purchase',
     description: '실제 구매·지급·다운로드와 소비를 끈 Settlement의 조회 경계를 검증한다',
     phase: [test: 'PurchaseDownloadFlowTest', property: 'purchase-phase', first: 'purchasesAndDownloads'],
     expected: 1, failure: 'Purchase verification requires one executed check without skips'],
]

// `api-demo` 는 태스크 없이 빼 두는 태그다.
def tagsOutsideJourney = ['api-demo'] + suites.collect { it.tag }

tasks.register('e2eTest', Test) {
    group = 'verification'
    description = '떠 있는 스택의 Outbox 적체 수렴과 DLT 유입 없음을 확인한다 (스택이 먼저 떠 있어야 한다)'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    // 장애 주입 장은 여기서 뺀다. **저니와 같은 태스크에 두면 안 된다** —
    // 서비스를 중간에 정지시키므로 관계없는 판정들이 무더기로 빨개지고,
    // 그러면 "인수가 깨졌다" 와 "일부러 죽였다" 가 같은 리포트에 같은 모양으로 남는다.
    // 실행 정책을 필요 자원으로 가르는 이 저장소의 규칙 그대로다(build-logic 의 stove.java-base) —
    // 저 장이 요구하는 자원은 '망가뜨려도 되는 스택' 이라 e2e 와도 다르다.
    useJUnitPlatform { excludeTags(*tagsOutsideJourney) }

    endpoints.each { name ->
        systemProperty "stove.e2e.${name}",
                providers.systemProperty("stove.e2e.${name}").getOrElse('')
    }

    // 옛 인수 여정(트랙 A·B·C, 결제 실패·시뮬레이터·행사)은 지금 없는 API를 불러 지웠다(플랫폼 T43).
    // 남은 것은 여정 뒤에 보는 관측 두 건(OutboxDrainE2eTest·DeadLetterE2eTest)이다.
    // 여정은 위 표의 태그별 태스크가 맡는다.
    maxParallelForks = 1

    // **이 태스크는 절대 건너뛰지 않는다.**
    //
    // 처음 붙였을 때 실제로 당했다 — 원격에서 두 번째로 부르니 `:e2e:e2eTest UP-TO-DATE`,
    // `BUILD SUCCESSFUL in 1s`. 42건 중 한 건도 돌지 않았는데 초록이었다.
    //
    // stove.java-base 가 같은 함정을 이미 막아 두었지만 그쪽은 `CI` 환경변수가 있을 때뿐이다.
    // 로컬을 열어 둔 근거는 "반복 루프에서는 캐시가 맞다" 였고, 그 근거가 여기서는 성립하지 않는다 —
    // **이 태스크의 진짜 입력은 소스가 아니라 떠 있는 스택이다.** 그레이들은 그것을 볼 수 없으므로,
    // 소스가 그대로면 언제나 "같다" 고 판단한다. 앱을 재배포하고 다시 부르는 것이 이 층의 기본 사용법인데
    // 그때마다 검증이 조용히 건너뛰어진다.
    //
    // 아래 실행 건수 보고도 이것만으로는 못 막는다. 건너뛴 태스크는 afterSuite 자체를 부르지 않아
    // **아무 줄도 출력되지 않는다** — 요약이 없는 것과 0건인 것이 화면에서 같아 보인다.
    outputs.upToDateWhen { false }
    outputs.cacheIf { false }

    testLogging {
        events 'passed', 'failed'
        exceptionFormat = 'full'
        // 이 층은 판정만이 아니라 **숫자를 기록한다** — 종단 지연, DLT 카운터의 유무.
        // 기본값으로 두면 테스트가 찍은 것이 콘솔에 오지 않아, 기록하기로 한 값이 아무 데도 남지 않는다.
        showStandardStreams = true
    }

    // **몇 건이 돌았는지 말하게 한다.**
    //
    // 루트의 `defectTest` 합산 보고와 같은 이유다. "돌았는가" 와 "통과했는가" 가 화면에서
    // 구분되지 않으면 필터 오타나 캐시 복원으로 0건이 돈 실행이 초록으로 읽힌다.
    // 셸에서는 EXPECTED_CHECKS 가 그 자리를 지켰다.
    //
    // 캐시 쪽은 stove.java-base 가 이미 막아 두었다 — CI 에서는 모든 Test 태스크가 UP-TO-DATE·FROM-CACHE 로
    // 건너뛰어지지 않는다(decisions.md 12번 옆 흐름). 여기서는 세어서 말하는 것만 한다.
    afterSuite { desc, result ->
        if (desc.parent == null) {
            println '════════════════════════════════'
            println "  e2e ${result.testCount}건 실행 — 통과 ${result.successfulTestCount}" +
                    " / 실패 ${result.failedTestCount} / 건너뜀 ${result.skippedTestCount}"
            if (result.testCount == 0) {
                println '  (0건이다. 통과가 아니라 미실행이다 — 클래스패스와 필터를 확인한다)'
            }
            println '════════════════════════════════'
        }
    }
}

// MinIO 이미지 선택(루트 build.gradle).
def minioImageSelection = rootProject.ext.minioImageSelection

// ── 표의 태스크 등록 ───────────────────────────────────────────────────
suites.each { suite ->
    tasks.register(suite.task, Test) {
        group = 'verification'
        description = suite.description
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform { includeTags suite.tag }
        (endpoints + (suite.props ?: [])).each { name ->
            systemProperty "stove.e2e.${name}", providers.systemProperty("stove.e2e.${name}").getOrElse('')
        }
        (suite.optional ?: []).each { name ->
            if (providers.systemProperty("stove.e2e.${name}").isPresent())
                systemProperty "stove.e2e.${name}", providers.systemProperty("stove.e2e.${name}").get()
        }
        if (suite.localStack) {
            suite.localStack.each { app -> dependsOn ":apps:${app}:bootJar" }
            systemProperty 'stove.e2e.repo-root', rootDir.absolutePath
            // 기동 시간 같은 숫자를 콘솔에 남긴다.
            testLogging.showStandardStreams = true
            environment 'STOVE_TEST_MINIO_IMAGE', minioImageSelection.testImage
            if (minioImageSelection.fromSource) {
                dependsOn ':infra:minio:tagTestImage'
            }
        }
        if (suite.phase) {
            String method = providers.systemProperty("stove.e2e.${suite.phase.property}").getOrElse(suite.phase.first)
            filter { includeTestsMatching "com.stove.e2e.${suite.phase.test}.${method}" }
        }
        maxParallelForks = 1
        // e2eTest 와 같은 이유다 — 진짜 입력은 소스가 아니라 떠 있는 스택이다.
        outputs.upToDateWhen { false }
        outputs.cacheIf { false }
        testLogging { events 'passed', 'failed'; exceptionFormat = 'full' }
        if (suite.expected != null) {
            int expected = suite.expected
            String failure = suite.failure
            afterSuite { desc, result ->
                if (desc.parent == null && (result.testCount != expected || result.skippedTestCount != 0)) {
                    throw new GradleException(failure)
                }
            }
        }
    }
}
